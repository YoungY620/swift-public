name: Forecast Edge post-run agent audit

on:
  workflow_run:
    workflows:
      - Forecast Edge research and optional execution
    types:
      - completed
  workflow_dispatch:
    inputs:
      parent-run-id:
        description: Completed Forecast Edge parent workflow run id to audit
        required: true
        type: string
      trip-circuit-breaker:
        description: Allow this manual historical replay to disable production on a serious finding
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: forecast-edge-audit-${{ github.event.workflow_run.id || inputs['parent-run-id'] }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      audit-applicable: ${{ steps.select.outputs.audit-applicable }}
    env:
      PARENT_RUN_ID: ${{ github.event.workflow_run.id || inputs['parent-run-id'] }}
      EXPECTED_PARENT_WORKFLOW: Forecast Edge research and optional execution
    steps:
      - name: Select completed iterations that need agent review
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PARENT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::parent-run-id must be a GitHub Actions run id"
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID")
          jobs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100" \
            | jq -s '[.[].jobs[]]')
          jq -e \
            --arg expected "$EXPECTED_PARENT_WORKFLOW" \
            '.name == $expected and .status == "completed"' <<< "$run" >/dev/null
          applicable=$(jq -rn \
            --argjson run "$run" \
            --argjson jobs "$jobs" \
            '($run.conclusion != "success") or any($jobs[]; (.name | test("^research(?: /|$)")) and .conclusion != "skipped")')
          echo "audit-applicable=$applicable" >> "$GITHUB_OUTPUT"
          if [[ "$applicable" != "true" ]]; then
            echo "Successful hourly wake-up was gated off; no research or execution result needs agent review." >> "$GITHUB_STEP_SUMMARY"
          fi

  audit:
    needs: select
    if: ${{ needs.select.outputs.audit-applicable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      overall_status: ${{ steps.classify.outputs.overall_status }}
      confidence: ${{ steps.classify.outputs.confidence }}
      serious_findings: ${{ steps.classify.outputs.serious_findings }}
      trip_required: ${{ steps.classify.outputs.trip_required }}
      breaker_succeeded: ${{ steps.breaker.outputs.breaker_succeeded }}
    permissions:
      actions: write
      contents: read
    env:
      PARENT_RUN_ID: ${{ github.event.workflow_run.id || inputs['parent-run-id'] }}
      EXPECTED_PARENT_WORKFLOW: Forecast Edge research and optional execution
      CIRCUIT_BREAKER_ENABLED: ${{ github.event_name == 'workflow_run' || inputs['trip-circuit-breaker'] == true }}
      KIMI_CODE_VERSION: "0.37.0"
      KIMI_MODEL_NAME: kimi-for-coding
      KIMI_MODEL_PROVIDER_TYPE: kimi
      KIMI_MODEL_BASE_URL: https://api.kimi.com/coding/v1
      KIMI_DISABLE_TELEMETRY: "1"
      AUDIT_RUBRIC_PATH: ${{ github.workspace }}/automation/audit/forecast-edge-audit-rubric.json
      AUDIT_SCHEMA_PATH: ${{ github.workspace }}/schemas/forecast-edge-audit.schema.json
      AUDIT_PROMPT_PATH: ${{ github.workspace }}/automation/prompts/forecast-edge-audit.zh-CN.md
      AUDIT_AGENT_PROFILE_PATH: ${{ github.workspace }}/automation/agents/forecast-edge-auditor.md

    steps:
      - name: Check out trusted audit code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate audit configuration
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PARENT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::parent-run-id must be a GitHub Actions run id"
            exit 1
          fi
          if [[ -z "$KIMI_MODEL_API_KEY" ]]; then
            echo "::error::Required Actions secret KIMI_CODE_API_KEY is not configured"
            exit 1
          fi
          for required_tool in gh jq npm python3 sha256sum stdbuf tee; do
            if ! command -v "$required_tool" >/dev/null; then
              echo "::error::Audit runner is missing required tool: $required_tool"
              exit 1
            fi
          done
          runtime_dir="$RUNNER_TEMP/forecast-edge-audit-$PARENT_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$runtime_dir/evidence/release"
          {
            echo "AUDIT_RUNTIME_DIR=$runtime_dir"
            echo "AUDIT_EVIDENCE_DIR=$runtime_dir/evidence"
            echo "AUDIT_EVIDENCE_PATH=$runtime_dir/evidence/evidence.json"
            echo "AUDIT_AGENT_DIR=$runtime_dir/agent"
            echo "AUDIT_AGENT_RESPONSE_PATH=$runtime_dir/agent-response.json"
            echo "AUDIT_AGENT_RAW_RESPONSE_PATH=$runtime_dir/agent-response.raw.jsonl"
            echo "AUDIT_AGENT_TRACE_PATH=$runtime_dir/agent-trace.json"
            echo "AUDIT_RESULT_PATH=$runtime_dir/audit-result.json"
            echo "KIMI_CODE_HOME=$RUNNER_TEMP/kimi-code-audit-home"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kimi-code-audit-${{ env.KIMI_CODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-kimi-code-audit-

      - name: Install pinned Kimi Code Agent runtime and schema validator
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@moonshot-ai/kimi-code@$KIMI_CODE_VERSION"
          python3 -m venv "$AUDIT_RUNTIME_DIR/python-venv"
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" -m pip install \
            --disable-pip-version-check --requirement automation/requirements-github-actions.txt

      - name: Collect read-only parent workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_INTERVAL_HOURS: ${{ vars.FORECAST_EDGE_INTERVAL_HOURS || '8' }}
          CONFIGURED_ANCHOR_UTC_HOUR: ${{ vars.FORECAST_EDGE_ANCHOR_UTC_HOUR || '2' }}
          LIVE_TRADING_ENABLED: ${{ vars.POLYMARKET_LIVE_TRADING_ENABLED || 'false' }}
          AUTOMATION_PAUSED: ${{ vars.FORECAST_EDGE_AUTOMATION_PAUSED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID" > "$AUDIT_EVIDENCE_DIR/run.raw.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100" \
            | jq -s '[.[].jobs[]]' > "$AUDIT_EVIDENCE_DIR/jobs.raw.json"
          jq -e \
            --arg expected "$EXPECTED_PARENT_WORKFLOW" \
            '.name == $expected and .status == "completed"' \
            "$AUDIT_EVIDENCE_DIR/run.raw.json" >/dev/null
          jq '{
            id:(.id|tostring),
            run_number,
            run_attempt,
            event,
            status,
            conclusion,
            head_sha,
            created_at,
            run_started_at,
            updated_at,
            html_url,
            workflow_id
          }' "$AUDIT_EVIDENCE_DIR/run.raw.json" > "$AUDIT_EVIDENCE_DIR/run.json"
          jq '[.[] | {
            id:(.id|tostring),
            name,
            status,
            conclusion,
            started_at,
            completed_at,
            runner_name,
            runner_group_name,
            labels,
            steps:[.steps[]? | {name,status,conclusion,number,started_at,completed_at}]
          }]' "$AUDIT_EVIDENCE_DIR/jobs.raw.json" > "$AUDIT_EVIDENCE_DIR/jobs.json"
          jq -n \
            --arg interval_hours "$CONFIGURED_INTERVAL_HOURS" \
            --arg anchor_utc_hour "$CONFIGURED_ANCHOR_UTC_HOUR" \
            --arg live_trading_enabled "$LIVE_TRADING_ENABLED" \
            --arg automation_paused "$AUTOMATION_PAUSED" \
            --arg circuit_breaker_enabled "$CIRCUIT_BREAKER_ENABLED" \
            '{
              interval_hours:($interval_hours|tonumber),
              anchor_utc_hour:($anchor_utc_hour|tonumber),
              live_trading_enabled:($live_trading_enabled == "true"),
              automation_paused:($automation_paused == "true"),
              circuit_breaker_enabled:($circuit_breaker_enabled == "true")
            }' > "$AUDIT_EVIDENCE_DIR/configuration.json"

      - name: Collect matching final Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$AUDIT_EVIDENCE_DIR/release"
          release_api="$release_dir/release-api.json"
          run_attempt=$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")
          expected_release_tag="forecast-edge-research/run-$PARENT_RUN_ID-attempt-$run_attempt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_dir/releases.pages.json"
          release_tag=$(jq -r --arg expected "$expected_release_tag" \
            '[.[][] | select(.tag_name == $expected) | .tag_name] | first // empty' \
            "$release_dir/releases.pages.json")
          if [[ -n "$release_tag" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" > "$release_api"
            jq '{
              found:true,
              id:(.id|tostring),
              tag_name,
              target_commitish,
              draft,
              prerelease,
              created_at,
              published_at,
              html_url,
              assets:[.assets[] | {name,size,digest,created_at,updated_at}]
            }' "$release_api" > "$release_dir/metadata.json"
            for asset in iteration-release-manifest.json research-release-manifest.json \
              validation-summary.json execution-receipt.json execution-verification.json \
              execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
              if jq -e --arg asset "$asset" '.assets | any(.name == $asset)' "$release_api" >/dev/null; then
                gh release download "$release_tag" --pattern "$asset" --dir "$release_dir"
              fi
            done
          else
            jq -n '{found:false,assets:[]}' > "$release_dir/metadata.json"
          fi
          for optional_json in iteration-release-manifest.json research-release-manifest.json \
            validation-summary.json execution-receipt.json execution-verification.json \
            execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
            if [[ ! -f "$release_dir/$optional_json" ]]; then
              printf 'null\n' > "$release_dir/$optional_json"
            fi
          done
          : > "$release_dir/downloaded-assets.ndjson"
          for optional_json in iteration-release-manifest.json research-release-manifest.json \
            validation-summary.json execution-receipt.json execution-verification.json \
            execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
            if jq -e 'type != "null"' "$release_dir/$optional_json" >/dev/null; then
              jq -cn \
                --arg name "$optional_json" \
                --arg sha256 "$(sha256sum "$release_dir/$optional_json" | cut -d ' ' -f 1)" \
                '{name:$name,sha256:$sha256}' >> "$release_dir/downloaded-assets.ndjson"
            fi
          done
          jq -s '.' "$release_dir/downloaded-assets.ndjson" > "$release_dir/downloaded-assets.json"

      - name: Collect and verify execution diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$AUDIT_EVIDENCE_DIR/diagnostics"
          artifact_dir="$diagnostics_dir/artifact"
          files_dir="$diagnostics_dir/files"
          install -d -m 700 "$artifact_dir"
          run_attempt=$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")
          artifact_name="polymarket-execution-diagnostics-$PARENT_RUN_ID-$run_attempt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[]]' > "$diagnostics_dir/artifacts.json"
          artifact_count=$(jq --arg name "$artifact_name" \
            '[.[] | select(.name == $name)] | length' "$diagnostics_dir/artifacts.json")
          if [[ "$artifact_count" -gt 1 ]]; then
            echo "::error::Parent run has duplicate execution diagnostic artifacts"
            exit 1
          fi
          if [[ "$artifact_count" -eq 1 ]] && \
             [[ "$(jq -r --arg name "$artifact_name" \
               '.[] | select(.name == $name) | .expired' \
               "$diagnostics_dir/artifacts.json")" != "true" ]]; then
            gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$artifact_dir"
            for required in execution-diagnostics.tar.gz execution-diagnostics.sha256 \
              execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
              test -s "$artifact_dir/$required"
            done
            python3 scripts/verify_polymarket_execution_diagnostics.py \
              --archive "$artifact_dir/execution-diagnostics.tar.gz" \
              --checksum "$artifact_dir/execution-diagnostics.sha256" \
              --summary "$artifact_dir/execution-diagnostic-summary.json" \
              --manifest "$artifact_dir/execution-diagnostic-manifest.json" \
              --expected-run-id "$PARENT_RUN_ID" \
              --destination "$files_dir" \
              --output "$diagnostics_dir/metadata.json"
          else
            expired=false
            if [[ "$artifact_count" -eq 1 ]]; then
              expired=true
            fi
            jq -n \
              --arg name "$artifact_name" \
              --argjson expired "$expired" \
              '{schema_version:"1.0",found:false,artifact_verified:false,artifact_name:$name,expired:$expired}' \
              > "$diagnostics_dir/metadata.json"
          fi
          extracted="$files_dir/execution-diagnostics"
          for optional_json in diagnostic-summary.json diagnostic-manifest.json \
            plan.json preflight.json receipt.json verification.json ledger-snapshot.json; do
            if [[ ! -f "$extracted/$optional_json" ]]; then
              printf 'null\n' > "$diagnostics_dir/$optional_json"
            else
              install -m 600 "$extracted/$optional_json" "$diagnostics_dir/$optional_json"
            fi
          done
          if [[ -f "$extracted/phase-events.ndjson" ]]; then
            jq -s '.' "$extracted/phase-events.ndjson" > "$diagnostics_dir/phase-events.json"
          else
            printf '[]\n' > "$diagnostics_dir/phase-events.json"
          fi

      - name: Normalize and safety-check audit evidence
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$AUDIT_EVIDENCE_DIR/release"
          python3 scripts/forecast_edge_workflow_contract.py > "$AUDIT_EVIDENCE_DIR/source-contract.json"
          jq -n \
            --slurpfile run "$AUDIT_EVIDENCE_DIR/run.json" \
            --slurpfile jobs "$AUDIT_EVIDENCE_DIR/jobs.json" \
            --slurpfile configuration "$AUDIT_EVIDENCE_DIR/configuration.json" \
            --slurpfile source_contract "$AUDIT_EVIDENCE_DIR/source-contract.json" \
            --slurpfile metadata "$release_dir/metadata.json" \
            --slurpfile downloaded_assets "$release_dir/downloaded-assets.json" \
            --slurpfile manifest "${release_dir}/iteration-release-manifest.json" \
            --slurpfile research_manifest "${release_dir}/research-release-manifest.json" \
            --slurpfile validation_summary "${release_dir}/validation-summary.json" \
            --slurpfile execution_receipt "${release_dir}/execution-receipt.json" \
            --slurpfile execution_verification "${release_dir}/execution-verification.json" \
            --slurpfile release_diagnostic_summary "${release_dir}/execution-diagnostic-summary.json" \
            --slurpfile release_diagnostic_manifest "${release_dir}/execution-diagnostic-manifest.json" \
            --slurpfile diagnostic_metadata "$AUDIT_EVIDENCE_DIR/diagnostics/metadata.json" \
            --slurpfile diagnostic_summary "$AUDIT_EVIDENCE_DIR/diagnostics/diagnostic-summary.json" \
            --slurpfile diagnostic_manifest "$AUDIT_EVIDENCE_DIR/diagnostics/diagnostic-manifest.json" \
            --slurpfile diagnostic_phases "$AUDIT_EVIDENCE_DIR/diagnostics/phase-events.json" \
            --slurpfile diagnostic_plan "$AUDIT_EVIDENCE_DIR/diagnostics/plan.json" \
            --slurpfile diagnostic_preflight "$AUDIT_EVIDENCE_DIR/diagnostics/preflight.json" \
            --slurpfile diagnostic_receipt "$AUDIT_EVIDENCE_DIR/diagnostics/receipt.json" \
            --slurpfile diagnostic_verification "$AUDIT_EVIDENCE_DIR/diagnostics/verification.json" \
            --slurpfile diagnostic_ledger "$AUDIT_EVIDENCE_DIR/diagnostics/ledger-snapshot.json" \
            '{
              run:$run[0],
              jobs:$jobs[0],
              configuration:$configuration[0],
              source_contract:$source_contract[0],
              release:{
                metadata:($metadata[0] + {downloaded_assets:$downloaded_assets[0]}),
                manifest:($manifest[0] // null),
                research_manifest:($research_manifest[0] // null),
                validation_summary:($validation_summary[0] // null),
                execution_receipt:($execution_receipt[0] // null),
                execution_verification:($execution_verification[0] // null),
                execution_diagnostic_summary:($release_diagnostic_summary[0] // null),
                execution_diagnostic_manifest:($release_diagnostic_manifest[0] // null)
              },
              diagnostics:{
                metadata:$diagnostic_metadata[0],
                summary:($diagnostic_summary[0] // null),
                manifest:($diagnostic_manifest[0] // null),
                phase_events:$diagnostic_phases[0],
                plan:($diagnostic_plan[0] // null),
                preflight:($diagnostic_preflight[0] // null),
                receipt:($diagnostic_receipt[0] // null),
                verification:($diagnostic_verification[0] // null),
                ledger:($diagnostic_ledger[0] // null),
                evidence_root:"evidence/diagnostics/files/execution-diagnostics"
              },
              evidence_safety:{secret_value_scan_passed:true},
              agent_response:{available:false}
            }' > "$AUDIT_EVIDENCE_PATH"
          if LC_ALL=C grep -aEq \
            -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|0x[0-9a-fA-F]{130}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{8,}|[Aa]uthorization[[:space:]]*:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}|^[Cc]ookie[[:space:]]*:[[:space:]]|^[Ss]et-[Cc]ookie[[:space:]]*:[[:space:]]' \
            "$AUDIT_EVIDENCE_PATH"; then
            echo "::error::Audit evidence contains secret-like material"
            exit 1
          fi
          jq -e \
            --arg run_id "$PARENT_RUN_ID" \
            '.run.id == $run_id and (.jobs | type == "array") and (.configuration.interval_hours | type == "number")' \
            "$AUDIT_EVIDENCE_PATH" >/dev/null

      - name: Run read-only Kimi Code Judge agent
        id: audit-agent
        continue-on-error: true
        timeout-minutes: 10
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$AUDIT_AGENT_DIR"
          install -d -m 700 "$AUDIT_AGENT_DIR/evidence"
          cp -R "$AUDIT_EVIDENCE_DIR/." "$AUDIT_AGENT_DIR/evidence/"
          install -m 600 "$AUDIT_RUBRIC_PATH" "$AUDIT_AGENT_DIR/rubric.json"
          install -m 600 "$AUDIT_SCHEMA_PATH" "$AUDIT_AGENT_DIR/audit.schema.json"
          install -m 600 "$AUDIT_PROMPT_PATH" "$AUDIT_AGENT_DIR/prompt.md"
          cd "$AUDIT_AGENT_DIR"
          set +e
          stdbuf -oL -eL kimi --agent-file "$AUDIT_AGENT_PROFILE_PATH" \
            --output-format stream-json \
            -p "请遵循 prompt.md，作为只读 Judge Agent 主动检查本目录证据并输出最终审计 JSON。" \
            2> >(stdbuf -oL tee "$AUDIT_RUNTIME_DIR/agent.stderr" >&2) \
            | stdbuf -oL tee "$AUDIT_AGENT_RAW_RESPONSE_PATH"
          kimi_status=${PIPESTATUS[0]}
          set -e
          if (( kimi_status != 0 )); then
            echo "::error::Audit Kimi Code Judge failed; the raw stream was retained"
            exit "$kimi_status"
          fi
          if grep -Fq -- "$KIMI_MODEL_API_KEY" "$AUDIT_AGENT_RAW_RESPONSE_PATH"; then
            echo "::error::Audit agent response contained protected credential material"
            exit 1
          fi
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" extract \
            --input "$AUDIT_AGENT_RAW_RESPONSE_PATH" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$AUDIT_EVIDENCE_PATH" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --output "$AUDIT_AGENT_RESPONSE_PATH" \
            --trace-output "$AUDIT_AGENT_TRACE_PATH"
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" normalize \
            --input "$AUDIT_AGENT_RESPONSE_PATH" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$AUDIT_EVIDENCE_PATH" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --output "$AUDIT_AGENT_RESPONSE_PATH.normalized"
          mv "$AUDIT_AGENT_RESPONSE_PATH.normalized" "$AUDIT_AGENT_RESPONSE_PATH"

      - name: Validate agent judgment or produce fail-closed audit
        shell: bash
        run: |
          set -euo pipefail
          validator="$AUDIT_RUNTIME_DIR/python-venv/bin/python"
          if [[ "${{ steps.audit-agent.outcome }}" == "success" ]] && \
            "$validator" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" validate \
              --input "$AUDIT_AGENT_RESPONSE_PATH" \
              --rubric "$AUDIT_RUBRIC_PATH" \
              --evidence "$AUDIT_EVIDENCE_PATH" \
              --schema "$AUDIT_SCHEMA_PATH" \
              --output "$AUDIT_RESULT_PATH"; then
            echo "Validated the audit agent's structured judgment"
          else
            printf '%s\n' 'agent response unavailable or invalid' > "$AUDIT_RUNTIME_DIR/fallback-reason.txt"
            "$validator" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" fallback \
              --input "$AUDIT_RUNTIME_DIR/fallback-reason.txt" \
              --rubric "$AUDIT_RUBRIC_PATH" \
              --evidence "$AUDIT_EVIDENCE_PATH" \
              --schema "$AUDIT_SCHEMA_PATH" \
              --parent-run-id "$PARENT_RUN_ID" \
              --output "$AUDIT_RESULT_PATH"
          fi
          jq -e --arg run_id "$PARENT_RUN_ID" '.parent_run_id == $run_id' "$AUDIT_RESULT_PATH" >/dev/null

      - name: Classify audit outcome and breaker requirement
        id: classify
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          overall=INSUFFICIENT_EVIDENCE
          confidence=LOW
          serious_findings='["AUDIT-INFRASTRUCTURE"]'
          if [[ -n "${AUDIT_RESULT_PATH:-}" && -s "$AUDIT_RESULT_PATH" ]] && \
             jq -e '.overall_status and .confidence and (.checks | type == "array")' \
               "$AUDIT_RESULT_PATH" >/dev/null; then
            overall=$(jq -r '.overall_status' "$AUDIT_RESULT_PATH")
            confidence=$(jq -r '.confidence' "$AUDIT_RESULT_PATH")
            serious_findings=$(jq -c '[
              .checks[]
              | select(
                  (.status == "FAIL")
                  or (
                    (.severity == "critical" or .severity == "high")
                    and .status == "INSUFFICIENT_EVIDENCE"
                  )
                )
              | .id
            ]' "$AUDIT_RESULT_PATH")
          fi
          trip_required=false
          if [[ "$CIRCUIT_BREAKER_ENABLED" == "true" ]] && \
             [[ "$(jq 'length' <<< "$serious_findings")" -gt 0 ]]; then
            trip_required=true
          fi
          {
            echo "overall_status=$overall"
            echo "confidence=$confidence"
            echo "serious_findings=$serious_findings"
            echo "trip_required=$trip_required"
          } >> "$GITHUB_OUTPUT"

      - name: Publish sanitized audit summary
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Forecast Edge post-run audit\n\n'
            printf -- '- Parent run: [%s](%s)\n' \
              "$PARENT_RUN_ID" "$(jq -r '.run.html_url' "$AUDIT_EVIDENCE_PATH")"
            printf -- '- Overall status: `%s`\n' "$(jq -r '.overall_status' "$AUDIT_RESULT_PATH")"
            printf -- '- Confidence: `%s`\n\n' "$(jq -r '.confidence' "$AUDIT_RESULT_PATH")"
            printf -- '- Automatic circuit breaker armed: `%s`\n\n' "$CIRCUIT_BREAKER_ENABLED"
            printf '## Checks\n\n'
            printf '| Check | Severity | Status | Reason |\n'
            printf '|---|---|---|---|\n'
            jq -r '.checks[] | "| `\(.id)` | \(.severity) | `\(.status)` | \(.reason | gsub("[\\r\\n|]"; " ")) |"' \
              "$AUDIT_RESULT_PATH"
            printf '\n## Anomalies\n\n'
            if [[ "$(jq '.anomalies | length' "$AUDIT_RESULT_PATH")" -eq 0 ]]; then
              printf '_No evidence-backed anomaly was reported._\n'
            else
              jq -r '.anomalies[] | "- **\(.severity)** `\(.check_id)`: \(.summary | gsub("[\\r\\n]"; " "))"' \
                "$AUDIT_RESULT_PATH"
            fi
            printf '\n## Missing evidence\n\n'
            if [[ "$(jq '.missing_evidence | length' "$AUDIT_RESULT_PATH")" -eq 0 ]]; then
              printf '_None._\n'
            else
              jq -r '.missing_evidence[] | "- " + (gsub("[\\r\\n]"; " "))' "$AUDIT_RESULT_PATH"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trip production circuit breaker on serious findings
        id: breaker
        if: ${{ always() && steps.classify.outputs.trip_required == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FORECAST_EDGE_BREAKER_TOKEN || github.token }}
          SERIOUS_FINDINGS: ${{ steps.classify.outputs.serious_findings }}
        shell: bash
        run: |
          set -euo pipefail
          echo "breaker_succeeded=false" >> "$GITHUB_OUTPUT"
          breaker_failed=false
          if ! gh variable set POLYMARKET_LIVE_TRADING_ENABLED \
            --repo "$GITHUB_REPOSITORY" --body false; then
            echo "::error::Could not disarm the persistent live-trading variable"
            breaker_failed=true
          fi
          if ! gh variable set FORECAST_EDGE_AUTOMATION_PAUSED \
            --repo "$GITHUB_REPOSITORY" --body true; then
            echo "::error::Could not set the persistent automation pause variable"
            breaker_failed=true
          fi
          if ! gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/forecast-edge.yml/disable"; then
            echo "::error::Could not disable the Forecast Edge parent workflow"
            breaker_failed=true
          fi
          finding_ids=$(jq -r 'join(", ")' <<< "$SERIOUS_FINDINGS")
          {
            printf '\n## Production circuit breaker\n\n'
            printf -- '- Triggered: `true`\n'
            printf -- '- Serious checks: `%s`\n' "$finding_ids"
            printf -- '- Live trading requested off: `true`\n'
            printf -- '- Parent workflow disable requested: `true`\n'
            printf -- '- Recovery requires explicit workflow enablement and live-trading re-arm.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$breaker_failed" == "true" ]]; then
            exit 1
          fi
          echo "breaker_succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Enforce critical audit outcome
        shell: bash
        run: |
          set -euo pipefail
          overall=$(jq -r '.overall_status' "$AUDIT_RESULT_PATH")
          if [[ "$overall" == "FAIL" || "$overall" == "INSUFFICIENT_EVIDENCE" ]]; then
            echo "::error::Forecast Edge audit concluded $overall"
            exit 1
          fi

      - name: Remove private audit runtime
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${AUDIT_RUNTIME_DIR:-}" && \
                "$AUDIT_RUNTIME_DIR" == "$RUNNER_TEMP"/forecast-edge-audit-* && \
                -d "$AUDIT_RUNTIME_DIR" ]]; then
            find "$AUDIT_RUNTIME_DIR" -depth -delete
          fi

  notify:
    needs: [select, audit]
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      needs.select.outputs.audit-applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
      AUDIT_JOB_RESULT: ${{ needs.audit.result }}
      AUDIT_OVERALL_STATUS: ${{ needs.audit.outputs.overall_status }}
      AUDIT_CONFIDENCE: ${{ needs.audit.outputs.confidence }}
      SERIOUS_FINDINGS: ${{ needs.audit.outputs.serious_findings }}
      TRIP_REQUIRED: ${{ needs.audit.outputs.trip_required }}
      BREAKER_SUCCEEDED: ${{ needs.audit.outputs.breaker_succeeded }}
    steps:
      - name: Send final production iteration status to Feishu
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for required in FEISHU_APP_ID FEISHU_APP_SECRET FEISHU_CHAT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Required Feishu notification secret is unavailable"
              exit 1
            fi
          done

          run_path="$RUNNER_TEMP/parent-run.json"
          jobs_path="$RUNNER_TEMP/parent-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID" > "$run_path"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100" \
            | jq -s '[.[].jobs[]]' > "$jobs_path"
          stage_result() {
            jq -r --arg pattern "$1" '
              [ .[] | select(.name | test($pattern)) | (.conclusion // "unknown") ] as $values
              | if ($values | length) == 0 then "missing"
                elif any($values[]; . == "failure" or . == "cancelled" or . == "timed_out") then "failure"
                elif any($values[]; . == "success") then "success"
                elif all($values[]; . == "skipped") then "skipped"
                else ($values | unique | join(","))
                end
            ' "$jobs_path"
          }
          parent_conclusion=$(jq -r '.conclusion // "unknown"' "$run_path")
          parent_url=$(jq -r '.html_url' "$run_path")
          gate_result=$(stage_result '^gate(?: /|$)')
          research_result=$(stage_result '^research(?: /|$)')
          execution_result=$(stage_result '^execution(?: /|$)')
          release_result=$(stage_result '^release(?: /|$)')
          cleanup_result=$(stage_result '^cleanup(?: /|$)')
          overall=${AUDIT_OVERALL_STATUS:-INSUFFICIENT_EVIDENCE}
          confidence=${AUDIT_CONFIDENCE:-LOW}
          audit_job=${AUDIT_JOB_RESULT:-failure}
          if jq -e 'type == "array"' <<< "${SERIOUS_FINDINGS:-[]}" >/dev/null 2>&1; then
            finding_ids=$(jq -r 'if length == 0 then "无" else join(", ") end' \
              <<< "${SERIOUS_FINDINGS:-[]}")
          else
            finding_ids="AUDIT-INFRASTRUCTURE"
          fi
          breaker_status="未触发"
          if [[ "${TRIP_REQUIRED:-false}" == "true" ]]; then
            if [[ "${BREAKER_SUCCEEDED:-false}" == "true" ]]; then
              breaker_status="已触发；交易已关闭、调度已暂停、父 workflow 已禁用"
            else
              breaker_status="需要触发但操作失败或不完整，请立即人工检查"
            fi
          fi

          template=blue
          if [[ "$parent_conclusion" != "success" || "$audit_job" != "success" || \
                "$overall" == "FAIL" || "$overall" == "INSUFFICIENT_EVIDENCE" ]]; then
            template=red
          elif [[ "$overall" == "WARN" ]]; then
            template=orange
          fi
          message_path="$RUNNER_TEMP/forecast-edge-final-status.md"
          {
            printf '**父流程**：[%s](%s) · `%s`\n' "$PARENT_RUN_ID" "$parent_url" "$parent_conclusion"
            printf '**阶段**：gate `%s` · research `%s` · execution `%s` · release `%s` · cleanup `%s`\n' \
              "$gate_result" "$research_result" "$execution_result" "$release_result" "$cleanup_result"
            printf '**Agent Judge**：job `%s` · 结论 `%s` · 置信度 `%s`\n' \
              "$audit_job" "$overall" "$confidence"
            printf '**严重检查项**：%s\n' "$finding_ids"
            printf '**生产熔断**：%s\n' "$breaker_status"
            printf '**审计运行**：[%s](https://github.com/%s/actions/runs/%s)\n' \
              "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$message_path"

          token_response=$(
            jq -cn \
              --arg app_id "$FEISHU_APP_ID" \
              --arg app_secret "$FEISHU_APP_SECRET" \
              '{app_id:$app_id, app_secret:$app_secret}' \
              | curl --fail-with-body --silent --show-error \
                  --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                  --request POST \
                  --header 'Content-Type: application/json; charset=utf-8' \
                  --data-binary @- \
                  https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal
          )
          tenant_token=$(jq -er \
            'select(.code == 0) | .tenant_access_token | select(type == "string" and length > 0)' \
            <<< "$token_response")
          echo "::add-mask::$tenant_token"
          message_payload=$(
            jq -cn \
              --arg receive_id "$FEISHU_CHAT_ID" \
              --arg uuid "forecast-edge-final-$PARENT_RUN_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --arg title "Forecast Edge 最终状态 — run $PARENT_RUN_ID" \
              --arg template "$template" \
              --rawfile message "$message_path" \
              '{
                receive_id:$receive_id,
                msg_type:"interactive",
                content:({
                  schema:"2.0",
                  config:{wide_screen_mode:true},
                  header:{title:{tag:"plain_text",content:$title},template:$template},
                  body:{elements:[{tag:"markdown",content:$message}]}
                } | tojson),
                uuid:$uuid
              }'
          )
          send_response=$(
            printf '%s' "$message_payload" \
              | curl --fail-with-body --silent --show-error \
                  --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                  --request POST \
                  --header "Authorization: Bearer $tenant_token" \
                  --header 'Content-Type: application/json; charset=utf-8' \
                  --data-binary @- \
                  'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id'
          )
          jq -e '.code == 0 and (.data.message_id | type == "string" and length > 0)' \
            <<< "$send_response" >/dev/null
