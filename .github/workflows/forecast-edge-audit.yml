name: Forecast Edge post-run agent audit

on:
  workflow_run:
    workflows:
      - Forecast Edge research and optional execution
    types:
      - completed
  workflow_dispatch:
    inputs:
      parent-run-id:
        description: Completed Forecast Edge parent workflow run id to audit
        required: true
        type: string
      trip-circuit-breaker:
        description: Allow this manual historical replay to disable production on a serious finding
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: forecast-edge-audit-${{ github.event.workflow_run.id || inputs['parent-run-id'] }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      audit-applicable: ${{ steps.select.outputs.audit-applicable }}
    env:
      PARENT_RUN_ID: ${{ github.event.workflow_run.id || inputs['parent-run-id'] }}
      EXPECTED_PARENT_WORKFLOW: Forecast Edge research and optional execution
      KIMI_CODE_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      FORECAST_EDGE_BREAKER_TOKEN: ${{ secrets.FORECAST_EDGE_BREAKER_TOKEN }}
    steps:
      - name: Select completed iterations that need agent review
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          missing_configuration=()
          for name in KIMI_CODE_API_KEY FEISHU_APP_ID FEISHU_APP_SECRET FEISHU_CHAT_ID \
            FORECAST_EDGE_BREAKER_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing_configuration+=("$name")
            fi
          done
          if (( ${#missing_configuration[@]} > 0 )); then
            printf '::notice::Forecast Edge audit is not configured; skipping this run (missing: %s)\n' \
              "${missing_configuration[*]}"
            echo "audit-applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PARENT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::parent-run-id must be a GitHub Actions run id"
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID")
          jobs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100" \
            | jq -s '[.[].jobs[]]')
          jq -e \
            --arg expected "$EXPECTED_PARENT_WORKFLOW" \
            '.name == $expected and .status == "completed"' <<< "$run" >/dev/null
          applicable=$(jq -rn \
            --argjson run "$run" \
            --argjson jobs "$jobs" \
            '($run.conclusion != "success") or any($jobs[]; (.name | test("^research(?: /|$)")) and .conclusion != "skipped")')
          echo "audit-applicable=$applicable" >> "$GITHUB_OUTPUT"
          if [[ "$applicable" != "true" ]]; then
            echo "Successful hourly wake-up was gated off; no research or execution result needs agent review." >> "$GITHUB_STEP_SUMMARY"
          fi

  audit:
    needs: select
    if: ${{ needs.select.outputs.audit-applicable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      overall_status: ${{ steps.classify.outputs.overall_status }}
      confidence: ${{ steps.classify.outputs.confidence }}
      serious_findings: ${{ steps.classify.outputs.serious_findings }}
      trip_required: ${{ steps.classify.outputs.trip_required }}
      breaker_succeeded: ${{ steps.breaker.outputs.breaker_succeeded }}
      agent_judgment_valid: ${{ steps.audit-result.outputs.agent-judgment-valid }}
      feishu_brief_valid: ${{ steps.feishu-brief.outputs.brief_valid }}
      business_complete: ${{ steps.feishu-brief.outputs.business_complete }}
    permissions:
      actions: write
      contents: read
    env:
      PARENT_RUN_ID: ${{ github.event.workflow_run.id || inputs['parent-run-id'] }}
      EXPECTED_PARENT_WORKFLOW: Forecast Edge research and optional execution
      CIRCUIT_BREAKER_ENABLED: ${{ github.event_name == 'workflow_run' || inputs['trip-circuit-breaker'] == true }}
      KIMI_CODE_VERSION: "0.37.2"
      KIMI_MODEL_NAME: kimi-for-coding
      KIMI_MODEL_PROVIDER_TYPE: kimi
      KIMI_MODEL_BASE_URL: https://api.kimi.com/coding/v1
      KIMI_DISABLE_TELEMETRY: "1"
      FEISHU_BRIEF_IDLE_TIMEOUT_SECONDS: "900"
      AUDIT_RUBRIC_PATH: ${{ github.workspace }}/automation/audit/forecast-edge-audit-rubric.json
      AUDIT_SCHEMA_PATH: ${{ github.workspace }}/schemas/forecast-edge-audit.schema.json
      AUDIT_PROMPT_PATH: ${{ github.workspace }}/automation/prompts/forecast-edge-audit.zh-CN.md
      AUDIT_AGENT_PROFILE_PATH: ${{ github.workspace }}/automation/agents/forecast-edge-auditor.md
      FEISHU_BRIEF_SCHEMA_PATH: ${{ github.workspace }}/schemas/forecast-edge-feishu-brief.schema.json
      FEISHU_BRIEF_PROMPT_PATH: ${{ github.workspace }}/automation/prompts/forecast-edge-feishu-brief.zh-CN.md
      FEISHU_BRIEF_AGENT_PROFILE_PATH: ${{ github.workspace }}/automation/agents/forecast-edge-feishu-reporter.md

    steps:
      - name: Check out trusted audit code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate audit configuration
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PARENT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::parent-run-id must be a GitHub Actions run id"
            exit 1
          fi
          if [[ -z "$KIMI_MODEL_API_KEY" ]]; then
            echo "::error::Required Actions secret KIMI_CODE_API_KEY is not configured"
            exit 1
          fi
          for required_tool in awk find gh jq npm python3 setsid sha256sum stat stdbuf tee; do
            if ! command -v "$required_tool" >/dev/null; then
              echo "::error::Audit runner is missing required tool: $required_tool"
              exit 1
            fi
          done
          runtime_dir="$RUNNER_TEMP/forecast-edge-audit-$PARENT_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$runtime_dir/evidence/release"
          {
            echo "AUDIT_RUNTIME_DIR=$runtime_dir"
            echo "AUDIT_EVIDENCE_DIR=$runtime_dir/evidence"
            echo "AUDIT_EVIDENCE_PATH=$runtime_dir/evidence/evidence.json"
            echo "AUDIT_AGENT_DIR=$runtime_dir/agent"
            echo "AUDIT_AGENT_RESPONSE_PATH=$runtime_dir/agent-response.json"
            echo "AUDIT_AGENT_RAW_RESPONSE_PATH=$runtime_dir/agent-response.raw.jsonl"
            echo "AUDIT_AGENT_TRACE_PATH=$runtime_dir/agent-trace.json"
            echo "AUDIT_RESULT_PATH=$runtime_dir/audit-result.json"
            echo "AUDIT_CLASSIFICATION_PATH=$runtime_dir/audit-classification.json"
            echo "AUDIT_NOTIFICATION_PATH=$runtime_dir/audit-notification.json"
            echo "AUDIT_CONTRACT_PATH=$runtime_dir/audit-contract.json"
            echo "AUDIT_DIAGNOSTICS_ARTIFACT_DIR=$runtime_dir/audit-diagnostics-artifact"
            echo "AUDIT_REPORTS_DIR=$runtime_dir/evidence/report-source"
            echo "AUDIT_REPORT_SOURCE_METADATA_PATH=$runtime_dir/evidence/report-source-metadata.json"
            echo "FEISHU_BRIEF_AGENT_DIR=$runtime_dir/feishu-brief-agent"
            echo "FEISHU_BRIEF_RAW_PATH=$runtime_dir/feishu-brief.raw.jsonl"
            echo "FEISHU_BRIEF_PATH=$runtime_dir/feishu-brief.json"
            echo "FEISHU_BRIEF_TRACE_PATH=$runtime_dir/feishu-brief-trace.json"
            echo "FEISHU_BRIEF_ARTIFACT_DIR=$runtime_dir/feishu-brief-artifact"
            echo "KIMI_CODE_HOME=$RUNNER_TEMP/kimi-code-audit-home"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kimi-code-audit-${{ env.KIMI_CODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-kimi-code-audit-

      - name: Install pinned Kimi Code Agent runtime and schema validator
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@moonshot-ai/kimi-code@$KIMI_CODE_VERSION"
          python3 -m venv "$AUDIT_RUNTIME_DIR/python-venv"
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" -m pip install \
            --disable-pip-version-check --requirement automation/requirements-github-actions.txt

      - name: Collect read-only parent workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_INTERVAL_HOURS: ${{ vars.FORECAST_EDGE_INTERVAL_HOURS || '8' }}
          CONFIGURED_ANCHOR_UTC_HOUR: ${{ vars.FORECAST_EDGE_ANCHOR_UTC_HOUR || '2' }}
          LIVE_TRADING_ENABLED: ${{ vars.POLYMARKET_LIVE_TRADING_ENABLED || 'false' }}
          AUTOMATION_PAUSED: ${{ vars.FORECAST_EDGE_AUTOMATION_PAUSED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID" > "$AUDIT_EVIDENCE_DIR/run.raw.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100" \
            | jq -s '[.[].jobs[]]' > "$AUDIT_EVIDENCE_DIR/jobs.raw.json"
          jq -e \
            --arg expected "$EXPECTED_PARENT_WORKFLOW" \
            '.name == $expected and .status == "completed"' \
            "$AUDIT_EVIDENCE_DIR/run.raw.json" >/dev/null
          jq '{
            id:(.id|tostring),
            run_number,
            run_attempt,
            event,
            status,
            conclusion,
            head_sha,
            created_at,
            run_started_at,
            updated_at,
            html_url,
            workflow_id
          }' "$AUDIT_EVIDENCE_DIR/run.raw.json" > "$AUDIT_EVIDENCE_DIR/run.json"
          jq '[.[] | {
            id:(.id|tostring),
            name,
            status,
            conclusion,
            started_at,
            completed_at,
            runner_name,
            runner_group_name,
            labels,
            steps:[.steps[]? | {name,status,conclusion,number,started_at,completed_at}]
          }]' "$AUDIT_EVIDENCE_DIR/jobs.raw.json" > "$AUDIT_EVIDENCE_DIR/jobs.json"
          jq -n \
            --arg interval_hours "$CONFIGURED_INTERVAL_HOURS" \
            --arg anchor_utc_hour "$CONFIGURED_ANCHOR_UTC_HOUR" \
            --arg live_trading_enabled "$LIVE_TRADING_ENABLED" \
            --arg automation_paused "$AUTOMATION_PAUSED" \
            --arg circuit_breaker_enabled "$CIRCUIT_BREAKER_ENABLED" \
            '{
              interval_hours:($interval_hours|tonumber),
              anchor_utc_hour:($anchor_utc_hour|tonumber),
              live_trading_enabled:($live_trading_enabled == "true"),
              automation_paused:($automation_paused == "true"),
              circuit_breaker_enabled:($circuit_breaker_enabled == "true")
            }' > "$AUDIT_EVIDENCE_DIR/configuration.json"

      - name: Collect matching final Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$AUDIT_EVIDENCE_DIR/release"
          release_api="$release_dir/release-api.json"
          run_attempt=$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")
          expected_release_tag="forecast-edge-research/run-$PARENT_RUN_ID-attempt-$run_attempt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_dir/releases.pages.json"
          release_tag=$(jq -r --arg expected "$expected_release_tag" \
            '[.[][] | select(.tag_name == $expected) | .tag_name] | first // empty' \
            "$release_dir/releases.pages.json")
          if [[ -n "$release_tag" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" > "$release_api"
            jq '{
              found:true,
              id:(.id|tostring),
              tag_name,
              target_commitish,
              draft,
              prerelease,
              created_at,
              published_at,
              html_url,
              assets:[.assets[] | {name,size,digest,created_at,updated_at}]
            }' "$release_api" > "$release_dir/metadata.json"
            for asset in iteration-release-manifest.json research-release-manifest.json \
              research-history.json validation-summary.json execution-receipt.json execution-verification.json \
              execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
              if jq -e --arg asset "$asset" '.assets | any(.name == $asset)' "$release_api" >/dev/null; then
                gh release download "$release_tag" --pattern "$asset" --dir "$release_dir"
              fi
            done
            if [[ -s "$release_dir/research-release-manifest.json" ]]; then
              reports_dir="$release_dir/reports"
              install -d -m 700 "$reports_dir"
              jq -e '
                .schema_version == "2.0" and
                (.reports | type == "array" and length > 0) and
                all(.reports[];
                  (.adapter | type == "string" and test("^[a-z][a-z0-9-]*$")) and
                  .json_asset == ("report-" + .adapter + ".json") and
                  .markdown_asset == ("report-" + .adapter + ".md") and
                  (.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                )
              ' "$release_dir/research-release-manifest.json" >/dev/null
              while IFS=$'\t' read -r json_asset markdown_asset report_sha256; do
                for report_asset in "$json_asset" "$markdown_asset"; do
                  jq -e --arg asset "$report_asset" \
                    '.assets | any(.name == $asset)' "$release_api" >/dev/null
                  gh release download "$release_tag" --pattern "$report_asset" \
                    --dir "$reports_dir"
                done
                test "$(sha256sum "$reports_dir/$json_asset" | cut -d ' ' -f 1)" = \
                  "$report_sha256"
              done < <(
                jq -r '.reports[] | [.json_asset,.markdown_asset,.sha256] | @tsv' \
                  "$release_dir/research-release-manifest.json"
              )
            fi
          else
            jq -n '{found:false,assets:[]}' > "$release_dir/metadata.json"
          fi
          for optional_json in iteration-release-manifest.json research-release-manifest.json \
            research-history.json validation-summary.json execution-receipt.json execution-verification.json \
            execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
            if [[ ! -f "$release_dir/$optional_json" ]]; then
              printf 'null\n' > "$release_dir/$optional_json"
            fi
          done
          : > "$release_dir/downloaded-assets.ndjson"
          for optional_json in iteration-release-manifest.json research-release-manifest.json \
            research-history.json validation-summary.json execution-receipt.json execution-verification.json \
            execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
            if jq -e 'type != "null"' "$release_dir/$optional_json" >/dev/null; then
              jq -cn \
                --arg name "$optional_json" \
                --arg sha256 "$(sha256sum "$release_dir/$optional_json" | cut -d ' ' -f 1)" \
                '{name:$name,sha256:$sha256}' >> "$release_dir/downloaded-assets.ndjson"
            fi
          done
          jq -s '.' "$release_dir/downloaded-assets.ndjson" > "$release_dir/downloaded-assets.json"

      - name: Collect verified report source for audit and notification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$AUDIT_REPORTS_DIR"
          release_reports="$AUDIT_EVIDENCE_DIR/release/reports"
          if [[ -d "$release_reports" ]] && \
             [[ -n "$(find "$release_reports" -maxdepth 1 -name 'report-*.json' -type f -print -quit)" ]]; then
            cp "$release_reports"/report-*.json "$AUDIT_REPORTS_DIR/"
            cp "$release_reports"/report-*.md "$AUDIT_REPORTS_DIR/"
            install -m 600 "$AUDIT_EVIDENCE_DIR/release/research-release-manifest.json" \
              "$AUDIT_REPORTS_DIR/research-release-manifest.json"
            report_files_ndjson="$AUDIT_RUNTIME_DIR/report-source-files.ndjson"
            : > "$report_files_ndjson"
            while IFS= read -r path; do
              jq -cn \
                --arg path "$(basename "$path")" \
                --arg sha256 "$(sha256sum "$path" | cut -d ' ' -f 1)" \
                --arg size "$(stat -c '%s' "$path")" \
                '{path:$path,sha256:$sha256,size:($size|tonumber)}' \
                >> "$report_files_ndjson"
            done < <(find "$AUDIT_REPORTS_DIR" -maxdepth 1 -type f -print | sort)
            jq -s '.' "$report_files_ndjson" > "$AUDIT_RUNTIME_DIR/report-source-files.json"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run_id "$PARENT_RUN_ID" \
              --arg run_attempt "$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")" \
              --arg commit_sha "$(jq -r '.head_sha' "$AUDIT_EVIDENCE_DIR/run.json")" \
              --slurpfile files "$AUDIT_RUNTIME_DIR/report-source-files.json" \
              '{schema_version:"1.0",found:true,verified:true,source:"final_release",repository:$repository,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,commit_sha:$commit_sha,files:$files[0]}' \
              > "$AUDIT_REPORT_SOURCE_METADATA_PATH"
          else
            run_attempt=$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")
            commit_sha=$(jq -r '.head_sha' "$AUDIT_EVIDENCE_DIR/run.json")
            artifact_name="forecast-edge-research-handoff-$PARENT_RUN_ID-$run_attempt"
            artifact_index="$AUDIT_RUNTIME_DIR/research-handoff-artifacts.json"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/artifacts?per_page=100" \
              | jq -s '[.[].artifacts[]]' > "$artifact_index"
            artifact_count=$(jq --arg name "$artifact_name" \
              '[.[] | select(.name == $name)] | length' "$artifact_index")
            if [[ "$artifact_count" -gt 1 ]]; then
              echo "::error::Parent run has duplicate research handoff artifacts"
              exit 1
            fi
            if [[ "$artifact_count" -eq 1 ]] && \
               [[ "$(jq -r --arg name "$artifact_name" '.[] | select(.name == $name) | .expired' "$artifact_index")" != "true" ]]; then
              download_dir="$AUDIT_RUNTIME_DIR/research-handoff-download"
              install -d -m 700 "$download_dir"
              gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$artifact_name" --dir "$download_dir"
              test -s "$download_dir/research-handoff.tar.gz"
              python3 scripts/extract_research_handoff_reports.py \
                --archive "$download_dir/research-handoff.tar.gz" \
                --destination "$AUDIT_REPORTS_DIR" \
                --expected-repository "$GITHUB_REPOSITORY" \
                --expected-run-id "$PARENT_RUN_ID" \
                --expected-run-attempt "$run_attempt" \
                --expected-commit-sha "$commit_sha" \
                --output "$AUDIT_REPORT_SOURCE_METADATA_PATH"
            else
              jq -n \
                --arg name "$artifact_name" \
                --argjson expired "$([[ "$artifact_count" -eq 1 ]] && printf true || printf false)" \
                '{schema_version:"1.0",found:false,verified:false,source:"unavailable",artifact_name:$name,expired:$expired,files:[]}' \
                > "$AUDIT_REPORT_SOURCE_METADATA_PATH"
            fi
          fi
          if [[ ! -f "$AUDIT_REPORTS_DIR/research-release-manifest.json" ]]; then
            printf 'null\n' > "$AUDIT_REPORTS_DIR/research-release-manifest.json"
          fi
          jq -e \
            '.schema_version == "1.0" and (.found | type == "boolean") and (.verified | type == "boolean") and (.files | type == "array")' \
            "$AUDIT_REPORT_SOURCE_METADATA_PATH" >/dev/null

      - name: Collect and verify research diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$AUDIT_EVIDENCE_DIR/research-diagnostics"
          files_dir="$diagnostics_dir/files"
          install -d -m 700 "$files_dir"
          run_attempt=$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")
          artifact_name="forecast-edge-research-diagnostics-$PARENT_RUN_ID-$run_attempt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[]]' > "$diagnostics_dir/artifacts.json"
          artifact_count=$(jq --arg name "$artifact_name" \
            '[.[] | select(.name == $name)] | length' "$diagnostics_dir/artifacts.json")
          if [[ "$artifact_count" -gt 1 ]]; then
            echo "::error::Parent run has duplicate research diagnostic artifacts"
            exit 1
          fi
          expired=false
          if [[ "$artifact_count" -eq 1 ]]; then
            expired=$(jq -r --arg name "$artifact_name" \
              '.[] | select(.name == $name) | .expired' \
              "$diagnostics_dir/artifacts.json")
          fi
          if [[ "$artifact_count" -eq 1 && "$expired" != "true" ]]; then
            gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$files_dir"
            secret_pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|0x[0-9a-fA-F]{130}|[Aa]uthorization[[:space:]]*:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}|[Pp]assword[[:space:]]*[:=][[:space:]]*[^[:space:]]{8,}'
            if LC_ALL=C grep -RIEq -- "$secret_pattern" "$files_dir"; then
              echo "::error::Research diagnostic artifact contains secret-like material"
              exit 1
            fi
            : > "$diagnostics_dir/files.ndjson"
            while IFS= read -r source; do
              relative=${source#"$files_dir/"}
              jq -cn \
                --arg path "$relative" \
                --arg sha256 "$(sha256sum "$source" | cut -d ' ' -f 1)" \
                --arg size "$(stat -c '%s' "$source")" \
                '{path:$path,sha256:$sha256,size:($size|tonumber)}' \
                >> "$diagnostics_dir/files.ndjson"
            done < <(find "$files_dir" -type f -print | sort)
            jq -n \
              --arg name "$artifact_name" \
              --slurpfile files "$diagnostics_dir/files.ndjson" \
              '{schema_version:"1.0",found:true,artifact_verified:true,artifact_name:$name,expired:false,secret_pattern_scan_passed:true,files:$files}' \
              > "$diagnostics_dir/metadata.json"
          else
            jq -n \
              --arg name "$artifact_name" \
              --argjson expired "$expired" \
              '{schema_version:"1.0",found:false,artifact_verified:false,artifact_name:$name,expired:$expired,secret_pattern_scan_passed:null,files:[]}' \
              > "$diagnostics_dir/metadata.json"
          fi

      - name: Collect and verify execution diagnostic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$AUDIT_EVIDENCE_DIR/diagnostics"
          artifact_dir="$diagnostics_dir/artifact"
          files_dir="$diagnostics_dir/files"
          install -d -m 700 "$artifact_dir"
          run_attempt=$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json")
          artifact_name="polymarket-execution-diagnostics-$PARENT_RUN_ID-$run_attempt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[]]' > "$diagnostics_dir/artifacts.json"
          artifact_count=$(jq --arg name "$artifact_name" \
            '[.[] | select(.name == $name)] | length' "$diagnostics_dir/artifacts.json")
          if [[ "$artifact_count" -gt 1 ]]; then
            echo "::error::Parent run has duplicate execution diagnostic artifacts"
            exit 1
          fi
          if [[ "$artifact_count" -eq 1 ]] && \
             [[ "$(jq -r --arg name "$artifact_name" \
               '.[] | select(.name == $name) | .expired' \
               "$diagnostics_dir/artifacts.json")" != "true" ]]; then
            gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$artifact_dir"
            for required in execution-diagnostics.tar.gz execution-diagnostics.sha256 \
              execution-diagnostic-summary.json execution-diagnostic-manifest.json; do
              test -s "$artifact_dir/$required"
            done
            python3 scripts/verify_polymarket_execution_diagnostics.py \
              --archive "$artifact_dir/execution-diagnostics.tar.gz" \
              --checksum "$artifact_dir/execution-diagnostics.sha256" \
              --summary "$artifact_dir/execution-diagnostic-summary.json" \
              --manifest "$artifact_dir/execution-diagnostic-manifest.json" \
              --expected-run-id "$PARENT_RUN_ID" \
              --destination "$files_dir" \
              --output "$diagnostics_dir/metadata.json"
          else
            expired=false
            if [[ "$artifact_count" -eq 1 ]]; then
              expired=true
            fi
            jq -n \
              --arg name "$artifact_name" \
              --argjson expired "$expired" \
              '{schema_version:"1.0",found:false,artifact_verified:false,artifact_name:$name,expired:$expired}' \
              > "$diagnostics_dir/metadata.json"
          fi
          extracted="$files_dir/execution-diagnostics"
          for optional_json in diagnostic-summary.json diagnostic-manifest.json \
            plan.json preflight.json receipt.json verification.json ledger-snapshot.json; do
            if [[ ! -f "$extracted/$optional_json" ]]; then
              printf 'null\n' > "$diagnostics_dir/$optional_json"
            else
              install -m 600 "$extracted/$optional_json" "$diagnostics_dir/$optional_json"
            fi
          done
          if [[ -f "$extracted/phase-events.ndjson" ]]; then
            jq -s '.' "$extracted/phase-events.ndjson" > "$diagnostics_dir/phase-events.json"
          else
            printf '[]\n' > "$diagnostics_dir/phase-events.json"
          fi

      - name: Normalize and safety-check audit evidence
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$AUDIT_EVIDENCE_DIR/release"
          python3 scripts/forecast_edge_workflow_contract.py > "$AUDIT_EVIDENCE_DIR/source-contract.json"
          execution_identity_path="$AUDIT_EVIDENCE_DIR/diagnostics/execution-identity.json"
          trade_intents_digest=$(jq -r '.trade_intents.sha256 // empty' \
            "$release_dir/iteration-release-manifest.json")
          actual_execution_id=$(jq -r '.execution_id // empty' \
            "$AUDIT_EVIDENCE_DIR/diagnostics/receipt.json")
          if [[ -z "$actual_execution_id" ]]; then
            actual_execution_id=$(jq -r '.execution_id // empty' \
              "$release_dir/execution-receipt.json")
          fi
          if [[ "$trade_intents_digest" =~ ^[a-f0-9]{64}$ && \
                -n "$actual_execution_id" ]]; then
            expected_execution_id=$(printf '%s' \
              "$GITHUB_REPOSITORY:$PARENT_RUN_ID:$(jq -r '.run_attempt' "$AUDIT_EVIDENCE_DIR/run.json"):$trade_intents_digest" \
              | sha256sum | cut -d ' ' -f 1)
            identity_matches=false
            if [[ "$actual_execution_id" == "$expected_execution_id" ]]; then
              identity_matches=true
            fi
            jq -n \
              --arg algorithm sha256 \
              --arg payload_format 'repository:workflow_run_id:workflow_run_attempt:trade_intents_sha256' \
              --arg expected_execution_id "$expected_execution_id" \
              --arg actual_execution_id "$actual_execution_id" \
              --argjson matches "$identity_matches" \
              '{available:true,algorithm:$algorithm,payload_format:$payload_format,expected_execution_id:$expected_execution_id,actual_execution_id:$actual_execution_id,matches:$matches}' \
              > "$execution_identity_path"
          else
            jq -n \
              --arg algorithm sha256 \
              --arg payload_format 'repository:workflow_run_id:workflow_run_attempt:trade_intents_sha256' \
              '{available:false,algorithm:$algorithm,payload_format:$payload_format,expected_execution_id:null,actual_execution_id:null,matches:null}' \
              > "$execution_identity_path"
          fi
          jq -n \
            --slurpfile run "$AUDIT_EVIDENCE_DIR/run.json" \
            --slurpfile jobs "$AUDIT_EVIDENCE_DIR/jobs.json" \
            --slurpfile configuration "$AUDIT_EVIDENCE_DIR/configuration.json" \
            --slurpfile source_contract "$AUDIT_EVIDENCE_DIR/source-contract.json" \
            --slurpfile metadata "$release_dir/metadata.json" \
            --slurpfile downloaded_assets "$release_dir/downloaded-assets.json" \
            --slurpfile manifest "${release_dir}/iteration-release-manifest.json" \
            --slurpfile research_manifest "${release_dir}/research-release-manifest.json" \
            --slurpfile research_history "${release_dir}/research-history.json" \
            --slurpfile validation_summary "${release_dir}/validation-summary.json" \
            --slurpfile execution_receipt "${release_dir}/execution-receipt.json" \
            --slurpfile execution_verification "${release_dir}/execution-verification.json" \
            --slurpfile release_diagnostic_summary "${release_dir}/execution-diagnostic-summary.json" \
            --slurpfile release_diagnostic_manifest "${release_dir}/execution-diagnostic-manifest.json" \
            --slurpfile research_diagnostic_metadata "$AUDIT_EVIDENCE_DIR/research-diagnostics/metadata.json" \
            --slurpfile report_source_metadata "$AUDIT_REPORT_SOURCE_METADATA_PATH" \
            --slurpfile report_source_manifest "$AUDIT_REPORTS_DIR/research-release-manifest.json" \
            --slurpfile diagnostic_metadata "$AUDIT_EVIDENCE_DIR/diagnostics/metadata.json" \
            --slurpfile diagnostic_summary "$AUDIT_EVIDENCE_DIR/diagnostics/diagnostic-summary.json" \
            --slurpfile diagnostic_manifest "$AUDIT_EVIDENCE_DIR/diagnostics/diagnostic-manifest.json" \
            --slurpfile diagnostic_phases "$AUDIT_EVIDENCE_DIR/diagnostics/phase-events.json" \
            --slurpfile diagnostic_plan "$AUDIT_EVIDENCE_DIR/diagnostics/plan.json" \
            --slurpfile diagnostic_preflight "$AUDIT_EVIDENCE_DIR/diagnostics/preflight.json" \
            --slurpfile diagnostic_receipt "$AUDIT_EVIDENCE_DIR/diagnostics/receipt.json" \
            --slurpfile diagnostic_verification "$AUDIT_EVIDENCE_DIR/diagnostics/verification.json" \
            --slurpfile diagnostic_ledger "$AUDIT_EVIDENCE_DIR/diagnostics/ledger-snapshot.json" \
            --slurpfile execution_identity "$AUDIT_EVIDENCE_DIR/diagnostics/execution-identity.json" \
            '{
              run:$run[0],
              jobs:{
                all:$jobs[0],
                gate:([$jobs[0][] | select(.name == "gate")] | first // null),
                research:([$jobs[0][] | select(.name | test("^research(?: /|$)"))] | first // null),
                execution:([$jobs[0][] | select(.name == "execution")] | first // null),
                release:([$jobs[0][] | select(.name == "release")] | first // null)
              },
              configuration:$configuration[0],
              source_contract:$source_contract[0],
              release:{
                metadata:($metadata[0] + {downloaded_assets:$downloaded_assets[0]}),
                manifest:($manifest[0] // null),
                research_manifest:($research_manifest[0] // null),
                research_history:($research_history[0] // null),
                validation_summary:($validation_summary[0] // null),
                execution_receipt:($execution_receipt[0] // null),
                execution_verification:($execution_verification[0] // null),
                execution_diagnostic_summary:($release_diagnostic_summary[0] // null),
                execution_diagnostic_manifest:($release_diagnostic_manifest[0] // null),
                reports:{
                  root:"evidence/release/reports",
                  files:([
                    ($research_manifest[0].reports // [])[] as $report
                    | {path:$report.json_asset,kind:"json",sha256:$report.sha256},
                      {path:$report.markdown_asset,kind:"markdown",sha256:null}
                  ])
                }
              },
              research_diagnostics:{
                metadata:$research_diagnostic_metadata[0],
                evidence_root:"evidence/research-diagnostics/files",
                reports:{
                  metadata:$report_source_metadata[0],
                  root:"evidence/report-source",
                  manifest:($report_source_manifest[0] // null),
                  files:($report_source_metadata[0].files // [])
                }
              },
              diagnostics:{
                metadata:($diagnostic_metadata[0] + {
                  files:(
                    ($diagnostic_manifest[0].files // [])
                    | map(. + {path:("execution-diagnostics/" + .path)})
                  )
                }),
                summary:($diagnostic_summary[0] // null),
                manifest:($diagnostic_manifest[0] // null),
                phase_events:$diagnostic_phases[0],
                plan:($diagnostic_plan[0] // null),
                preflight:($diagnostic_preflight[0] // null),
                receipt:($diagnostic_receipt[0] // null),
                verification:($diagnostic_verification[0] // null),
                ledger:($diagnostic_ledger[0] // null),
                execution_identity:$execution_identity[0],
                evidence_root:"evidence/diagnostics/files/execution-diagnostics"
              },
              evidence_safety:{secret_value_scan_passed:false},
              agent_response:{available:false}
            }' > "$AUDIT_EVIDENCE_PATH"
          if LC_ALL=C grep -aEq \
            -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|0x[0-9a-fA-F]{130}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{8,}|[Aa]uthorization[[:space:]]*:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}|^[Cc]ookie[[:space:]]*:[[:space:]]|^[Ss]et-[Cc]ookie[[:space:]]*:[[:space:]]' \
            "$AUDIT_EVIDENCE_PATH"; then
            echo "::error::Audit evidence contains secret-like material"
            exit 1
          fi
          safe_evidence="$AUDIT_EVIDENCE_PATH.safe"
          jq '.evidence_safety.secret_value_scan_passed = true' \
            "$AUDIT_EVIDENCE_PATH" > "$safe_evidence"
          mv "$safe_evidence" "$AUDIT_EVIDENCE_PATH"
          jq -e \
            --arg run_id "$PARENT_RUN_ID" \
            '.run.id == $run_id and (.jobs.all | type == "array") and (.release.reports.files | type == "array") and (.configuration.interval_hours | type == "number")' \
            "$AUDIT_EVIDENCE_PATH" >/dev/null

      - name: Run read-only Kimi Code Judge agent
        id: audit-agent
        continue-on-error: true
        timeout-minutes: 25
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$AUDIT_AGENT_DIR"
          install -d -m 700 "$AUDIT_AGENT_DIR/evidence"
          cp -R "$AUDIT_EVIDENCE_DIR/." "$AUDIT_AGENT_DIR/evidence/"
          install -m 600 "$AUDIT_RUBRIC_PATH" "$AUDIT_AGENT_DIR/rubric.json"
          install -m 600 "$AUDIT_SCHEMA_PATH" "$AUDIT_AGENT_DIR/audit.schema.json"
          install -m 600 "$AUDIT_PROMPT_PATH" "$AUDIT_AGENT_DIR/prompt.md"
          cd "$AUDIT_AGENT_DIR"
          set +e
          # Kimi Code prompt mode (-p) uses auto permission by default; no
          # separate interactive approval-mode flag is valid here.
          stdbuf -oL -eL kimi --agent-file "$AUDIT_AGENT_PROFILE_PATH" \
            --output-format stream-json \
            -p "请遵循 prompt.md，作为只读 Judge Agent 主动检查本目录证据并输出最终审计 JSON。" \
            2> >(stdbuf -oL tee "$AUDIT_RUNTIME_DIR/agent.stderr" >&2) \
            | stdbuf -oL tee "$AUDIT_AGENT_RAW_RESPONSE_PATH"
          kimi_status=${PIPESTATUS[0]}
          set -e
          if (( kimi_status != 0 )); then
            echo "::error::Audit Kimi Code Judge failed; the raw stream was retained"
            exit "$kimi_status"
          fi
          if grep -Fq -- "$KIMI_MODEL_API_KEY" "$AUDIT_AGENT_RAW_RESPONSE_PATH"; then
            echo "::error::Audit agent response contained protected credential material"
            exit 1
          fi
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" extract \
            --input "$AUDIT_AGENT_RAW_RESPONSE_PATH" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$AUDIT_EVIDENCE_PATH" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --output "$AUDIT_AGENT_RESPONSE_PATH" \
            --trace-output "$AUDIT_AGENT_TRACE_PATH"
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" normalize \
            --input "$AUDIT_AGENT_RESPONSE_PATH" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$AUDIT_EVIDENCE_PATH" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --output "$AUDIT_AGENT_RESPONSE_PATH.normalized"
          mv "$AUDIT_AGENT_RESPONSE_PATH.normalized" "$AUDIT_AGENT_RESPONSE_PATH"

      - name: Validate agent judgment or produce warning fallback
        id: audit-result
        shell: bash
        run: |
          set -euo pipefail
          validator="$AUDIT_RUNTIME_DIR/python-venv/bin/python"
          if [[ "${{ steps.audit-agent.outcome }}" == "success" ]] && \
            "$validator" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" validate \
              --input "$AUDIT_AGENT_RESPONSE_PATH" \
              --rubric "$AUDIT_RUBRIC_PATH" \
              --evidence "$AUDIT_EVIDENCE_PATH" \
              --schema "$AUDIT_SCHEMA_PATH" \
              --output "$AUDIT_RESULT_PATH"; then
            echo "Validated the audit agent's structured judgment"
            echo "agent-judgment-valid=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'agent response unavailable or invalid' > "$AUDIT_RUNTIME_DIR/fallback-reason.txt"
            "$validator" "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" fallback \
              --input "$AUDIT_RUNTIME_DIR/fallback-reason.txt" \
              --rubric "$AUDIT_RUBRIC_PATH" \
              --evidence "$AUDIT_EVIDENCE_PATH" \
              --schema "$AUDIT_SCHEMA_PATH" \
              --parent-run-id "$PARENT_RUN_ID" \
              --output "$AUDIT_RESULT_PATH"
            echo "agent-judgment-valid=false" >> "$GITHUB_OUTPUT"
          fi
          jq -e --arg run_id "$PARENT_RUN_ID" '.parent_run_id == $run_id' "$AUDIT_RESULT_PATH" >/dev/null

      - name: Classify audit outcome and breaker requirement
        id: classify
        if: ${{ always() }}
        env:
          AGENT_JUDGMENT_VALID: ${{ steps.audit-result.outputs.agent-judgment-valid || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          overall=WARN
          confidence=LOW
          serious_findings='[]'
          classifier_input="$AUDIT_RESULT_PATH"
          classifier_evidence="$AUDIT_EVIDENCE_PATH"
          if [[ ! -s "$classifier_input" ]]; then
            classifier_input="$RUNNER_TEMP/forecast-edge-audit-missing-result.json"
            printf '%s\n' \
              '{"overall_status":"WARN","confidence":"LOW","checks":[]}' \
              > "$classifier_input"
          fi
          if [[ ! -s "$classifier_evidence" ]]; then
            classifier_evidence="$RUNNER_TEMP/forecast-edge-audit-missing-evidence.json"
            printf '{}\n' > "$classifier_evidence"
          fi
          classifier_output="$AUDIT_CLASSIFICATION_PATH"
          classifier_args=()
          if [[ "$AGENT_JUDGMENT_VALID" == "true" ]]; then
            classifier_args+=(--agent-judgment-valid)
          fi
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" classify \
            --input "$classifier_input" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$classifier_evidence" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --output "$classifier_output" \
            "${classifier_args[@]}"
          overall=$(jq -r '.overall_status' "$classifier_output")
          confidence=$(jq -r '.confidence' "$classifier_output")
          serious_findings=$(jq -c '.serious_findings' "$classifier_output")
          trip_required=false
          if [[ "$CIRCUIT_BREAKER_ENABLED" == "true" ]] && \
             [[ "$(jq 'length' <<< "$serious_findings")" -gt 0 ]]; then
            trip_required=true
          fi
          {
            echo "overall_status=$overall"
            echo "confidence=$confidence"
            echo "serious_findings=$serious_findings"
            echo "trip_required=$trip_required"
          } >> "$GITHUB_OUTPUT"

      - name: Build sanitized warning and error notification details
        if: ${{ always() }}
        env:
          AGENT_JUDGMENT_VALID: ${{ steps.audit-result.outputs.agent-judgment-valid || 'false' }}
          SERIOUS_FINDINGS: ${{ steps.classify.outputs.serious_findings || '[]' }}
        shell: bash
        run: |
          set -euo pipefail
          notification_args=()
          if [[ "$AGENT_JUDGMENT_VALID" == "true" ]]; then
            notification_args+=(--agent-judgment-valid)
          fi
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" notification \
            --input "$AUDIT_RESULT_PATH" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$AUDIT_EVIDENCE_PATH" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --serious-findings "$SERIOUS_FINDINGS" \
            --output "$AUDIT_NOTIFICATION_PATH" \
            "${notification_args[@]}"
          jq -e '
            .schema_version == "1.0" and
            (.warnings | type == "array") and
            (.errors | type == "array") and
            .warning_count == (.warnings | length) and
            .error_count == (.errors | length)
          ' "$AUDIT_NOTIFICATION_PATH" >/dev/null

      - name: Run read-only Kimi Code Feishu briefing agent
        id: feishu-brief-agent
        continue-on-error: true
        timeout-minutes: 25
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          reports_dir="$AUDIT_REPORTS_DIR"
          test -d "$reports_dir"
          test -n "$(find "$reports_dir" -maxdepth 1 -name 'report-*.json' -type f -print -quit)"
          install -d -m 700 "$FEISHU_BRIEF_AGENT_DIR/reports"
          cp "$reports_dir"/report-*.json "$FEISHU_BRIEF_AGENT_DIR/reports/"
          cp "$reports_dir"/report-*.md "$FEISHU_BRIEF_AGENT_DIR/reports/"
          install -m 600 "$FEISHU_BRIEF_PROMPT_PATH" "$FEISHU_BRIEF_AGENT_DIR/prompt.md"
          install -m 600 "$FEISHU_BRIEF_SCHEMA_PATH" "$FEISHU_BRIEF_AGENT_DIR/brief.schema.json"
          if ! "$AUDIT_RUNTIME_DIR/python-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/forecast_edge_feishu_brief.py" inventory \
              --reports-dir "$FEISHU_BRIEF_AGENT_DIR/reports" \
              --output "$FEISHU_BRIEF_AGENT_DIR/source-inventory.json" \
              2> "$AUDIT_RUNTIME_DIR/feishu-brief-quality.errors"; then
            echo "::warning::Upstream report is not safe for a normal Feishu research brief"
            exit 1
          fi
          cd "$FEISHU_BRIEF_AGENT_DIR"
          set +e
          "$GITHUB_WORKSPACE/scripts/run_kimi_code_with_idle_timeout.sh" \
            --idle-seconds "$FEISHU_BRIEF_IDLE_TIMEOUT_SECONDS" \
            --poll-seconds 10 \
            --stdout-log "$FEISHU_BRIEF_RAW_PATH" \
            --stderr-log "$AUDIT_RUNTIME_DIR/feishu-brief.stderr" \
            --activity-root "$KIMI_CODE_HOME/sessions" \
            -- kimi --agent-file "$FEISHU_BRIEF_AGENT_PROFILE_PATH" \
              --output-format stream-json \
              -p "请遵循 prompt.md，使用只读工具和 explore subagent 检查全部报告；将 source-inventory.json 的权威字段原样写入结果，输出符合 brief.schema.json 的最终扫描简报 JSON。"
          kimi_status=$?
          set -e
          if (( kimi_status != 0 )); then
            echo "::error::Feishu briefing Agent failed"
            exit "$kimi_status"
          fi
          if grep -Fq -- "$KIMI_MODEL_API_KEY" "$FEISHU_BRIEF_RAW_PATH"; then
            echo "::error::Feishu briefing Agent response contained protected credential material"
            exit 1
          fi
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/forecast_edge_feishu_brief.py" extract \
            --input "$FEISHU_BRIEF_RAW_PATH" \
            --schema "$FEISHU_BRIEF_SCHEMA_PATH" \
            --reports-dir "$FEISHU_BRIEF_AGENT_DIR/reports" \
            --output "$FEISHU_BRIEF_PATH" \
            --trace-output "$FEISHU_BRIEF_TRACE_PATH"

      - name: Validate agentic Feishu briefing or record a visible fallback
        id: feishu-brief
        env:
          AGENT_JUDGMENT_VALID: ${{ steps.audit-result.outputs.agent-judgment-valid || 'false' }}
          SERIOUS_FINDINGS: ${{ steps.classify.outputs.serious_findings || '[]' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$FEISHU_BRIEF_ARTIFACT_DIR"
          brief_valid=false
          if [[ "${{ steps.feishu-brief-agent.outcome }}" == "success" && \
                -s "$FEISHU_BRIEF_PATH" && -s "$FEISHU_BRIEF_TRACE_PATH" ]]; then
            brief_valid=true
          else
            if [[ -s "$AUDIT_RUNTIME_DIR/feishu-brief-quality.errors" ]]; then
              tail -c 500 "$AUDIT_RUNTIME_DIR/feishu-brief-quality.errors" \
                | tr '\r\n' ' ' > "$AUDIT_RUNTIME_DIR/feishu-brief-fallback-reason.txt"
            else
              printf '%s\n' 'Agent output unavailable or failed deterministic validation' \
                > "$AUDIT_RUNTIME_DIR/feishu-brief-fallback-reason.txt"
            fi
            "$AUDIT_RUNTIME_DIR/python-venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/forecast_edge_feishu_brief.py" fallback \
              --reason "$AUDIT_RUNTIME_DIR/feishu-brief-fallback-reason.txt" \
              --schema "$FEISHU_BRIEF_SCHEMA_PATH" \
              --reports-dir "$AUDIT_REPORTS_DIR" \
              --research-date "$(jq -r '.created_at[0:10]' "$AUDIT_EVIDENCE_DIR/run.json")" \
              --output "$FEISHU_BRIEF_PATH"
          fi

          notification_args=(--brief-contract-known)
          if [[ "$AGENT_JUDGMENT_VALID" == "true" ]]; then
            notification_args+=(--agent-judgment-valid)
          fi
          if [[ "$brief_valid" == "true" ]]; then
            notification_args+=(--feishu-brief-valid)
          fi
          "$AUDIT_RUNTIME_DIR/python-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/forecast_edge_audit.py" notification \
            --input "$AUDIT_RESULT_PATH" \
            --rubric "$AUDIT_RUBRIC_PATH" \
            --evidence "$AUDIT_EVIDENCE_PATH" \
            --schema "$AUDIT_SCHEMA_PATH" \
            --serious-findings "$SERIOUS_FINDINGS" \
            --output "$AUDIT_NOTIFICATION_PATH" \
            "${notification_args[@]}"
          jq -e \
            --argjson agent_valid "$AGENT_JUDGMENT_VALID" \
            --argjson brief_valid "$brief_valid" \
            '.agent_judgment_valid == $agent_valid and
             .feishu_brief_valid == $brief_valid and
             .business_complete == ($agent_valid and $brief_valid)' \
            "$AUDIT_NOTIFICATION_PATH" >/dev/null

          business_complete=false
          if [[ "$AGENT_JUDGMENT_VALID" == "true" && "$brief_valid" == "true" ]]; then
            business_complete=true
          fi
          jq -n \
            --arg parent_run_id "$PARENT_RUN_ID" \
            --arg audit_run_id "$GITHUB_RUN_ID" \
            --arg audit_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg audit_agent_outcome "${{ steps.audit-agent.outcome }}" \
            --arg brief_agent_outcome "${{ steps.feishu-brief-agent.outcome }}" \
            --argjson agent_judgment_valid "$AGENT_JUDGMENT_VALID" \
            --argjson feishu_brief_valid "$brief_valid" \
            --argjson business_complete "$business_complete" \
            '{
              schema_version:"1.0",
              parent_run_id:$parent_run_id,
              audit_run_id:$audit_run_id,
              audit_run_attempt:$audit_run_attempt,
              audit_agent_outcome:$audit_agent_outcome,
              brief_agent_outcome:$brief_agent_outcome,
              agent_judgment_valid:$agent_judgment_valid,
              feishu_brief_valid:$feishu_brief_valid,
              fallback_used:(($agent_judgment_valid and $feishu_brief_valid) | not),
              business_complete:$business_complete,
              circuit_breaker_eligible:false,
              circuit_breaker_note:"Agent 或简报基础设施失败会使审计业务契约失败，但不会单独触发交易熔断。"
            }' > "$AUDIT_CONTRACT_PATH"
          install -m 600 "$FEISHU_BRIEF_PATH" \
            "$FEISHU_BRIEF_ARTIFACT_DIR/feishu-brief.json"
          install -m 600 "$AUDIT_NOTIFICATION_PATH" \
            "$FEISHU_BRIEF_ARTIFACT_DIR/audit-notification.json"
          install -m 600 "$AUDIT_CONTRACT_PATH" \
            "$FEISHU_BRIEF_ARTIFACT_DIR/audit-contract.json"
          if [[ -s "$FEISHU_BRIEF_TRACE_PATH" ]]; then
            install -m 600 "$FEISHU_BRIEF_TRACE_PATH" \
              "$FEISHU_BRIEF_ARTIFACT_DIR/feishu-brief-trace.json"
          fi
          if jq -e 'type == "object"' \
            "$AUDIT_EVIDENCE_DIR/release/execution-receipt.json" >/dev/null 2>&1; then
            install -m 600 "$AUDIT_EVIDENCE_DIR/release/execution-receipt.json" \
              "$FEISHU_BRIEF_ARTIFACT_DIR/execution-receipt.json"
          fi
          echo "brief_valid=$brief_valid" >> "$GITHUB_OUTPUT"
          echo "business_complete=$business_complete" >> "$GITHUB_OUTPUT"

      - name: Upload Agentic Feishu briefing result or explicit fallback
        uses: actions/upload-artifact@v4
        with:
          name: forecast-edge-feishu-brief-${{ env.PARENT_RUN_ID }}-${{ github.run_attempt }}
          path: ${{ env.FEISHU_BRIEF_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Package secret-scanned Agent audit diagnostics
        id: audit-diagnostics
        if: ${{ always() && env.AUDIT_RUNTIME_DIR != '' }}
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$AUDIT_DIAGNOSTICS_ARTIFACT_DIR"
          install -d -m 700 "$diagnostics_dir"
          copy_if_present() {
            local source=$1
            local target=$2
            if [[ -f "$source" ]]; then
              install -m 600 "$source" "$diagnostics_dir/$target"
            fi
          }
          copy_if_present "$AUDIT_EVIDENCE_PATH" evidence.json
          copy_if_present "$AUDIT_REPORT_SOURCE_METADATA_PATH" report-source-metadata.json
          copy_if_present "$AUDIT_AGENT_RAW_RESPONSE_PATH" judge-agent-stream.raw.jsonl
          copy_if_present "$AUDIT_AGENT_RESPONSE_PATH" judge-agent-response.json
          copy_if_present "$AUDIT_AGENT_TRACE_PATH" judge-agent-trace.json
          copy_if_present "$AUDIT_RUNTIME_DIR/agent.stderr" judge-agent.stderr
          copy_if_present "$AUDIT_RESULT_PATH" audit-result.json
          copy_if_present "$AUDIT_CLASSIFICATION_PATH" audit-classification.json
          copy_if_present "$AUDIT_NOTIFICATION_PATH" audit-notification.json
          copy_if_present "$AUDIT_CONTRACT_PATH" audit-contract.json
          copy_if_present "$FEISHU_BRIEF_RAW_PATH" feishu-brief-agent-stream.raw.jsonl
          copy_if_present "$FEISHU_BRIEF_PATH" feishu-brief.json
          copy_if_present "$FEISHU_BRIEF_TRACE_PATH" feishu-brief-agent-trace.json
          copy_if_present "$AUDIT_RUNTIME_DIR/feishu-brief.stderr" feishu-brief-agent.stderr
          copy_if_present "$AUDIT_RUNTIME_DIR/feishu-brief-quality.errors" feishu-brief-quality.errors
          copy_if_present "$AUDIT_RUNTIME_DIR/feishu-brief-fallback-reason.txt" feishu-brief-fallback-reason.txt
          copy_if_present "$FEISHU_BRIEF_AGENT_DIR/source-inventory.json" source-inventory.json
          if [[ -d "$KIMI_CODE_HOME/sessions" ]]; then
            cp -R "$KIMI_CODE_HOME/sessions" "$diagnostics_dir/kimi-code-sessions"
          fi
          python3 "$GITHUB_WORKSPACE/scripts/sanitize_research_diagnostics.py" \
            --root "$diagnostics_dir" \
            --report "$diagnostics_dir/redaction-report.json" \
            --secret-env KIMI_MODEL_API_KEY
          files_index="$diagnostics_dir/files.ndjson"
          : > "$files_index"
          while IFS= read -r -d '' path; do
            relative=${path#"$diagnostics_dir"/}
            jq -nc \
              --arg path "$relative" \
              --arg sha256 "$(sha256sum "$path" | cut -d ' ' -f 1)" \
              --argjson bytes "$(stat -c '%s' "$path")" \
              '{path:$path,sha256:$sha256,bytes:$bytes}' >> "$files_index"
          done < <(find "$diagnostics_dir" -type f \
            ! -name audit-diagnostics-manifest.json \
            ! -name files.ndjson -print0 | LC_ALL=C sort -z)
          jq -s \
            --arg parent_run_id "$PARENT_RUN_ID" \
            --arg audit_run_id "$GITHUB_RUN_ID" \
            --arg audit_run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema_version:"1.0",
              parent_run_id:$parent_run_id,
              audit_run_id:$audit_run_id,
              audit_run_attempt:$audit_run_attempt,
              secret_scan_passed:true,
              files:.
            }' "$files_index" > "$diagnostics_dir/audit-diagnostics-manifest.json"
          find "$diagnostics_dir" -maxdepth 1 -name files.ndjson -type f -delete
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload private Agent audit diagnostics
        if: ${{ always() && steps.audit-diagnostics.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: forecast-edge-audit-diagnostics-${{ env.PARENT_RUN_ID }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_DIAGNOSTICS_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish sanitized audit summary
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Forecast Edge post-run audit\n\n'
            printf -- '- Parent run: [%s](%s)\n' \
              "$PARENT_RUN_ID" "$(jq -r '.run.html_url' "$AUDIT_EVIDENCE_PATH")"
            printf -- '- Overall status: `%s`\n' "$(jq -r '.overall_status' "$AUDIT_RESULT_PATH")"
            printf -- '- Confidence: `%s`\n\n' "$(jq -r '.confidence' "$AUDIT_RESULT_PATH")"
            printf -- '- Judge Agent judgment valid: `%s`\n' \
              "$(jq -r '.agent_judgment_valid' "$AUDIT_CONTRACT_PATH")"
            printf -- '- Feishu Agent brief valid: `%s`\n' \
              "$(jq -r '.feishu_brief_valid' "$AUDIT_CONTRACT_PATH")"
            printf -- '- Agentic business contract complete: `%s`\n\n' \
              "$(jq -r '.business_complete' "$AUDIT_CONTRACT_PATH")"
            printf -- '- Automatic circuit breaker armed: `%s`\n\n' "$CIRCUIT_BREAKER_ENABLED"
            printf '## Checks\n\n'
            printf '| Check | Severity | Status | Reason |\n'
            printf '|---|---|---|---|\n'
            jq -r '.checks[] | "| `\(.id)` | \(.severity) | `\(.status)` | \(.reason | gsub("[\\r\\n|]"; " ")) |"' \
              "$AUDIT_RESULT_PATH"
            printf '\n## Anomalies\n\n'
            if [[ "$(jq '.anomalies | length' "$AUDIT_RESULT_PATH")" -eq 0 ]]; then
              printf '_No evidence-backed anomaly was reported._\n'
            else
              jq -r '.anomalies[] | "- **\(.severity)** `\(.check_id)`: \(.summary | gsub("[\\r\\n]"; " "))"' \
                "$AUDIT_RESULT_PATH"
            fi
            printf '\n## Missing evidence\n\n'
            if [[ "$(jq '.missing_evidence | length' "$AUDIT_RESULT_PATH")" -eq 0 ]]; then
              printf '_None._\n'
            else
              jq -r '.missing_evidence[] | "- " + (gsub("[\\r\\n]"; " "))' "$AUDIT_RESULT_PATH"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trip production circuit breaker on serious findings
        id: breaker
        if: ${{ always() && steps.classify.outputs.trip_required == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.FORECAST_EDGE_BREAKER_TOKEN }}
          SERIOUS_FINDINGS: ${{ steps.classify.outputs.serious_findings }}
        shell: bash
        run: |
          set -euo pipefail
          echo "breaker_succeeded=false" >> "$GITHUB_OUTPUT"
          breaker_failed=false
          if ! gh variable set POLYMARKET_LIVE_TRADING_ENABLED \
            --repo "$GITHUB_REPOSITORY" --body false; then
            echo "::error::Could not disarm the persistent live-trading variable"
            breaker_failed=true
          fi
          if ! gh variable set FORECAST_EDGE_AUTOMATION_PAUSED \
            --repo "$GITHUB_REPOSITORY" --body true; then
            echo "::error::Could not set the persistent automation pause variable"
            breaker_failed=true
          fi
          if ! gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/actions/workflows/forecast-edge.yml/disable"; then
            echo "::error::Could not disable the Forecast Edge parent workflow"
            breaker_failed=true
          fi
          finding_ids=$(jq -r 'join(", ")' <<< "$SERIOUS_FINDINGS")
          {
            printf '\n## Production circuit breaker\n\n'
            printf -- '- Triggered: `true`\n'
            printf -- '- Serious checks: `%s`\n' "$finding_ids"
            printf -- '- Live trading requested off: `true`\n'
            printf -- '- Parent workflow disable requested: `true`\n'
            printf -- '- Recovery requires explicit workflow enablement and live-trading re-arm.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$breaker_failed" == "true" ]]; then
            exit 1
          fi
          echo "breaker_succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Enforce critical audit outcome
        shell: bash
        run: |
          set -euo pipefail
          serious='${{ steps.classify.outputs.serious_findings }}'
          if [[ "$(jq 'length' <<< "$serious")" -gt 0 ]]; then
            echo "::error::Forecast Edge audit found critical safety failures: $(jq -r 'join(", ")' <<< "$serious")"
            exit 1
          fi

      - name: Enforce complete Agent Judge and briefing deliverables
        if: ${{ always() }}
        env:
          AGENT_JUDGMENT_VALID: ${{ steps.audit-result.outputs.agent-judgment-valid || 'false' }}
          FEISHU_BRIEF_VALID: ${{ steps.feishu-brief.outputs.brief_valid || 'false' }}
          BUSINESS_COMPLETE: ${{ steps.feishu-brief.outputs.business_complete || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$AGENT_JUDGMENT_VALID" != "true" || \
                "$FEISHU_BRIEF_VALID" != "true" || \
                "$BUSINESS_COMPLETE" != "true" ]]; then
            echo "::error::Agentic audit business contract is incomplete: judge_valid=$AGENT_JUDGMENT_VALID brief_valid=$FEISHU_BRIEF_VALID"
            echo "::error::This failure is visible but does not by itself trigger the production trading circuit breaker"
            exit 1
          fi

      - name: Remove private audit runtime
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${AUDIT_RUNTIME_DIR:-}" && \
                "$AUDIT_RUNTIME_DIR" == "$RUNNER_TEMP"/forecast-edge-audit-* && \
                -d "$AUDIT_RUNTIME_DIR" ]]; then
            find "$AUDIT_RUNTIME_DIR" -depth -delete
          fi

  notify:
    needs: [select, audit]
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      needs.select.outputs.audit-applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
      AUDIT_JOB_RESULT: ${{ needs.audit.result }}
      AUDIT_OVERALL_STATUS: ${{ needs.audit.outputs.overall_status }}
      AUDIT_CONFIDENCE: ${{ needs.audit.outputs.confidence }}
      SERIOUS_FINDINGS: ${{ needs.audit.outputs.serious_findings }}
      TRIP_REQUIRED: ${{ needs.audit.outputs.trip_required }}
      BREAKER_SUCCEEDED: ${{ needs.audit.outputs.breaker_succeeded }}
      AGENT_JUDGMENT_VALID: ${{ needs.audit.outputs.agent_judgment_valid }}
      FEISHU_BRIEF_VALID: ${{ needs.audit.outputs.feishu_brief_valid }}
      BUSINESS_COMPLETE: ${{ needs.audit.outputs.business_complete }}
    steps:
      - name: Send final production iteration status to Feishu
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for required in FEISHU_APP_ID FEISHU_APP_SECRET FEISHU_CHAT_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::Required Feishu notification secret is unavailable"
              exit 1
            fi
          done

          run_path="$RUNNER_TEMP/parent-run.json"
          jobs_path="$RUNNER_TEMP/parent-jobs.json"
          brief_dir="$RUNNER_TEMP/forecast-edge-feishu-brief"
          install -d -m 700 "$brief_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID" > "$run_path"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100" \
            | jq -s '[.[].jobs[]]' > "$jobs_path"
          if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "forecast-edge-feishu-brief-$PARENT_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --dir "$brief_dir"; then
            : # The validated fallback below keeps notification delivery mandatory.
          fi
          if ! jq -e '
              .schema_version == "1.0" and
              (.title | type == "string" and length > 0) and
              (.markdown | type == "string" and length > 0)
            ' "$brief_dir/feishu-brief.json" >/dev/null 2>&1; then
            research_date=$(jq -r '.created_at[0:10]' "$run_path")
            jq -n \
              --arg research_date "$research_date" \
              '{
                schema_version:"1.0",
                research_date:$research_date,
                title:("forecast-edge 扫描简报 " + $research_date),
                venues:[],
                current_position_count:0,
                researched_market_count:0,
                actionable_recommendation_count:0,
                markdown:(
                  "## forecast-edge 全量扫描｜" + $research_date + "（Agent 简报不可用）\n\n" +
                  "**组合概况**：Agent 简报不可用，**无法安全复述资金数据**。\n\n" +
                  "**研究覆盖**：本轮**没有取得可验证的研究覆盖清单**。\n\n" +
                  "**本轮结论**：**未取得可验证的 Agent 研究结论**，请查看父流程 Release 和异常详情。\n\n" +
                  "### 一、私人操作建议\n\n本轮 Agent 简报 artifact 不可用，请从父流程 Release 查看完整研究报告。\n\n" +
                  "### 二、简报\n\n本轮无可验证的 Agent 研究摘要；执行与审计失败详情见下方状态。"
                )
              }' > "$brief_dir/feishu-brief.json"
          fi
          if ! jq -e '
              .schema_version == "1.0" and
              (.warnings | type == "array") and
              (.errors | type == "array") and
              .warning_count == (.warnings | length) and
              .error_count == (.errors | length)
            ' "$brief_dir/audit-notification.json" >/dev/null 2>&1; then
            jq -n \
              --arg audit_job "${AUDIT_JOB_RESULT:-failure}" \
              --arg run_id "$PARENT_RUN_ID" \
              '([{
                  id:"AUDIT-INFRASTRUCTURE",
                  title:"审计详情 artifact 不可用",
                  status:"WARN",
                  severity:"high",
                  reason:"审计 workflow 未产出可验证的结构化通知详情。",
                  impact:"本轮不能声称审计完全通过；通知仍继续发送，且不会仅因此自动熔断。",
                  evidence:["audit workflow run " + $run_id],
                  anomalies:[],
                  triggers_breaker:false,
                  breaker_reason:"基础设施或证据问题只告警；确定性资金安全异常仍独立判定。"
                }]) as $warnings
               | (if $audit_job == "success" then [] else [{
                    id:"AUDIT-JOB",
                    title:"审计 workflow 未成功完成",
                    status:"FAIL",
                    severity:"high",
                    reason:("审计 job 结论为 " + $audit_job + "。"),
                    impact:"审计流水线存在显式错误，需打开审计运行查看失败步骤。",
                    evidence:["audit workflow run " + $run_id],
                    anomalies:[],
                    triggers_breaker:false,
                    breaker_reason:"普通审计基础设施失败会显示 Error，但不冒充明确的资金安全熔断条件。"
                  }] end) as $errors
               | {
                  schema_version:"1.0",
                  overall_status:"WARN",
                  confidence:"LOW",
                  agent_judgment_valid:false,
                  feishu_brief_valid:false,
                  business_complete:false,
                  warning_count:($warnings|length),
                  error_count:($errors|length),
                  serious_finding_count:0,
                  warnings:$warnings,
                  errors:$errors,
                  missing_evidence:["audit-notification.json"]
                }' > "$brief_dir/audit-notification.json"
          fi
          stage_result() {
            jq -r --arg pattern "$1" '
              [ .[] | select(.name | test($pattern)) | (.conclusion // "unknown") ] as $values
              | if ($values | length) == 0 then "missing"
                elif any($values[]; . == "failure" or . == "cancelled" or . == "timed_out") then "failure"
                elif any($values[]; . == "success") then "success"
                elif all($values[]; . == "skipped") then "skipped"
                else ($values | unique | join(","))
                end
            ' "$jobs_path"
          }
          parent_conclusion=$(jq -r '.conclusion // "unknown"' "$run_path")
          parent_url=$(jq -r '.html_url' "$run_path")
          gate_result=$(stage_result '^gate(?: /|$)')
          research_result=$(stage_result '^research(?: /|$)')
          execution_result=$(stage_result '^execution(?: /|$)')
          release_result=$(stage_result '^release(?: /|$)')
          receipt_status="unavailable"
          receipt_count="0"
          canceled_order_count="unavailable"
          if [[ -s "$brief_dir/execution-receipt.json" ]]; then
            receipt_status=$(jq -r '.status // "unknown"' \
              "$brief_dir/execution-receipt.json")
            receipt_count=$(jq -r '(.receipts // []) | length' \
              "$brief_dir/execution-receipt.json")
            canceled_order_count=$(jq -r \
              '.pre_execution_cancellation.canceled_order_count // "unknown"' \
              "$brief_dir/execution-receipt.json")
          fi
          overall=${AUDIT_OVERALL_STATUS:-INSUFFICIENT_EVIDENCE}
          confidence=${AUDIT_CONFIDENCE:-LOW}
          audit_job=${AUDIT_JOB_RESULT:-failure}
          if jq -e 'type == "array"' <<< "${SERIOUS_FINDINGS:-[]}" >/dev/null 2>&1; then
            finding_ids=$(jq -r 'if length == 0 then "无" else join(", ") end' \
              <<< "${SERIOUS_FINDINGS:-[]}")
          else
            finding_ids="AUDIT-INFRASTRUCTURE"
          fi
          breaker_status="未触发"
          if [[ "${TRIP_REQUIRED:-false}" == "true" ]]; then
            if [[ "${BREAKER_SUCCEEDED:-false}" == "true" ]]; then
              breaker_status="已触发；交易已关闭、调度已暂停、父 workflow 已禁用"
            else
              breaker_status="需要触发但操作失败或不完整，请立即人工检查"
            fi
          fi

          template=green
          if [[ "${TRIP_REQUIRED:-false}" == "true" || \
                "${BREAKER_SUCCEEDED:-false}" == "true" ]]; then
            template=red
          fi
          message_path="$RUNNER_TEMP/forecast-edge-final-status.md"
          {
            printf '### 三、执行与审计状态\n\n'
            printf '**父流程**：[%s](%s) · `%s`\n' "$PARENT_RUN_ID" "$parent_url" "$parent_conclusion"
            printf '**阶段**：gate `%s` · research `%s` · execution `%s` · release `%s`\n' \
              "$gate_result" "$research_result" "$execution_result" "$release_result"
            printf '**执行回执**：状态 `%s` · 订单回执 `%s` · 事前取消旧挂单 `%s`\n' \
              "$receipt_status" "$receipt_count" "$canceled_order_count"
            printf '**Agent Judge**：job `%s` · 有效判断 `%s` · 结论 `%s` · 置信度 `%s`\n' \
              "$audit_job" "${AGENT_JUDGMENT_VALID:-false}" "$overall" "$confidence"
            printf '**严重检查项**：%s\n' "$finding_ids"
            printf '**生产熔断**：%s\n' "$breaker_status"
            printf '**问题概况**：Warning `%s` · Error `%s`（详情见下方折叠面板）\n' \
              "$(jq -r '.warning_count' "$brief_dir/audit-notification.json")" \
              "$(jq -r '.error_count' "$brief_dir/audit-notification.json")"
            printf '**Agent 扫描简报**：`%s`\n' "${FEISHU_BRIEF_VALID:-false}"
            printf '**Agentic 业务验收**：`%s`\n' "${BUSINESS_COMPLETE:-false}"
            printf '**审计运行**：[%s](https://github.com/%s/actions/runs/%s)\n' \
              "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$message_path"

          token_response=$(
            jq -cn \
              --arg app_id "$FEISHU_APP_ID" \
              --arg app_secret "$FEISHU_APP_SECRET" \
              '{app_id:$app_id, app_secret:$app_secret}' \
              | curl --fail-with-body --silent --show-error \
                  --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                  --request POST \
                  --header 'Content-Type: application/json; charset=utf-8' \
                  --data-binary @- \
                  https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal
          )
          tenant_token=$(jq -er \
            'select(.code == 0) | .tenant_access_token | select(type == "string" and length > 0)' \
            <<< "$token_response")
          echo "::add-mask::$tenant_token"
          message_payload=$(
            jq -cn \
              --arg receive_id "$FEISHU_CHAT_ID" \
              --arg uuid "forecast-edge-final-$PARENT_RUN_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --arg title "$(jq -r '.title' "$brief_dir/feishu-brief.json")" \
              --arg template "$template" \
              --arg subtitle "父流程 $PARENT_RUN_ID · 审计 $GITHUB_RUN_ID" \
              --arg status_tag "$(if [[ "$template" == "red" ]]; then printf '已熔断'; else printf '未熔断'; fi)" \
              --rawfile brief "$brief_dir/feishu-brief.json" \
              --rawfile status "$message_path" \
              --slurpfile notification "$brief_dir/audit-notification.json" \
               'def safe:
                  tostring
                  | gsub("[\\r\\n]+"; " ")
                  | gsub("`"; "´")
                  | gsub("[<>]"; "");
               def detail_markdown($items):
                  $items
                  | map(
                      "**" + (.id|safe) + "｜" + (.title|safe) + "**\\n" +
                      "**状态 / 级别**：`" + (.status|safe) + "` / `" + (.severity|safe) + "`\\n" +
                      "**原因**：" + (.reason|safe) + "\\n" +
                      "**影响**：" + (.impact|safe) + "\\n" +
                      "**证据**：" + (
                        if (.evidence|length) == 0 then "无"
                        else (.evidence | map("`" + (. | safe) + "`") | join("、"))
                        end
                      ) + "\\n" +
                      (if (.anomalies|length) == 0 then ""
                       else "**异常摘要**：" + (.anomalies | map(.|safe) | join("；")) + "\\n"
                       end) +
                      "**熔断判断**：" +
                      (if .triggers_breaker then "是" else "否" end) + "；" + (.breaker_reason|safe)
                    )
                  | join("\\n\\n");
               ($brief | fromjson) as $brief_document
               | $notification[0] as $details
               | ([
                    {tag:"markdown",content:$brief_document.markdown},
                    {
                      tag:"column_set",
                      flex_mode:"none",
                      columns:[{
                        tag:"column",
                        width:"weighted",
                        weight:1,
                        background_style:(if $template == "red" then "red-50" else "green-50" end),
                        padding:"12px",
                        vertical_spacing:"4px",
                        elements:[{tag:"markdown",content:$status}]
                      }]
                    },
                    (if $details.error_count > 0 then {
                      tag:"collapsible_panel",
                      expanded:false,
                      header:{
                        title:{tag:"plain_text",content:("Error 详情（" + ($details.error_count|tostring) + "）")},
                        width:"fill"
                      },
                      background_color:"grey-50",
                      border:{color:"grey-200",corner_radius:"8px"},
                      padding:"12px",
                      elements:[{tag:"markdown",content:detail_markdown($details.errors)}]
                    } else empty end),
                    (if $details.warning_count > 0 then {
                      tag:"collapsible_panel",
                      expanded:false,
                      header:{
                        title:{tag:"plain_text",content:("Warning 详情（" + ($details.warning_count|tostring) + "）")},
                        width:"fill"
                      },
                      background_color:"grey-50",
                      border:{color:"grey-200",corner_radius:"8px"},
                      padding:"12px",
                      elements:[{
                        tag:"markdown",
                        content:(
                          detail_markdown($details.warnings) +
                          (if ($details.missing_evidence|length) == 0 then ""
                           else "\\n\\n**缺失证据**：" +
                             ($details.missing_evidence | map("`" + (. | safe) + "`") | join("、"))
                           end)
                        )
                      }]
                    } else empty end)
                  ]) as $elements
               | {
                receive_id:$receive_id,
                msg_type:"interactive",
                content:({
                  schema:"2.0",
                  config:{
                    width_mode:"default",
                    summary:{content:$title}
                  },
                  header:{
                    title:{tag:"plain_text",content:$title},
                    subtitle:{tag:"plain_text",content:$subtitle},
                    template:$template,
                    icon:{tag:"standard_icon",token:"ai-common_colorful"},
                    text_tag_list:[{
                      tag:"text_tag",
                      text:{tag:"plain_text",content:$status_tag},
                      color:$template
                    }]
                  },
                  body:{
                    direction:"vertical",
                    padding:"12px 12px 20px 12px",
                    vertical_spacing:"12px",
                    elements:$elements
                  }
                } | tojson),
                uuid:$uuid
              }'
          )
          send_response=$(
            printf '%s' "$message_payload" \
              | curl --fail-with-body --silent --show-error \
                  --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                  --request POST \
                  --header "Authorization: Bearer $tenant_token" \
                  --header 'Content-Type: application/json; charset=utf-8' \
                  --data-binary @- \
                  'https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id'
          )
          jq -e '.code == 0 and (.data.message_id | type == "string" and length > 0)' \
            <<< "$send_response" >/dev/null
