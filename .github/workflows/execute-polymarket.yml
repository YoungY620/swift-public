name: Execute private Polymarket trade intents

on:
  workflow_call:
    inputs:
      trade-intents-sha256:
        required: true
        type: string

permissions: {}

jobs:
  execute:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - forecast-edge
      - polymarket-execution
      - ec2
      - eu-north-1
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    environment: polymarket-production
    env:
      TRADE_INTENTS_SHA256: ${{ inputs.trade-intents-sha256 }}
      SERVER_SECRET_PATH: /home/ubuntu/poly-edge-live/runtime/secrets.json
      POLYMARKET_MAX_PRICE_DEVIATION_BPS: ${{ vars.POLYMARKET_MAX_PRICE_DEVIATION_BPS || '100' }}
      MAX_QUANTITY_REDUCTION_BPS: "2500"
      MAX_ORDER_NOTIONAL: "50"
      MAX_BATCH_NOTIONAL: "100"
      MAX_DAILY_NOTIONAL: "200"
      MAX_ORDER_QUANTITY: "1000"
      MINIMUM_CASH_RESERVE: "5"
      MAX_FEE_PER_SHARE: "0.02"
      MAX_INTENTS: "20"
      PLAN_TTL_SECONDS: "120"
      SETTLEMENT_TIMEOUT_SECONDS: "90"
      LEDGER_PATH: /home/ubuntu/poly-edge-live/runtime/execution-ledger.sqlite3
      PERSISTENT_DIAGNOSTICS_ROOT: /home/ubuntu/poly-edge-live/diagnostics

    steps:
      - name: Check out trusted executor code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate EC2 runner and private execution configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" != "Linux" || "$(uname -m)" != "x86_64" ]]; then
            echo "::error::The execution job is not running on the registered Linux X64 EC2 runner"
            exit 1
          fi
          if [[ ! "$TRADE_INTENTS_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Research artifact digest is invalid"
            exit 1
          fi
          if [[ -L "$SERVER_SECRET_PATH" || ! -f "$SERVER_SECRET_PATH" || \
                "$(stat -c '%U' "$SERVER_SECRET_PATH")" != "ubuntu" || \
                "$(stat -c '%a' "$SERVER_SECRET_PATH")" != "600" ]]; then
            echo "::error::Server-local Polymarket credentials are unavailable or unsafe"
            exit 1
          fi
          if (( BASH_VERSINFO[0] < 4 )); then
            echo "::error::The execution runner must expose Bash 4 or newer"
            exit 1
          fi
          for required_tool in jq python3 sha256sum; do
            if ! command -v "$required_tool" >/dev/null; then
              echo "::error::The execution runner is missing required tool: $required_tool"
              exit 1
            fi
          done
          runtime_dir="$RUNNER_TEMP/polymarket-execution-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$runtime_dir"
          install -d -m 700 "$runtime_dir/research-handoff" "$runtime_dir/execution-output"
          install -d -m 700 "$(dirname "$LEDGER_PATH")"
          install -d -m 700 "$PERSISTENT_DIAGNOSTICS_ROOT"
          : > "$runtime_dir/phase-events.ndjson"
          chmod 600 "$runtime_dir/phase-events.ndjson"
          {
            echo "RUNTIME_DIR=$runtime_dir"
            echo "RESEARCH_HANDOFF_DIR=$runtime_dir/research-handoff"
            echo "EXECUTION_OUTPUT_DIR=$runtime_dir/execution-output"
            echo "LOCAL_INTENTS_PATH=$runtime_dir/trade-intents.jsonl"
            echo "LOCAL_LIMITS_PATH=$runtime_dir/risk-limits.json"
            echo "PYTHON_VENV_DIR=$runtime_dir/venv"
            echo "DIAGNOSTICS_ARCHIVE_PATH=$runtime_dir/execution-diagnostics.tar.gz"
          } >> "$GITHUB_ENV"

      - name: Download research handoff artifact
        uses: actions/download-artifact@v4
        with:
          name: forecast-edge-research-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/research-handoff

      - name: Load and verify research trade-intent artifact locally
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RESEARCH_HANDOFF_DIR/trade-intents.jsonl"
          test -s "$RESEARCH_HANDOFF_DIR/trade-intents.sha256"
          expected_checksum_line="$TRADE_INTENTS_SHA256  trade-intents.jsonl"
          if [[ "$(<"$RESEARCH_HANDOFF_DIR/trade-intents.sha256")" != "$expected_checksum_line" ]]; then
            echo "::error::Research artifact checksum file does not match the workflow output"
            exit 1
          fi
          install -m 600 "$RESEARCH_HANDOFF_DIR/trade-intents.jsonl" "$LOCAL_INTENTS_PATH"
          actual_digest=$(sha256sum "$LOCAL_INTENTS_PATH" | cut -d ' ' -f 1)
          if [[ "$actual_digest" != "$TRADE_INTENTS_SHA256" ]]; then
            echo "::error::Trade-intent artifact failed its research digest"
            exit 1
          fi
          if [[ ! -s "$LOCAL_INTENTS_PATH" ]]; then
            echo "::error::Execution subworkflow was called without actionable trade intents"
            exit 1
          fi
          execution_id=$(printf '%s' \
            "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$actual_digest" \
            | sha256sum | cut -d ' ' -f 1)
          echo "EXECUTION_ID=$execution_id" >> "$GITHUB_ENV"

      - name: Build non-secret local risk configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jq -n \
            --argjson max_price_deviation_bps "$POLYMARKET_MAX_PRICE_DEVIATION_BPS" \
            --argjson max_quantity_reduction_bps "$MAX_QUANTITY_REDUCTION_BPS" \
            --arg max_order_notional "$MAX_ORDER_NOTIONAL" \
            --arg max_batch_notional "$MAX_BATCH_NOTIONAL" \
            --arg max_order_quantity "$MAX_ORDER_QUANTITY" \
            --arg minimum_cash_reserve "$MINIMUM_CASH_RESERVE" \
            --arg max_fee_per_share "$MAX_FEE_PER_SHARE" \
            --argjson max_intents "$MAX_INTENTS" \
            --argjson plan_ttl_seconds "$PLAN_TTL_SECONDS" \
            '{
              max_price_deviation_bps:$max_price_deviation_bps,
              max_quantity_reduction_bps:$max_quantity_reduction_bps,
              max_order_notional:$max_order_notional,
              max_batch_notional:$max_batch_notional,
              max_order_quantity:$max_order_quantity,
              minimum_cash_reserve:$minimum_cash_reserve,
              max_fee_per_share:$max_fee_per_share,
              max_intents:$max_intents,
              plan_ttl_seconds:$plan_ttl_seconds
            }' > "$LOCAL_LIMITS_PATH"
          chmod 600 "$LOCAL_LIMITS_PATH"

      - name: Install isolated execution dependencies
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          set +e
          (
            set -euo pipefail
            python3 -m venv "$PYTHON_VENV_DIR"
            "$PYTHON_VENV_DIR/bin/python" -m pip install --disable-pip-version-check \
              --requirement automation/requirements-polymarket-execution.txt
          ) > "$RUNTIME_DIR/install-command.log" 2>&1
          exit_code=$?
          set -e
          completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -cn \
            --arg phase install \
            --arg started_at "$started_at" \
            --arg completed_at "$completed_at" \
            --argjson exit_code "$exit_code" \
            '{phase:$phase,started_at:$started_at,completed_at:$completed_at,exit_code:$exit_code}' \
            >> "$RUNTIME_DIR/phase-events.ndjson"
          exit "$exit_code"

      - name: Validate, cancel open orders, price, execute FOK market orders, and verify locally
        shell: bash
        run: |
          set -euo pipefail
          phase_events="$RUNTIME_DIR/phase-events.ndjson"
          test -f "$phase_events"
          run_phase() {
            local phase=$1
            shift
            local started_at completed_at exit_code
            started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            set +e
            "$@" > "$RUNTIME_DIR/$phase-command.log" 2>&1
            exit_code=$?
            set -e
            completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            jq -cn \
              --arg phase "$phase" \
              --arg started_at "$started_at" \
              --arg completed_at "$completed_at" \
              --argjson exit_code "$exit_code" \
              '{phase:$phase,started_at:$started_at,completed_at:$completed_at,exit_code:$exit_code}' \
              >> "$phase_events"
            return "$exit_code"
          }
          run_phase validate \
            "$PYTHON_VENV_DIR/bin/python" scripts/polymarket_execution.py validate-artifact \
            --input "$LOCAL_INTENTS_PATH" \
            --output "$RUNTIME_DIR/validated-intents.jsonl" \
            --summary "$RUNTIME_DIR/validation.json"
          run_phase cancel \
            "$PYTHON_VENV_DIR/bin/python" scripts/run_with_polymarket_secrets.py \
            "$SERVER_SECRET_PATH" \
            "$PYTHON_VENV_DIR/bin/python" scripts/polymarket_execution.py cancel-open-orders \
            --output "$RUNTIME_DIR/cancellations.json"
          run_phase preflight \
            "$PYTHON_VENV_DIR/bin/python" scripts/run_with_polymarket_secrets.py \
            "$SERVER_SECRET_PATH" \
            "$PYTHON_VENV_DIR/bin/python" scripts/polymarket_execution.py preflight \
            --intents "$RUNTIME_DIR/validated-intents.jsonl" \
            --output "$RUNTIME_DIR/preflight.json"
          run_phase plan \
            "$PYTHON_VENV_DIR/bin/python" scripts/polymarket_execution.py plan \
            --intents "$RUNTIME_DIR/validated-intents.jsonl" \
            --preflight "$RUNTIME_DIR/preflight.json" \
            --limits "$LOCAL_LIMITS_PATH" \
            --output "$RUNTIME_DIR/plan.json" \
            --execution-id "$EXECUTION_ID" \
            --artifact-sha256 "$TRADE_INTENTS_SHA256"
          run_phase execute \
            "$PYTHON_VENV_DIR/bin/python" scripts/run_with_polymarket_secrets.py \
            "$SERVER_SECRET_PATH" \
            "$PYTHON_VENV_DIR/bin/python" scripts/polymarket_execution.py execute \
            --plan "$RUNTIME_DIR/plan.json" \
            --cancellations "$RUNTIME_DIR/cancellations.json" \
            --output "$RUNTIME_DIR/receipt.json" \
            --execution-id "$EXECUTION_ID" \
            --artifact-sha256 "$TRADE_INTENTS_SHA256" \
            --ledger-path "$LEDGER_PATH" \
            --lease-owner "github-$EXECUTION_ID" \
            --daily-notional-limit "$MAX_DAILY_NOTIONAL" \
            --settlement-timeout-seconds "$SETTLEMENT_TIMEOUT_SECONDS"
          run_phase verify \
            "$PYTHON_VENV_DIR/bin/python" scripts/run_with_polymarket_secrets.py \
            "$SERVER_SECRET_PATH" \
            "$PYTHON_VENV_DIR/bin/python" scripts/polymarket_execution.py verify \
            --receipt "$RUNTIME_DIR/receipt.json" \
            --output "$RUNTIME_DIR/verification.json" \
            --execution-id "$EXECUTION_ID"
          install -m 600 "$RUNTIME_DIR/receipt.json" \
            "$EXECUTION_OUTPUT_DIR/execution-receipt.json"
          install -m 600 "$RUNTIME_DIR/verification.json" \
            "$EXECUTION_OUTPUT_DIR/execution-verification.json"

      - name: Build and persist secret-free execution diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNTIME_DIR:-}" || \
                ! "$RUNTIME_DIR" =~ ^${RUNNER_TEMP}/polymarket-execution-[0-9]+-[0-9]+$ || \
                ! -d "$RUNTIME_DIR" ]]; then
            echo "::error::Execution runtime is unavailable for diagnostic collection"
            exit 1
          fi
          persistent_dir="$PERSISTENT_DIAGNOSTICS_ROOT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -e "$persistent_dir" ]]; then
            echo "::error::Refusing to replace an existing persistent diagnostic archive"
            exit 1
          fi
          install -d -m 700 "$persistent_dir"
          python3 scripts/build_polymarket_execution_diagnostics.py \
            --runtime-dir "$RUNTIME_DIR" \
            --ledger-path "$LEDGER_PATH" \
            --secret-file "$SERVER_SECRET_PATH" \
            --execution-id "${EXECUTION_ID:-}" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA" \
            --trade-intents-sha256 "$TRADE_INTENTS_SHA256" \
            --output-directory "$RUNTIME_DIR/diagnostics-package" \
            --archive "$DIAGNOSTICS_ARCHIVE_PATH"
          archive_sha256=$(sha256sum "$DIAGNOSTICS_ARCHIVE_PATH" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$archive_sha256" execution-diagnostics.tar.gz \
            > "$RUNTIME_DIR/execution-diagnostics.sha256"
          chmod 600 "$RUNTIME_DIR/execution-diagnostics.sha256"
          for destination in "$EXECUTION_OUTPUT_DIR" "$persistent_dir"; do
            install -m 600 "$DIAGNOSTICS_ARCHIVE_PATH" \
              "$destination/execution-diagnostics.tar.gz"
            install -m 600 "$RUNTIME_DIR/execution-diagnostics.sha256" \
              "$destination/execution-diagnostics.sha256"
            install -m 600 "$RUNTIME_DIR/diagnostics-package/diagnostic-summary.json" \
              "$destination/execution-diagnostic-summary.json"
            install -m 600 "$RUNTIME_DIR/diagnostics-package/diagnostic-manifest.json" \
              "$destination/execution-diagnostic-manifest.json"
          done

      - name: Upload private-fork execution diagnostics for post-run Judge
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-execution-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/execution-output/execution-receipt.json
            ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/execution-output/execution-verification.json
            ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/execution-output/execution-diagnostics.tar.gz
            ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/execution-output/execution-diagnostics.sha256
            ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/execution-output/execution-diagnostic-summary.json
            ${{ runner.temp }}/polymarket-execution-${{ github.run_id }}-${{ github.run_attempt }}/execution-output/execution-diagnostic-manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Confirm execution handoff
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EXECUTION_OUTPUT_DIR/execution-receipt.json"
          test -s "$EXECUTION_OUTPUT_DIR/execution-verification.json"
          test -s "$EXECUTION_OUTPUT_DIR/execution-diagnostics.tar.gz"
          test -s "$EXECUTION_OUTPUT_DIR/execution-diagnostics.sha256"

      - name: Remove private execution runtime
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_DIR:-}" && \
                "$RUNTIME_DIR" == "$RUNNER_TEMP"/polymarket-execution-* && \
                -d "$RUNTIME_DIR" ]]; then
            find "$RUNTIME_DIR" -depth -delete
          fi
