name: Execute Polymarket trade intents

on:
  workflow_run:
    workflows: ["Forecast Edge scheduled research"]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: execute-polymarket-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.POLYMARKET_LIVE_TRADING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: polymarket-production
    env:
      AWS_REGION: ${{ vars.AWS_EC2_REGION || 'eu-west-1' }}
      AWS_INSTANCE_TYPE: ${{ vars.AWS_EC2_INSTANCE_TYPE || 't3a.medium' }}
      AWS_SUBNET_ID: ${{ vars.AWS_EC2_SUBNET_ID }}
      AWS_SECURITY_GROUP_ID: ${{ vars.AWS_EC2_SECURITY_GROUP_ID }}
      AWS_INSTANCE_PROFILE: ${{ vars.AWS_EC2_INSTANCE_PROFILE }}
      AWS_LEDGER_TABLE: ${{ vars.POLYMARKET_EXECUTION_LEDGER_TABLE }}
      AWS_RUNNER_PURPOSE: polymarket-runner-test
      MAX_PRICE_DEVIATION_BPS: "300"
      MAX_NOTIONAL_DEVIATION_BPS: "500"
      MAX_QUANTITY_REDUCTION_BPS: "2500"
      MAX_ORDER_NOTIONAL: "50"
      MAX_BATCH_NOTIONAL: "100"
      MAX_DAILY_NOTIONAL: "200"
      MAX_ORDER_QUANTITY: "1000"
      MINIMUM_CASH_RESERVE: "5"
      MAX_INTENTS: "20"
      PLAN_TTL_SECONDS: "120"
      SETTLEMENT_TIMEOUT_SECONDS: "90"
    steps:
      - name: Validate trigger and deployment configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_EXECUTION_ROLE_ARN }}
          POLYMARKET_DEPOSIT_WALLET: ${{ vars.POLYMARKET_DEPOSIT_WALLET }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_ROLE_TO_ASSUME AWS_SUBNET_ID AWS_SECURITY_GROUP_ID \
            AWS_INSTANCE_PROFILE AWS_LEDGER_TABLE POLYMARKET_DEPOSIT_WALLET \
            POLYMARKET_PRIVATE_KEY POLYMARKET_API_KEY POLYMARKET_API_SECRET \
            POLYMARKET_API_PASSPHRASE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Polymarket production configuration $name is missing"
              exit 1
            fi
          done
          if [[ ! "$POLYMARKET_DEPOSIT_WALLET" =~ ^0x[a-fA-F0-9]{40}$ ]]; then
            echo "::error::POLYMARKET_DEPOSIT_WALLET must be an EVM address"
            exit 1
          fi
          if [[ ! "$AWS_REGION" =~ ^(eu-west-1|eu-north-1|ap-south-1)$ ]]; then
            echo "::error::AWS_EC2_REGION is outside the approved region set"
            exit 1
          fi
          if [[ ! "$AWS_INSTANCE_TYPE" =~ ^(t3a|t4g)\.(small|medium)$ ]]; then
            echo "::error::AWS_EC2_INSTANCE_TYPE is outside the approved instance set"
            exit 1
          fi
          if [[ ! "$UPSTREAM_RUN_ID" =~ ^[0-9]+$ || ! "$UPSTREAM_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::Upstream workflow identity is incomplete"
            exit 1
          fi
          runtime_dir="$RUNNER_TEMP/polymarket-execution-$GITHUB_RUN_ID"
          mkdir -p "$runtime_dir/artifact" "$runtime_dir/release" "$runtime_dir/result"
          {
            echo "RUNTIME_DIR=$runtime_dir"
            echo "ARTIFACT_DIR=$runtime_dir/artifact"
            echo "RELEASE_DIR=$runtime_dir/release"
            echo "RESULT_DIR=$runtime_dir/result"
            echo "UPSTREAM_RUN_ID=$UPSTREAM_RUN_ID"
            echo "UPSTREAM_RUN_ATTEMPT=$UPSTREAM_RUN_ATTEMPT"
            echo "UPSTREAM_HEAD_SHA=$UPSTREAM_HEAD_SHA"
            echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME"
          } >> "$GITHUB_ENV"

      - name: Check out trusted executor code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download exact upstream trade-intent artifact
        uses: actions/download-artifact@v4
        with:
          name: forecast-edge-trade-intents
          path: ${{ env.ARTIFACT_DIR }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify upstream artifact and Release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entries < <(find "$ARTIFACT_DIR" -mindepth 1 -maxdepth 1 -print)
          if (( ${#entries[@]} != 1 )); then
            echo "::error::Upstream artifact must contain exactly one entry"
            exit 1
          fi
          trade_intents_path=${entries[0]}
          if [[ ! -f "$trade_intents_path" || -L "$trade_intents_path" || \
                "$(basename "$trade_intents_path")" != "trade-intents.jsonl" ]]; then
            echo "::error::Upstream artifact must contain only a regular trade-intents.jsonl"
            exit 1
          fi
          release_tag="forecast-edge-research/run-$UPSTREAM_RUN_ID-attempt-$UPSTREAM_RUN_ATTEMPT"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern research-release-manifest.json \
            --dir "$RELEASE_DIR"
          manifest="$RELEASE_DIR/research-release-manifest.json"
          artifact_sha=$(sha256sum "$trade_intents_path" | cut -d ' ' -f 1)
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$UPSTREAM_RUN_ID" \
            --arg run_attempt "$UPSTREAM_RUN_ATTEMPT" \
            --arg commit_sha "$UPSTREAM_HEAD_SHA" \
            --arg release_tag "$release_tag" \
            --arg digest "$artifact_sha" \
            '(.schema_version == "1.0" or .schema_version == "2.0") and
             .lineage_id == "forecast-edge-production" and
             .repository == $repository and
             .workflow_run_id == $run_id and
             .workflow_run_attempt == $run_attempt and
             .commit_sha == $commit_sha and
             .release_tag == $release_tag and
             .trade_intents_sha256 == $digest and
             (.validation.items | type == "number")' \
            "$manifest" >/dev/null
          execution_id=$(printf '%s' \
            "$GITHUB_REPOSITORY:$UPSTREAM_RUN_ID:$UPSTREAM_RUN_ATTEMPT:$artifact_sha" \
            | sha256sum | cut -d ' ' -f 1)
          {
            echo "TRADE_INTENTS_PATH=$trade_intents_path"
            echo "ARTIFACT_SHA256=$artifact_sha"
            echo "RELEASE_TAG=$release_tag"
            echo "EXECUTION_ID=$execution_id"
          } >> "$GITHUB_ENV"

      - name: Set up local validation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements-polymarket-execution.txt

      - name: Install local artifact validator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "jsonschema==4.25.0"

      - name: Revalidate and filter Polymarket intents
        id: intents
        shell: bash
        run: |
          set -euo pipefail
          filtered="$RUNTIME_DIR/polymarket-intents.jsonl"
          python scripts/polymarket_execution.py validate-artifact \
            --input "$TRADE_INTENTS_PATH" \
            --output "$filtered" \
            --summary "$RUNTIME_DIR/artifact-validation.json"
          manifest_items=$(jq -r '.validation.items' \
            "$RELEASE_DIR/research-release-manifest.json")
          artifact_items=$(jq -r '.items' "$RUNTIME_DIR/artifact-validation.json")
          if [[ "$manifest_items" != "$artifact_items" ]]; then
            echo "::error::Release validation count differs from the exact artifact"
            exit 1
          fi
          has_intents=false
          if [[ -s "$filtered" ]]; then
            has_intents=true
          fi
          echo "has-intents=$has_intents" >> "$GITHUB_OUTPUT"
          echo "POLYMARKET_INTENTS_PATH=$filtered" >> "$GITHUB_ENV"

      - name: Configure short-lived AWS credentials
        if: steps.intents.outputs.has-intents == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: polymarket-${{ github.run_id }}

      - name: Validate AWS identity and runner infrastructure
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          identity_arn=$(aws sts get-caller-identity --query Arn --output text)
          if [[ "$identity_arn" == *":root" ]]; then
            echo "::error::Refusing to launch an execution runner with AWS root credentials"
            exit 1
          fi
          subnet=$(aws ec2 describe-subnets --subnet-ids "$AWS_SUBNET_ID" \
            --query 'Subnets[0].[State,VpcId]' --output text)
          read -r subnet_state subnet_vpc <<< "$subnet"
          if [[ "$subnet_state" != "available" || -z "$subnet_vpc" ]]; then
            echo "::error::Configured EC2 subnet is unavailable"
            exit 1
          fi
          group=$(aws ec2 describe-security-groups --group-ids "$AWS_SECURITY_GROUP_ID" \
            --query 'SecurityGroups[0].[VpcId,Tags[?Key==`Purpose`].Value|[0],length(IpPermissions)]' \
            --output text)
          read -r group_vpc group_purpose ingress_count <<< "$group"
          if [[ "$group_vpc" != "$subnet_vpc" || "$group_purpose" != "$AWS_RUNNER_PURPOSE" ]]; then
            echo "::error::Runner security group VPC or Purpose tag is invalid"
            exit 1
          fi
          if [[ "$ingress_count" != "0" ]]; then
            echo "::error::Dedicated runner security group has unexpected existing ingress"
            exit 1
          fi
          aws iam get-instance-profile --instance-profile-name "$AWS_INSTANCE_PROFILE" \
            --query 'InstanceProfile.InstanceProfileName' --output text >/dev/null

      - name: Open one ephemeral SSH ingress rule
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runner_ip=$(curl --fail --silent --show-error --max-time 15 \
            https://checkip.amazonaws.com | tr -d '[:space:]')
          if [[ ! "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Could not resolve the GitHub runner public IPv4 address"
            exit 1
          fi
          rule=$(aws ec2 authorize-security-group-ingress \
            --group-id "$AWS_SECURITY_GROUP_ID" \
            --ip-permissions \
              "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$runner_ip/32,Description=github-run-$GITHUB_RUN_ID}]" \
            --tag-specifications \
              "ResourceType=security-group-rule,Tags=[{Key=Purpose,Value=$AWS_RUNNER_PURPOSE},{Key=GitHubRunId,Value=$GITHUB_RUN_ID}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)
          if [[ ! "$rule" =~ ^sgr-[a-f0-9]+$ ]]; then
            echo "::error::AWS did not return the temporary security-group rule id"
            exit 1
          fi
          echo "AWS_INGRESS_RULE_ID=$rule" >> "$GITHUB_ENV"

      - name: Generate ephemeral SSH identity and cloud-init
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNTIME_DIR/runner-key"
          ssh-keygen -q -t ed25519 -N '' -f "$key_path" \
            -C "github-$GITHUB_RUN_ID"
          public_key=$(<"$key_path.pub")
          SSH_PUBLIC_KEY="$public_key" python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["SSH_PUBLIC_KEY"]
          output = Path(os.environ["RUNTIME_DIR"]) / "cloud-init.yaml"
          output.write_text(
              """#cloud-config
          package_update: true
          packages:
            - ca-certificates
            - python3
            - python3-venv
            - openssh-server
          users:
            - default
            - name: ubuntu
              lock_passwd: true
              shell: /bin/bash
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - {key}
          ssh_pwauth: false
          disable_root: true
          write_files:
            - path: /etc/ssh/sshd_config.d/99-polymarket-runner.conf
              permissions: '0644'
              content: |
                PasswordAuthentication no
                KbdInteractiveAuthentication no
                PermitRootLogin no
          runcmd:
            - [systemctl, restart, ssh]
            - [sh, -c, 'fingerprint=$(ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 | awk "{{print $2}}"); echo "SSH_HOST_ED25519_FINGERPRINT $fingerprint" > /dev/console']
            - [sh, -c, 'echo POLYMARKET_RUNNER_CLOUD_INIT_READY > /dev/console']
          """.format(key=key),
              encoding="utf-8",
          )
          PY
          {
            echo "SSH_KEY_PATH=$key_path"
            echo "KNOWN_HOSTS_PATH=$RUNTIME_DIR/known_hosts"
            echo "CLOUD_INIT_PATH=$RUNTIME_DIR/cloud-init.yaml"
          } >> "$GITHUB_ENV"

      - name: Resolve Canonical Ubuntu image and launch one EC2 instance
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          architecture=x86_64
          image_arch=amd64
          if [[ "$AWS_INSTANCE_TYPE" == t4g.* ]]; then
            architecture=arm64
            image_arch=arm64
          fi
          ami=$(aws ec2 describe-images \
            --owners 099720109477 \
            --filters \
              "Name=name,Values=ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-$image_arch-server-*" \
              "Name=architecture,Values=$architecture" \
              "Name=state,Values=available" \
              "Name=root-device-type,Values=ebs" \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' \
            --output text)
          if [[ ! "$ami" =~ ^ami-[a-f0-9]+$ ]]; then
            echo "::error::No trusted Canonical Ubuntu 24.04 image was resolved"
            exit 1
          fi
          block_devices=$(jq -cn '[{
            DeviceName:"/dev/sda1",
            Ebs:{VolumeSize:12,VolumeType:"gp3",Encrypted:true,DeleteOnTermination:true}
          }]')
          instance_id=$(aws ec2 run-instances \
            --image-id "$ami" \
            --instance-type "$AWS_INSTANCE_TYPE" \
            --min-count 1 \
            --max-count 1 \
            --subnet-id "$AWS_SUBNET_ID" \
            --security-group-ids "$AWS_SECURITY_GROUP_ID" \
            --associate-public-ip-address \
            --iam-instance-profile "Name=$AWS_INSTANCE_PROFILE" \
            --user-data "file://$CLOUD_INIT_PATH" \
            --block-device-mappings "$block_devices" \
            --credit-specification CpuCredits=standard \
            --metadata-options HttpTokens=required,HttpEndpoint=enabled,HttpPutResponseHopLimit=1 \
            --instance-initiated-shutdown-behavior terminate \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Purpose,Value=$AWS_RUNNER_PURPOSE},{Key=Name,Value=polymarket-$GITHUB_RUN_ID},{Key=GitHubRunId,Value=$GITHUB_RUN_ID}]" \
              "ResourceType=volume,Tags=[{Key=Purpose,Value=$AWS_RUNNER_PURPOSE},{Key=Name,Value=polymarket-$GITHUB_RUN_ID},{Key=GitHubRunId,Value=$GITHUB_RUN_ID}]" \
            --query 'Instances[0].InstanceId' \
            --output text)
          if [[ ! "$instance_id" =~ ^i-[a-f0-9]+$ ]]; then
            echo "::error::AWS did not return one EC2 instance id"
            exit 1
          fi
          echo "AWS_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          aws ec2 wait instance-running --instance-ids "$instance_id"
          aws ec2 wait instance-status-ok --instance-ids "$instance_id"
          public_ip=$(aws ec2 describe-instances --instance-ids "$instance_id" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [[ ! "$public_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::EC2 runner has no public IPv4 address"
            exit 1
          fi
          echo "AWS_INSTANCE_PUBLIC_IP=$public_ip" >> "$GITHUB_ENV"

      - name: Verify EC2 SSH host identity and cloud-init completion
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          console_fingerprint=''
          for _ in $(seq 1 60); do
            output=$(aws ec2 get-console-output --latest \
              --instance-id "$AWS_INSTANCE_ID" --query Output --output text 2>/dev/null || true)
            if grep -q 'POLYMARKET_RUNNER_CLOUD_INIT_READY' <<< "$output"; then
              console_fingerprint=$(grep -o \
                'SSH_HOST_ED25519_FINGERPRINT SHA256:[A-Za-z0-9+/=]*' \
                <<< "$output" | tail -1 | awk '{print $2}')
              break
            fi
            sleep 10
          done
          if [[ ! "$console_fingerprint" =~ ^SHA256: ]]; then
            echo "::error::Could not obtain the EC2 host-key fingerprint from console output"
            exit 1
          fi
          for _ in $(seq 1 30); do
            if ssh-keyscan -T 5 -t ed25519 "$AWS_INSTANCE_PUBLIC_IP" \
              > "$KNOWN_HOSTS_PATH" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          scanned_fingerprint=$(ssh-keygen -lf "$KNOWN_HOSTS_PATH" -E sha256 \
            | awk '{print $2}')
          if [[ "$scanned_fingerprint" != "$console_fingerprint" ]]; then
            echo "::error::EC2 SSH host key does not match its authenticated console output"
            exit 1
          fi

      - name: Transfer trusted executor bundle and runtime inputs
        if: steps.intents.outputs.has-intents == 'true'
        env:
          POLYMARKET_DEPOSIT_WALLET: ${{ vars.POLYMARKET_DEPOSIT_WALLET }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNTIME_DIR/executor-bundle.tar.gz"
          tar -czf "$bundle" \
            execution \
            scripts/polymarket_execution.py \
            scripts/run_with_polymarket_secrets.py \
            schemas/trade-intent.schema.json \
            automation/requirements-polymarket-execution.txt
          jq -n \
            --arg private_key "$POLYMARKET_PRIVATE_KEY" \
            --arg wallet "$POLYMARKET_DEPOSIT_WALLET" \
            --arg api_key "$POLYMARKET_API_KEY" \
            --arg api_secret "$POLYMARKET_API_SECRET" \
            --arg api_passphrase "$POLYMARKET_API_PASSPHRASE" \
            '{
              POLYMARKET_PRIVATE_KEY:$private_key,
              POLYMARKET_DEPOSIT_WALLET:$wallet,
              POLYMARKET_API_KEY:$api_key,
              POLYMARKET_API_SECRET:$api_secret,
              POLYMARKET_API_PASSPHRASE:$api_passphrase
            }' > "$RUNTIME_DIR/polymarket-secrets.json"
          chmod 600 "$RUNTIME_DIR/polymarket-secrets.json"
          jq -n \
            --argjson max_price_deviation_bps "$MAX_PRICE_DEVIATION_BPS" \
            --argjson max_notional_deviation_bps "$MAX_NOTIONAL_DEVIATION_BPS" \
            --argjson max_quantity_reduction_bps "$MAX_QUANTITY_REDUCTION_BPS" \
            --arg max_order_notional "$MAX_ORDER_NOTIONAL" \
            --arg max_batch_notional "$MAX_BATCH_NOTIONAL" \
            --arg max_order_quantity "$MAX_ORDER_QUANTITY" \
            --arg minimum_cash_reserve "$MINIMUM_CASH_RESERVE" \
            --argjson max_intents "$MAX_INTENTS" \
            --argjson plan_ttl_seconds "$PLAN_TTL_SECONDS" \
            '{
              max_price_deviation_bps:$max_price_deviation_bps,
              max_notional_deviation_bps:$max_notional_deviation_bps,
              max_quantity_reduction_bps:$max_quantity_reduction_bps,
              max_order_notional:$max_order_notional,
              max_batch_notional:$max_batch_notional,
              max_order_quantity:$max_order_quantity,
              minimum_cash_reserve:$minimum_cash_reserve,
              max_intents:$max_intents,
              plan_ttl_seconds:$plan_ttl_seconds
            }' > "$RUNTIME_DIR/risk-limits.json"
          ssh_options=(
            -i "$SSH_KEY_PATH"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH"
            -o ConnectTimeout=15
          )
          scp "${ssh_options[@]}" \
            "$bundle" \
            "$POLYMARKET_INTENTS_PATH" \
            "$RUNTIME_DIR/risk-limits.json" \
            "$RUNTIME_DIR/polymarket-secrets.json" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP:/tmp/"

      - name: Install pinned execution dependencies on EC2
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP" -- \
            bash -se <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /home/ubuntu/polymarket-executor/repo
          install -d -m 700 /home/ubuntu/polymarket-executor/runtime
          tar -xzf /tmp/executor-bundle.tar.gz -C /home/ubuntu/polymarket-executor/repo
          install -m 600 /tmp/polymarket-secrets.json \
            /home/ubuntu/polymarket-executor/runtime/secrets.json
          install -m 600 /tmp/polymarket-intents.jsonl \
            /home/ubuntu/polymarket-executor/runtime/intents.jsonl
          install -m 600 /tmp/risk-limits.json \
            /home/ubuntu/polymarket-executor/runtime/risk-limits.json
          rm -f /tmp/executor-bundle.tar.gz /tmp/polymarket-secrets.json \
            /tmp/polymarket-intents.jsonl /tmp/risk-limits.json
          python3 -m venv /home/ubuntu/polymarket-executor/venv
          /home/ubuntu/polymarket-executor/venv/bin/python -m pip install \
            --disable-pip-version-check \
            --requirement \
            /home/ubuntu/polymarket-executor/repo/automation/requirements-polymarket-execution.txt
          REMOTE

      - name: Revalidate artifact on EC2
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP" -- \
            bash -lc '
              set -euo pipefail
              cd /home/ubuntu/polymarket-executor/repo
              ../venv/bin/python scripts/polymarket_execution.py validate-artifact \
                --input ../runtime/intents.jsonl \
                --output ../runtime/validated-intents.jsonl \
                --summary ../runtime/validation.json
            '

      - name: Check network, API, account, funds, allowances, positions, and markets
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP" -- \
            bash -lc '
              set -euo pipefail
              cd /home/ubuntu/polymarket-executor/repo
              ../venv/bin/python scripts/run_with_polymarket_secrets.py \
                ../runtime/secrets.json \
                ../venv/bin/python scripts/polymarket_execution.py preflight \
                --intents ../runtime/validated-intents.jsonl \
                --output ../runtime/preflight.json
            '

      - name: Build bounded orders from a fresh book
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP" -- \
            bash -lc "
              set -euo pipefail
              cd /home/ubuntu/polymarket-executor/repo
              ../venv/bin/python scripts/polymarket_execution.py plan \\
                --intents ../runtime/validated-intents.jsonl \\
                --preflight ../runtime/preflight.json \\
                --limits ../runtime/risk-limits.json \\
                --output ../runtime/plan.json \\
                --execution-id '$EXECUTION_ID' \\
                --artifact-sha256 '$ARTIFACT_SHA256'
            "

      - name: Submit protected orders and cancel unfilled remainders
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP" -- \
            bash -lc "
              set -euo pipefail
              cd /home/ubuntu/polymarket-executor/repo
              ../venv/bin/python scripts/run_with_polymarket_secrets.py \\
                ../runtime/secrets.json \\
                ../venv/bin/python scripts/polymarket_execution.py execute \\
                --plan ../runtime/plan.json \\
                --output ../runtime/receipt.json \\
                --execution-id '$EXECUTION_ID' \\
                --artifact-sha256 '$ARTIFACT_SHA256' \\
                --ledger-table '$AWS_LEDGER_TABLE' \\
                --lease-owner '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT' \\
                --daily-notional-limit '$MAX_DAILY_NOTIONAL' \\
                --settlement-timeout-seconds '$SETTLEMENT_TIMEOUT_SECONDS'
            "

      - name: Verify final account and order state
        if: steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP" -- \
            bash -lc "
              set -euo pipefail
              cd /home/ubuntu/polymarket-executor/repo
              ../venv/bin/python scripts/run_with_polymarket_secrets.py \\
                ../runtime/secrets.json \\
                ../venv/bin/python scripts/polymarket_execution.py verify \\
                --receipt ../runtime/receipt.json \\
                --output ../runtime/verification.json \\
                --execution-id '$EXECUTION_ID'
            "

      - name: Retrieve sanitized execution receipts
        if: always() && steps.intents.outputs.has-intents == 'true' && env.AWS_INSTANCE_PUBLIC_IP != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP:/home/ubuntu/polymarket-executor/runtime/receipt.json" \
            "$RESULT_DIR/receipt.json" || true
          scp -i "$SSH_KEY_PATH" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$KNOWN_HOSTS_PATH" \
            "ubuntu@$AWS_INSTANCE_PUBLIC_IP:/home/ubuntu/polymarket-executor/runtime/verification.json" \
            "$RESULT_DIR/verification.json" || true

      - name: Terminate EC2 and revoke temporary ingress
        if: always() && steps.intents.outputs.has-intents == 'true'
        shell: bash
        run: |
          set +e
          if [[ -n "${AWS_INSTANCE_ID:-}" ]]; then
            aws ec2 terminate-instances --instance-ids "$AWS_INSTANCE_ID" >/dev/null
            aws ec2 wait instance-terminated --instance-ids "$AWS_INSTANCE_ID"
          fi
          if [[ -n "${AWS_INGRESS_RULE_ID:-}" ]]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$AWS_SECURITY_GROUP_ID" \
              --security-group-rule-ids "$AWS_INGRESS_RULE_ID" >/dev/null
          fi
          rm -f "${SSH_KEY_PATH:-}" "${SSH_KEY_PATH:-}.pub" \
            "$RUNTIME_DIR/polymarket-secrets.json"

      - name: Summarize execution
        if: always()
        shell: bash
        run: |
          {
            echo '### Polymarket execution'
            echo "- Upstream run: \`$UPSTREAM_RUN_ID\`, attempt \`$UPSTREAM_RUN_ATTEMPT\`"
            echo "- Upstream artifact SHA-256: \`${ARTIFACT_SHA256:-unavailable}\`"
            if [[ "${{ steps.intents.outputs.has-intents }}" != "true" ]]; then
              echo '- Result: no Polymarket trade intents; no EC2 instance was launched.'
            elif [[ -s "$RESULT_DIR/receipt.json" ]]; then
              status=$(jq -r '.status // "unknown"' "$RESULT_DIR/receipt.json")
              receipts=$(jq -r '.receipts | length' "$RESULT_DIR/receipt.json")
              echo "- Result: \`$status\`"
              echo "- Order receipts: \`$receipts\`"
            else
              echo '- Result: failed before a sanitized receipt could be retrieved.'
            fi
            echo '- EC2 cleanup and temporary-ingress revocation were attempted unconditionally.'
          } >> "$GITHUB_STEP_SUMMARY"
