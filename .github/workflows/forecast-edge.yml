name: Forecast Edge research and optional execution

on:
  schedule:
    # Repository variables cannot be interpolated into cron. Trigger hourly and
    # let the gate below enforce the configured interval.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      execute-live-trades:
        description: Execute validated trade intents when production configuration is complete
        required: false
        default: false
        type: boolean
      research-only:
        description: Run research while production automation is paused; never execute trade intents
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: forecast-edge-parent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      execution-requested: ${{ steps.gate.outputs.execution-requested }}
      execution-ready: ${{ steps.gate.outputs.execution-ready }}
      interval-hours: ${{ steps.gate.outputs.interval-hours }}
      anchor-utc-hour: ${{ steps.gate.outputs.anchor-utc-hour }}
      gate-event-name: ${{ steps.gate.outputs.gate-event-name }}
      automation-paused: ${{ steps.gate.outputs.automation-paused }}
    steps:
      - name: Validate schedule and private workflow configuration
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXECUTION: ${{ inputs['execute-live-trades'] || false }}
          RESEARCH_ONLY: ${{ inputs['research-only'] || false }}
          INTERVAL_HOURS: ${{ vars.FORECAST_EDGE_INTERVAL_HOURS || '8' }}
          ANCHOR_UTC_HOUR: ${{ vars.FORECAST_EDGE_ANCHOR_UTC_HOUR || '2' }}
          LIVE_TRADING_ENABLED: ${{ vars.POLYMARKET_LIVE_TRADING_ENABLED || 'false' }}
          AUTOMATION_PAUSED: ${{ vars.FORECAST_EDGE_AUTOMATION_PAUSED || 'false' }}
          FORECAST_EDGE_MARKET_ADAPTERS: ${{ vars.FORECAST_EDGE_MARKET_ADAPTERS }}
          FORECAST_EDGE_MARKET_ACCOUNTS_JSON: ${{ secrets.FORECAST_EDGE_MARKET_ACCOUNTS_JSON }}
          KIMI_CODE_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FORECAST_EDGE_BREAKER_TOKEN: ${{ secrets.FORECAST_EDGE_BREAKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing_configuration=()
          for name in FORECAST_EDGE_MARKET_ADAPTERS FORECAST_EDGE_MARKET_ACCOUNTS_JSON \
            KIMI_CODE_API_KEY FEISHU_APP_ID FEISHU_APP_SECRET FEISHU_CHAT_ID \
            FORECAST_EDGE_BREAKER_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing_configuration+=("$name")
            fi
          done

          # A public mirror (or a private fork that has not been configured yet)
          # must be a harmless no-op.  Keep the gate successful and explicitly
          # skip every downstream job instead of failing or attempting research.
          if (( ${#missing_configuration[@]} > 0 )); then
            printf '::notice::Forecast Edge is not configured; skipping this run (missing: %s)\n' \
              "${missing_configuration[*]}"
            {
              echo "should-run=false"
              echo "execution-requested=false"
              echo "execution-ready=false"
              echo "interval-hours=0"
              echo "anchor-utc-hour=0"
              echo "gate-event-name=$EVENT_NAME"
              echo "automation-paused=$AUTOMATION_PAUSED"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$INTERVAL_HOURS" =~ ^[0-9]+$ ]]; then
            echo "::error::FORECAST_EDGE_INTERVAL_HOURS must be an integer greater than or equal to 6"
            exit 1
          fi
          if [[ ! "$ANCHOR_UTC_HOUR" =~ ^[0-9]+$ ]]; then
            echo "::error::FORECAST_EDGE_ANCHOR_UTC_HOUR must be an integer from 0 through 23"
            exit 1
          fi
          interval=$((10#$INTERVAL_HOURS))
          anchor=$((10#$ANCHOR_UTC_HOUR))
          if (( interval < 6 || anchor > 23 )); then
            echo "::error::Forecast Edge schedule configuration is outside the supported range"
            exit 1
          fi

          should_run=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RESEARCH_ONLY" == "true" ]]; then
            if [[ "$MANUAL_EXECUTION" == "true" ]]; then
              echo "::error::research-only cannot be combined with execute-live-trades"
              exit 1
            fi
            should_run=true
          elif [[ "$AUTOMATION_PAUSED" == "true" ]]; then
            echo "::warning::Forecast Edge automation is paused by the production circuit breaker"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_run=true
          else
            epoch_hour=$(( $(date -u +%s) / 3600 ))
            if (( (epoch_hour - anchor) % interval == 0 )); then
              should_run=true
            fi
          fi

          if [[ "$should_run" == "true" ]]; then
            : # Required configuration was checked before schedule evaluation.
          fi

          execution_requested=false
          if [[ "$RESEARCH_ONLY" != "true" && \
                "$AUTOMATION_PAUSED" != "true" && \
                ("$LIVE_TRADING_ENABLED" == "true" || "$MANUAL_EXECUTION" == "true") ]]; then
            execution_requested=true
          fi
          execution_ready=$execution_requested
          {
            echo "should-run=$should_run"
            echo "execution-requested=$execution_requested"
            echo "execution-ready=$execution_ready"
            echo "interval-hours=$interval"
            echo "anchor-utc-hour=$anchor"
            echo "gate-event-name=$EVENT_NAME"
            echo "automation-paused=$AUTOMATION_PAUSED"
          } >> "$GITHUB_OUTPUT"

  research:
    needs: gate
    if: ${{ needs.gate.outputs.should-run == 'true' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/forecast-edge-research.yml
    secrets:
      KIMI_CODE_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
      FORECAST_EDGE_MARKET_ACCOUNTS_JSON: ${{ secrets.FORECAST_EDGE_MARKET_ACCOUNTS_JSON }}

  execution:
    needs: [gate, research]
    if: >-
      needs.gate.outputs.execution-ready == 'true' &&
      needs.research.result == 'success'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/execute-polymarket.yml
    with:
      trade-intents-sha256: ${{ needs.research.outputs.trade-intents-sha256 }}

  release:
    needs: [gate, research, execution]
    if: >-
      always() &&
      needs.research.result == 'success' &&
      ((needs.gate.outputs.execution-ready == 'true' &&
        needs.execution.result == 'success') ||
       (needs.gate.outputs.execution-ready != 'true' &&
        needs.execution.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      RELEASE_TAG: ${{ needs.research.outputs.release-tag }}
      GENERATED_AT: ${{ needs.research.outputs.generated-at }}
      TRADE_INTENTS_SHA256: ${{ needs.research.outputs.trade-intents-sha256 }}
      HAS_INTENTS: ${{ needs.research.outputs.has-intents }}
      EXECUTION_REQUESTED: ${{ needs.gate.outputs.execution-requested }}
      EXECUTION_READY: ${{ needs.gate.outputs.execution-ready }}
      EXECUTION_RESULT: ${{ needs.execution.result }}
      SCHEDULE_INTERVAL_HOURS: ${{ needs.gate.outputs.interval-hours }}
      SCHEDULE_ANCHOR_UTC_HOUR: ${{ needs.gate.outputs.anchor-utc-hour }}
      GATE_EVENT_NAME: ${{ needs.gate.outputs.gate-event-name }}
      GATE_SHOULD_RUN: ${{ needs.gate.outputs.should-run }}
      AUTOMATION_PAUSED: ${{ needs.gate.outputs.automation-paused }}
    steps:
      - name: Check out release templates
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare final release workspace
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/forecast-edge-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$runtime_dir"
          {
            echo "RELEASE_RUNTIME_DIR=$runtime_dir"
            echo "RELEASE_ASSETS_DIR=$runtime_dir/release-assets"
            echo "ISSUE_BODY_PATH=$runtime_dir/issue.md"
            echo "RELEASE_NOTES_PATH=$runtime_dir/release-notes.md"
          } >> "$GITHUB_ENV"

      - name: Download completed research handoff artifact
        uses: actions/download-artifact@v4
        with:
          name: forecast-edge-research-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forecast-edge-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download completed execution artifact
        if: ${{ needs.execution.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: polymarket-execution-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forecast-edge-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify and extract private research package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RELEASE_RUNTIME_DIR/research-handoff.tar.gz" \
          DESTINATION="$RELEASE_RUNTIME_DIR" python3 - <<'PY'
          import os
          import re
          import tarfile
          from pathlib import PurePosixPath

          required = {
              "release-assets/forecast-edge-research-report.tar.gz",
              "release-assets/research-release-manifest.json",
              "release-assets/validation-summary.json",
              "release-notes.md",
              "issue.md",
          }
          report_asset = re.compile(
              r"release-assets/report-[a-z][a-z0-9-]*\.(?:json|md)"
          )
          with tarfile.open(os.environ["ARCHIVE"], "r:gz") as archive:
              files = set()
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("unsafe path in private research handoff")
                  if member.isfile():
                      files.add(member.name)
                  elif not member.isdir():
                      raise SystemExit("unsupported entry in private research handoff")
              if not required.issubset(files):
                  raise SystemExit("private research handoff is missing required files")
              if any(
                  path not in required and report_asset.fullmatch(path) is None
                  for path in files
              ):
                  raise SystemExit("private research handoff has an unexpected file set")
              archive.extractall(os.environ["DESTINATION"])
          PY
          manifest="$RELEASE_ASSETS_DIR/research-release-manifest.json"
          archive="$RELEASE_ASSETS_DIR/forecast-edge-research-report.tar.gz"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg trade_digest "$TRADE_INTENTS_SHA256" \
            '.schema_version == "2.0" and
             .lineage_id == "forecast-edge-production" and
             .repository == $repository and
             .release_tag == $release_tag and
             .workflow_run_id == $run_id and
             .workflow_run_attempt == $run_attempt and
             .commit_sha == $commit_sha and
             .trade_intents_sha256 == $trade_digest and
             (.report_count | type == "number" and . > 0) and
             (.reports | type == "array") and
             .report_count == (.reports | length) and
             ([.reports[].adapter] | length == (unique | length)) and
             all(.reports[];
               (.adapter | type == "string" and test("^[a-z][a-z0-9-]*$")) and
               .json_asset == ("report-" + .adapter + ".json") and
               .markdown_asset == ("report-" + .adapter + ".md") and
               (.sha256 | test("^[a-f0-9]{64}$"))
             )' \
            "$manifest" >/dev/null
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = \
            "$(jq -r '.report_archive_sha256' "$manifest")"
          while IFS=$'\t' read -r json_asset markdown_asset report_digest; do
            test -f "$RELEASE_ASSETS_DIR/$json_asset"
            test -f "$RELEASE_ASSETS_DIR/$markdown_asset"
            test "$(sha256sum "$RELEASE_ASSETS_DIR/$json_asset" | cut -d ' ' -f 1)" = \
              "$report_digest"
          done < <(
            jq -r '.reports[] | [.json_asset, .markdown_asset, .sha256] | @tsv' "$manifest"
          )
          actual_reports="$RELEASE_RUNTIME_DIR/actual-direct-reports.txt"
          expected_reports="$RELEASE_RUNTIME_DIR/expected-direct-reports.txt"
          find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f \
            \( -name 'report-*.json' -o -name 'report-*.md' \) \
            -printf '%f\n' | LC_ALL=C sort -u > "$actual_reports"
          jq -r '.reports[] | .json_asset, .markdown_asset' "$manifest" \
            | LC_ALL=C sort -u > "$expected_reports"
          if ! cmp -s "$actual_reports" "$expected_reports"; then
            echo "::error::Private handoff direct reports differ from the signed manifest"
            diff -u "$expected_reports" "$actual_reports" || true
            exit 1
          fi
          test "$(sha256sum "$RELEASE_RUNTIME_DIR/trade-intents.jsonl" | cut -d ' ' -f 1)" = \
            "$TRADE_INTENTS_SHA256"

      - name: Build final iteration manifest
        shell: bash
        run: |
          set -euo pipefail
          receipt_asset=null
          verification_asset=null
          receipt_digest=null
          verification_digest=null
          diagnostics_archive_digest=null
          diagnostics_summary_digest=null
          diagnostics_manifest_digest=null
          trade_intents_asset=null
          trade_intents_published=false
          if [[ "$HAS_INTENTS" == "true" ]]; then
            test -s "$RELEASE_RUNTIME_DIR/trade-intents.jsonl"
            trade_intents_asset=trade-intents.jsonl
            trade_intents_published=true
          elif [[ "$HAS_INTENTS" == "false" ]]; then
            test ! -s "$RELEASE_RUNTIME_DIR/trade-intents.jsonl"
          else
            echo "::error::Research has-intents output must be true or false"
            exit 1
          fi
          if [[ "$EXECUTION_RESULT" == "success" ]]; then
            jq -e '
              (.status == "COMPLETED" or
               .status == "NO_ACTIONS" or
               .status == "COMPLETED_WITH_WARNINGS") and
              (.receipts | type == "array") and
              all(.receipts[];
                .status == "FULL" or
                (.status == "NO_FILL" and .code == "FOK_NOT_FILLED")
              )
            ' "$RELEASE_RUNTIME_DIR/execution-receipt.json" >/dev/null
            jq -e '.orders | type == "array"' \
              "$RELEASE_RUNTIME_DIR/execution-verification.json" >/dev/null
            receipt_asset=execution-receipt.json
            verification_asset=execution-verification.json
            receipt_digest=$(sha256sum "$RELEASE_RUNTIME_DIR/$receipt_asset" | cut -d ' ' -f 1)
            verification_digest=$(sha256sum "$RELEASE_RUNTIME_DIR/$verification_asset" | cut -d ' ' -f 1)
            diagnostics_archive_digest=$(sha256sum \
              "$RELEASE_RUNTIME_DIR/execution-diagnostics.tar.gz" | cut -d ' ' -f 1)
            test "$(cut -d ' ' -f 1 "$RELEASE_RUNTIME_DIR/execution-diagnostics.sha256")" = \
              "$diagnostics_archive_digest"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg execution_id "$(jq -r '.execution_id' "$RELEASE_RUNTIME_DIR/execution-receipt.json")" \
              '.schema_version == "1.0" and
               .repository == $repository and
               .workflow_run_id == $run_id and
               .workflow_run_attempt == $run_attempt and
               .execution_id == $execution_id and
               .secret_scan_passed == true and
               (.intent_trace | type == "array")' \
              "$RELEASE_RUNTIME_DIR/execution-diagnostic-summary.json" >/dev/null
            jq -e \
              --arg run_id "$GITHUB_RUN_ID" \
              '.schema_version == "1.0" and
               .workflow_run_id == $run_id and
               .secret_scan_passed == true and
               (.files | type == "array" and length > 0)' \
              "$RELEASE_RUNTIME_DIR/execution-diagnostic-manifest.json" >/dev/null
            diagnostics_summary_digest=$(sha256sum \
              "$RELEASE_RUNTIME_DIR/execution-diagnostic-summary.json" | cut -d ' ' -f 1)
            diagnostics_manifest_digest=$(sha256sum \
              "$RELEASE_RUNTIME_DIR/execution-diagnostic-manifest.json" | cut -d ' ' -f 1)
          fi
          jq -n \
            --arg schema_version "1.0" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg generated_at "$GENERATED_AT" \
            --arg trade_intents_sha256 "$TRADE_INTENTS_SHA256" \
            --arg trade_intents_asset "$trade_intents_asset" \
            --argjson trade_intents_published "$trade_intents_published" \
            --argjson has_intents "$HAS_INTENTS" \
            --argjson execution_requested "$EXECUTION_REQUESTED" \
            --argjson execution_ready "$EXECUTION_READY" \
            --arg execution_result "$EXECUTION_RESULT" \
            --arg schedule_interval_hours "$SCHEDULE_INTERVAL_HOURS" \
            --arg schedule_anchor_utc_hour "$SCHEDULE_ANCHOR_UTC_HOUR" \
            --arg gate_event_name "$GATE_EVENT_NAME" \
            --arg gate_should_run "$GATE_SHOULD_RUN" \
            --arg automation_paused "$AUTOMATION_PAUSED" \
            --arg receipt_asset "$receipt_asset" \
            --arg receipt_sha256 "$receipt_digest" \
            --arg verification_asset "$verification_asset" \
            --arg verification_sha256 "$verification_digest" \
            --arg diagnostics_archive_sha256 "$diagnostics_archive_digest" \
            --arg diagnostics_summary_sha256 "$diagnostics_summary_digest" \
            --arg diagnostics_manifest_sha256 "$diagnostics_manifest_digest" \
            '{
              schema_version:$schema_version,
              repository:$repository,
              release_tag:$release_tag,
              commit_sha:$commit_sha,
              workflow_run_id:$run_id,
              workflow_run_attempt:$run_attempt,
              generated_at:$generated_at,
              trade_intents:{
                published:$trade_intents_published,
                asset:(if $trade_intents_asset == "null" then null else $trade_intents_asset end),
                sha256:$trade_intents_sha256,
                has_items:$has_intents
              },
              schedule:{
                event_name:$gate_event_name,
                interval_hours:($schedule_interval_hours|tonumber),
                anchor_utc_hour:($schedule_anchor_utc_hour|tonumber),
                gate_should_run:($gate_should_run == "true"),
                automation_paused:($automation_paused == "true")
              },
              execution:{
                requested:$execution_requested,
                configuration_ready:$execution_ready,
                workflow_result:$execution_result,
                receipt_asset:(if $receipt_asset == "null" then null else $receipt_asset end),
                receipt_sha256:(if $receipt_sha256 == "null" then null else $receipt_sha256 end),
                verification_asset:(if $verification_asset == "null" then null else $verification_asset end),
                verification_sha256:(if $verification_sha256 == "null" then null else $verification_sha256 end),
                diagnostics:(
                  if $diagnostics_archive_sha256 == "null" then null
                  else {
                    archive_asset:"execution-diagnostics.tar.gz",
                    archive_sha256:$diagnostics_archive_sha256,
                    checksum_asset:"execution-diagnostics.sha256",
                    summary_asset:"execution-diagnostic-summary.json",
                    summary_sha256:$diagnostics_summary_sha256,
                    manifest_asset:"execution-diagnostic-manifest.json",
                    manifest_sha256:$diagnostics_manifest_sha256
                  }
                  end
                )
              }
            }' > "$RELEASE_RUNTIME_DIR/iteration-release-manifest.json"
          {
            printf '\n## Execution\n\n'
            printf -- '- Requested: `%s`\n' "$EXECUTION_REQUESTED"
            printf -- '- Configuration ready: `%s`\n' "$EXECUTION_READY"
            printf -- '- Subworkflow result: `%s`\n' "$EXECUTION_RESULT"
            printf -- '- Raw trade intents published after subworkflow completion: `%s`\n' \
              "$trade_intents_published"
          } >> "$RELEASE_NOTES_PATH"
          {
            printf '\n---\n\n'
            printf -- '- Execution requested: `%s`\n' "$EXECUTION_REQUESTED"
            printf -- '- Execution configuration ready: `%s`\n' "$EXECUTION_READY"
            printf -- '- Execution workflow: `%s`\n' "$EXECUTION_RESULT"
          } >> "$ISSUE_BODY_PATH"

      - name: Publish one final iteration Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Refusing to replace existing iteration Release $RELEASE_TAG"
            exit 1
          fi
          assets=(
            "$RELEASE_ASSETS_DIR/forecast-edge-research-report.tar.gz"
            "$RELEASE_ASSETS_DIR/research-release-manifest.json"
            "$RELEASE_ASSETS_DIR/validation-summary.json"
            "$RELEASE_RUNTIME_DIR/iteration-release-manifest.json"
          )
          if [[ "$HAS_INTENTS" == "true" ]]; then
            test -s "$RELEASE_RUNTIME_DIR/trade-intents.jsonl"
            assets+=("$RELEASE_RUNTIME_DIR/trade-intents.jsonl")
          else
            test "$HAS_INTENTS" = "false"
            test ! -s "$RELEASE_RUNTIME_DIR/trade-intents.jsonl"
          fi
          while IFS= read -r report_asset; do
            assets+=("$RELEASE_ASSETS_DIR/$report_asset")
          done < <(
            jq -r '.reports[] | .json_asset, .markdown_asset' \
              "$RELEASE_ASSETS_DIR/research-release-manifest.json" | sort
          )
          if [[ "$EXECUTION_RESULT" == "success" ]]; then
            assets+=(
              "$RELEASE_RUNTIME_DIR/execution-receipt.json"
              "$RELEASE_RUNTIME_DIR/execution-verification.json"
              "$RELEASE_RUNTIME_DIR/execution-diagnostics.tar.gz"
              "$RELEASE_RUNTIME_DIR/execution-diagnostics.sha256"
              "$RELEASE_RUNTIME_DIR/execution-diagnostic-summary.json"
              "$RELEASE_RUNTIME_DIR/execution-diagnostic-manifest.json"
            )
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Forecast Edge iteration — $GENERATED_AT" \
            --notes-file "$RELEASE_NOTES_PATH" \
            --latest=false \
            "${assets[@]}"

      - name: Create post-release Issue notification
        if: ${{ github.event.repository.private && vars.CREATE_TRADE_INTENT_ISSUE != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create \
            --title "Forecast Edge iteration — $GENERATED_AT" \
            --body-file "$ISSUE_BODY_PATH"
