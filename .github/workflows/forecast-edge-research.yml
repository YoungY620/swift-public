name: Forecast Edge private research

on:
  workflow_call:
    secrets:
      KIMI_CODE_API_KEY:
        required: false
      FORECAST_EDGE_MARKET_ACCOUNTS_JSON:
        required: false
    outputs:
      has-intents:
        value: ${{ jobs.research.outputs.has-intents }}
      trade-intents-sha256:
        value: ${{ jobs.research.outputs.trade-intents-sha256 }}
      release-tag:
        value: ${{ jobs.research.outputs.release-tag }}
      generated-at:
        value: ${{ jobs.research.outputs.generated-at }}

permissions: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
    outputs:
      has-intents: ${{ steps.artifact-handoff.outputs.has-intents }}
      trade-intents-sha256: ${{ steps.artifact-handoff.outputs.trade-intents-sha256 }}
      release-tag: ${{ steps.release-package.outputs.release-tag }}
      generated-at: ${{ steps.release-package.outputs.generated-at }}
    env:
      ENABLED_PREDICTION_MARKETS: ${{ vars.FORECAST_EDGE_MARKET_ADAPTERS }}
      MARKET_ACCOUNTS_JSON: ${{ secrets.FORECAST_EDGE_MARKET_ACCOUNTS_JSON }}
      HISTORY_RELEASE_COUNT: ${{ vars.FORECAST_EDGE_HISTORY_RELEASE_COUNT || '2' }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      ALLOW_PUBLIC_TRADE_INTENTS: ${{ vars.ALLOW_PUBLIC_TRADE_INTENTS || 'false' }}
      ALLOW_PUBLIC_RESEARCH_RELEASES: ${{ vars.ALLOW_PUBLIC_RESEARCH_RELEASES || 'false' }}
      KIMI_CODE_VERSION: "0.37.2"
      KIMI_MODEL_NAME: kimi-for-coding
      KIMI_MODEL_PROVIDER_TYPE: kimi
      KIMI_MODEL_BASE_URL: https://api.kimi.com/coding/v1
      KIMI_DISABLE_TELEMETRY: "1"
      KIMI_IDLE_TIMEOUT_SECONDS: "900"
      TRADE_INTENT_SCHEMA_PATH: ${{ github.workspace }}/schemas/trade-intent.schema.json
      MARKET_ADAPTER_REGISTRY: ${{ github.workspace }}/skills/forecast-edge/config/adapters.json
      MARKET_ADAPTER_GUIDE: ${{ github.workspace }}/skills/forecast-edge/references/market-adapters.md
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow configuration
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KIMI_MODEL_API_KEY" ]]; then
            echo "::error::Required Actions secret KIMI_CODE_API_KEY is not configured"
            exit 1
          fi
          if (( BASH_VERSINFO[0] < 4 )); then
            echo "::error::The research runner must expose Bash 4 or newer"
            exit 1
          fi
          for required_tool in awk curl find gh jq npm python3 setsid sha256sum stat stdbuf tar tee; do
            if ! command -v "$required_tool" >/dev/null; then
              echo "::error::The research runner is missing required tool: $required_tool"
              exit 1
            fi
          done
          if [[ -z "$ENABLED_PREDICTION_MARKETS" ]]; then
            echo "::error::Required repository variable FORECAST_EDGE_MARKET_ADAPTERS is not configured"
            exit 1
          fi
          if [[ -z "$MARKET_ACCOUNTS_JSON" ]]; then
            echo "::error::Required repository variable FORECAST_EDGE_MARKET_ACCOUNTS_JSON is not configured"
            exit 1
          fi
          enabled_adapters=${ENABLED_PREDICTION_MARKETS//[[:space:]]/}
          if [[ ! "$enabled_adapters" =~ ^[a-z][a-z0-9-]*(,[a-z][a-z0-9-]*)*$ ]]; then
            echo "::error::FORECAST_EDGE_MARKET_ADAPTERS must be a comma-separated adapter list"
            exit 1
          fi
          mapfile -t adapter_rows < <(tr ',' '\n' <<< "$enabled_adapters")
          if (( ${#adapter_rows[@]} != $(printf '%s\n' "${adapter_rows[@]}" | sort -u | wc -l) )); then
            echo "::error::FORECAST_EDGE_MARKET_ADAPTERS must not contain duplicates"
            exit 1
          fi
          registered_adapters=$(python3 skills/forecast-edge/scripts/market_data.py adapters)
          for adapter in "${adapter_rows[@]}"; do
            if ! jq -e --arg adapter "$adapter" '.adapters | index($adapter) != null' \
              <<< "$registered_adapters" >/dev/null; then
              echo "::error::Enabled prediction-market adapter is not registered: $adapter"
              exit 1
            fi
          done
          accounts_json=$MARKET_ACCOUNTS_JSON
          if ! jq -e --argjson expected "${#adapter_rows[@]}" '
            type == "object"
            and length == $expected
            and all(to_entries[];
              (.value | type) == "string" and (.value | length) > 0
            )
          ' <<< "$accounts_json" >/dev/null; then
            echo "::error::FORECAST_EDGE_MARKET_ACCOUNTS_JSON must contain exactly one non-empty string per enabled adapter"
            exit 1
          fi
          for adapter in "${adapter_rows[@]}"; do
            if ! jq -e --arg adapter "$adapter" 'has($adapter)' <<< "$accounts_json" >/dev/null; then
              echo "::error::No public account input is configured for adapter $adapter"
              exit 1
            fi
          done
          if [[ ! "$HISTORY_RELEASE_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::FORECAST_EDGE_HISTORY_RELEASE_COUNT must be an integer from 2 through 20"
            exit 1
          fi
          history_release_count=$((10#$HISTORY_RELEASE_COUNT))
          if (( history_release_count < 2 || history_release_count > 20 )); then
            echo "::error::FORECAST_EDGE_HISTORY_RELEASE_COUNT must be an integer from 2 through 20"
            exit 1
          fi
          if [[ "$REPOSITORY_PRIVATE" != "true" && "$ALLOW_PUBLIC_RESEARCH_RELEASES" != "true" ]]; then
            echo "::error::GitHub Releases inherit repository visibility; set ALLOW_PUBLIC_RESEARCH_RELEASES=true only after accepting public disclosure of iteration research reports"
            exit 1
          fi
          if [[ "$REPOSITORY_PRIVATE" != "true" && "$ALLOW_PUBLIC_TRADE_INTENTS" != "true" ]]; then
            echo "::error::The final Release publishes trade intents only after execution resolves; set ALLOW_PUBLIC_TRADE_INTENTS=true only after accepting that post-execution disclosure"
            exit 1
          fi
          runtime_dir="$RUNNER_TEMP/forecast-edge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          reports_dir="$runtime_dir/reports"
          release_assets_dir="$runtime_dir/release-assets"
          account_snapshots_dir="$runtime_dir/account-snapshots"
          mkdir -p "$runtime_dir" "$reports_dir" "$release_assets_dir" "$account_snapshots_dir"
          printf '%s\n' "$accounts_json" > "$runtime_dir/market-accounts.json"
          {
            echo "ENABLED_PREDICTION_MARKETS=$enabled_adapters"
            echo "RUNTIME_DIR=$runtime_dir"
            echo "REPORTS_DIR=$reports_dir"
            echo "MARKET_ACCOUNTS_PATH=$runtime_dir/market-accounts.json"
            echo "ACCOUNT_SNAPSHOTS_DIR=$account_snapshots_dir"
            echo "ACCOUNT_SNAPSHOTS_MANIFEST=$runtime_dir/account-snapshots-manifest.json"
            echo "TRADE_INTENTS_PATH=$runtime_dir/trade-intents.jsonl"
            echo "ORIGINAL_PROMPT_PATH=$runtime_dir/prompt.md"
            echo "REPAIR_PROMPT_PATH=$runtime_dir/repair-prompt.md"
            echo "VALIDATION_ERRORS_PATH=$runtime_dir/validation-errors.txt"
            echo "VALIDATION_SUMMARY_PATH=$runtime_dir/validation-summary.json"
            echo "REPORT_VALIDATION_PATH=$runtime_dir/report-validation.json"
            echo "NOTIFICATION_ITEMS_PATH=$runtime_dir/notification-items.json"
            echo "URL_VERIFICATION_PATH=$runtime_dir/url_verification.json"
            echo "BASELINE_REPORTS_PATH=$runtime_dir/baseline-reports.txt"
            echo "CURRENT_REPORTS_MANIFEST=$runtime_dir/current-reports-manifest.json"
            echo "HISTORY_RELEASE_TAGS_PATH=$runtime_dir/history-release-tags.json"
            echo "RELEASE_ASSETS_DIR=$release_assets_dir"
            echo "REPORT_ARCHIVE_PATH=$release_assets_dir/forecast-edge-research-report.tar.gz"
            echo "RELEASE_MANIFEST_PATH=$release_assets_dir/research-release-manifest.json"
            echo "RESEARCH_HANDOFF_ARCHIVE=$runtime_dir/research-handoff.tar.gz"
            echo "KIMI_CODE_HOME=$RUNNER_TEMP/kimi-code-home"
            echo "PYTHON_VENV_DIR=$runtime_dir/python-venv"
          } >> "$GITHUB_ENV"

      - name: Probe Kimi model availability
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          models=$(
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
              --header "Authorization: Bearer $KIMI_MODEL_API_KEY" \
              "$KIMI_MODEL_BASE_URL/models"
          )
          if ! jq -e --arg model "$KIMI_MODEL_NAME" \
            '.data | type == "array" and any(.[]; .id == $model)' \
            <<< "$models" >/dev/null; then
            echo "::error::Configured Kimi model is unavailable from the configured provider"
            exit 1
          fi
          echo "Kimi provider exposes the configured model"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-kimi-code-${{ env.KIMI_CODE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-kimi-code-

      - name: Install pinned Kimi Code CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@moonshot-ai/kimi-code@$KIMI_CODE_VERSION"
          kimi --version

      - name: Install JSON Schema validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$PYTHON_VENV_DIR"
          "$PYTHON_VENV_DIR/bin/python" -m pip install --disable-pip-version-check \
            --requirement automation/requirements-github-actions.txt
          echo "$PYTHON_VENV_DIR/bin" >> "$GITHUB_PATH"
          "$PYTHON_VENV_DIR/bin/python" -c 'import jsonschema'

      - name: Restore recent research Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS_DIR/reports"
          mapfile -t previous_tags < <(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --argjson limit "$HISTORY_RELEASE_COUNT" '
                map(.[]) |
                map(select(.draft == false and (.tag_name | startswith("forecast-edge-research/run-")))) |
                sort_by(.created_at) |
                reverse |
                .[0:$limit] |
                .[].tag_name
              '
          )
          printf '%s\n' "${previous_tags[@]}" |
            jq -Rsc 'split("\n") | map(select(length > 0))' > "$HISTORY_RELEASE_TAGS_PATH"

          total_expected_reports=0
          for index in "${!previous_tags[@]}"; do
            previous_tag=${previous_tags[$index]}
            restore_dir="$RUNNER_TEMP/forecast-edge-release-$GITHUB_RUN_ID-$index"
            mkdir -p "$restore_dir"
            gh release download "$previous_tag" \
              --pattern forecast-edge-research-report.tar.gz \
              --pattern research-release-manifest.json \
              --dir "$restore_dir"

            expected_digest=$(jq -er '.report_archive_sha256' "$restore_dir/research-release-manifest.json")
            actual_digest=$(sha256sum "$restore_dir/forecast-edge-research-report.tar.gz" | cut -d ' ' -f 1)
            manifest_schema=$(jq -er '.schema_version' "$restore_dir/research-release-manifest.json")
            manifest_lineage=$(jq -er '.lineage_id' "$restore_dir/research-release-manifest.json")
            manifest_repository=$(jq -er '.repository' "$restore_dir/research-release-manifest.json")
            manifest_tag=$(jq -er '.release_tag' "$restore_dir/research-release-manifest.json")
            manifest_commit=$(jq -er '.commit_sha' "$restore_dir/research-release-manifest.json")
            manifest_report_count=$(jq -er '.report_count' "$restore_dir/research-release-manifest.json")
            tag_commit=$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$previous_tag" --jq '.object.sha'
            )
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "::error::Research report archive digest does not match Release $previous_tag"
              exit 1
            fi
            if [[ "$manifest_schema" != "1.0" && "$manifest_schema" != "2.0" ]] || \
              [[ "$manifest_lineage" != "forecast-edge-production" ]]; then
              echo "::error::Research Release $previous_tag uses an unsupported manifest schema or lineage"
              exit 1
            fi
            if [[ "$manifest_repository" != "$GITHUB_REPOSITORY" || "$manifest_tag" != "$previous_tag" ]]; then
              echo "::error::Research Release manifest does not match this repository and tag"
              exit 1
            fi
            if [[ "$manifest_commit" != "$tag_commit" ]]; then
              echo "::error::Research Release tag does not point to its declared source commit"
              exit 1
            fi
            restored_report_rows="$restore_dir/report-rows.json"
            if [[ "$manifest_schema" == "1.0" ]]; then
              if [[ "$manifest_report_count" != "1" ]]; then
                echo "::error::Legacy research Release $previous_tag must contain exactly one report"
                exit 1
              fi
              if ! jq -e '
                select(
                  (.current_report_path | type) == "string"
                  and (.current_report_path | test("^reports/[^/]+/report[.]json$"))
                  and (.current_report_sha256 | type) == "string"
                  and (.current_report_sha256 | test("^[a-f0-9]{64}$"))
                )
                | [{
                    adapter: null,
                    path: .current_report_path,
                    sha256: .current_report_sha256
                  }]
              ' "$restore_dir/research-release-manifest.json" > "$restored_report_rows"; then
                echo "::error::Legacy research Release $previous_tag has an invalid report manifest"
                exit 1
              fi
            else
              if ! jq -e '
                .reports as $reports
                | ($reports | type == "array" and length > 0)
                  and (.report_count == ($reports | length))
                  and ([$reports[].adapter] | length == (unique | length))
                  and all($reports[];
                    (.adapter | type) == "string"
                    and (.adapter | test("^[a-z][a-z0-9-]{0,31}$"))
                    and (.path | type) == "string"
                    and (.path | test("^reports/[^/]+/report[.]json$"))
                    and (.sha256 | type) == "string"
                    and (.sha256 | test("^[a-f0-9]{64}$"))
                  )
                | select(.)
                | $reports
              ' "$restore_dir/research-release-manifest.json" > "$restored_report_rows"; then
                echo "::error::Research Release $previous_tag has an invalid multi-report manifest"
                exit 1
              fi
            fi
            total_expected_reports=$((total_expected_reports + manifest_report_count))

            reports_before=$(find "$REPORTS_DIR/reports" -type f -name report.json | wc -l | tr -d ' ')
            ARCHIVE_PATH="$restore_dir/forecast-edge-research-report.tar.gz" \
            DESTINATION="$REPORTS_DIR" \
            REPORT_ROWS="$restored_report_rows" \
              python3 - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import PurePosixPath

          with open(os.environ["REPORT_ROWS"], encoding="utf-8") as handle:
              rows = json.load(handle)
          expected_reports = {row["path"] for row in rows}
          expected_roots = {PurePosixPath(path).parts[1] for path in expected_reports}
          with tarfile.open(os.environ["ARCHIVE_PATH"], "r:gz") as archive:
              roots = set()
              report_paths = set()
              for member in archive.getmembers():
                  parts = PurePosixPath(member.name).parts
                  if len(parts) < 2 or parts[0] != "reports" or ".." in parts:
                      raise SystemExit(f"unexpected path in research archive: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported entry in research archive: {member.name}")
                  roots.add(parts[1])
                  if member.isfile() and len(parts) == 3 and parts[2] == "report.json":
                      report_paths.add(member.name)
              if roots != expected_roots or report_paths != expected_reports:
                  raise SystemExit("research archive does not match its report manifest")
              for report_root in roots:
                  destination = os.path.join(os.environ["DESTINATION"], "reports", report_root)
                  if os.path.exists(destination):
                      raise SystemExit(f"refusing to overwrite restored report: {report_root}")
              archive.extractall(os.environ["DESTINATION"])
          PY

            reports_after=$(find "$REPORTS_DIR/reports" -type f -name report.json | wc -l | tr -d ' ')
            if (( reports_after != reports_before + manifest_report_count )); then
              echo "::error::Research Release $previous_tag restored an unexpected report count"
              exit 1
            fi
            while IFS=$'\t' read -r report_path expected_report_digest; do
              actual_report_digest=$(sha256sum "$REPORTS_DIR/$report_path" | cut -d ' ' -f 1)
              if [[ "$actual_report_digest" != "$expected_report_digest" ]]; then
                echo "::error::Research report digest does not match Release $previous_tag"
                exit 1
              fi
            done < <(jq -r '.[] | [.path, .sha256] | @tsv' "$restored_report_rows")
          done

          restored_reports=$(find "$REPORTS_DIR/reports" -type f -name report.json | wc -l | tr -d ' ')
          if (( restored_reports != total_expected_reports )); then
            echo "::error::Restored report count does not match selected Release count"
            exit 1
          fi
          while IFS= read -r report; do
            python3 skills/forecast-edge/scripts/report_tool.py validate "$report" >/dev/null
          done < <(find "$REPORTS_DIR/reports" -type f -name report.json | sort)
          find "$REPORTS_DIR/reports" -type f -name report.json | sort > "$BASELINE_REPORTS_PATH"

      - name: Capture normalized account snapshots
        id: account-snapshots
        shell: bash
        run: |
          set -euo pipefail
          snapshot_rows="$RUNTIME_DIR/account-snapshot-rows.ndjson"
          : > "$snapshot_rows"
          IFS=',' read -ra adapters <<< "$ENABLED_PREDICTION_MARKETS"
          for adapter in "${adapters[@]}"; do
            account=$(jq -er --arg adapter "$adapter" '.[$adapter]' "$MARKET_ACCOUNTS_PATH")
            snapshot_path="$ACCOUNT_SNAPSHOTS_DIR/$adapter.json"
            python3 skills/forecast-edge/scripts/market_data.py \
              --adapter "$adapter" --pretty account "$account" > "$snapshot_path"
            if ! jq -e --arg adapter "$adapter" '
              .schema_version == "1.0"
              and .adapter == $adapter
              and (.account.identifier | type == "string" and length > 0)
              and (.portfolio.currency | type == "string" and length > 0)
              and (.positions.positions | type == "array")
            ' "$snapshot_path" >/dev/null; then
              echo "::error::Adapter $adapter returned an invalid normalized account snapshot"
              exit 1
            fi
            jq -cn --arg adapter "$adapter" --arg path "$snapshot_path" \
              '{key: $adapter, value: $path}' >> "$snapshot_rows"
          done
          jq -s '{schema_version: "1.0", snapshots: (from_entries)}' \
            "$snapshot_rows" > "$ACCOUNT_SNAPSHOTS_MANIFEST"
          snapshot_digest=$(
            python3 - "$ACCOUNT_SNAPSHOTS_MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from validate_research_iteration import account_snapshot_bundle_sha256

          print(account_snapshot_bundle_sha256(Path(sys.argv[1])))
          PY
          )
          echo "sha256=$snapshot_digest" >> "$GITHUB_OUTPUT"

      - name: Render initial and repair prompts
        shell: bash
        run: |
          set -euo pipefail
          render_prompt() {
            local source=$1
            local text
            text=$(<"$source")
            text=${text//'{{OUTPUT_ROOT}}'/$REPORTS_DIR}
            text=${text//'{{REPOSITORY_ROOT}}'/$GITHUB_WORKSPACE}
            text=${text//'{{PUBLIC_BRIEF_PATH}}'/DISABLED}
            text=${text//'{{ENABLED_PREDICTION_MARKETS}}'/$ENABLED_PREDICTION_MARKETS}
            text=${text//'{{ACCOUNT_SNAPSHOTS_MANIFEST}}'/$ACCOUNT_SNAPSHOTS_MANIFEST}
            text=${text//'{{MARKET_ADAPTER_REGISTRY}}'/$MARKET_ADAPTER_REGISTRY}
            text=${text//'{{MARKET_ADAPTER_GUIDE}}'/$MARKET_ADAPTER_GUIDE}
            text=${text//'{{EXPECTED_REPORT_COUNT}}'/$(awk -F, '{print NF}' <<< "$ENABLED_PREDICTION_MARKETS")}
            text=${text//'{{TRADE_INTENTS_PATH}}'/$TRADE_INTENTS_PATH}
            text=${text//'{{TRADE_INTENT_SCHEMA_PATH}}'/$TRADE_INTENT_SCHEMA_PATH}
            text=${text//'{{ORIGINAL_PROMPT_PATH}}'/$ORIGINAL_PROMPT_PATH}
            text=${text//'{{VALIDATION_ERRORS_PATH}}'/$VALIDATION_ERRORS_PATH}
            text=${text//'{{BASELINE_REPORTS_PATH}}'/$BASELINE_REPORTS_PATH}
            printf '%s\n' "$text"
          }

          render_prompt automation/prompts/scheduled-scan.zh-CN.md > "$ORIGINAL_PROMPT_PATH"
          printf '\n' >> "$ORIGINAL_PROMPT_PATH"
          render_prompt automation/prompts/trade-intents.zh-CN.md >> "$ORIGINAL_PROMPT_PATH"
          render_prompt automation/prompts/repair-trade-intents.zh-CN.md > "$REPAIR_PROMPT_PATH"

          if grep -Eq '\{\{[^}]+\}\}' "$ORIGINAL_PROMPT_PATH" "$REPAIR_PROMPT_PATH"; then
            echo "::error::Rendered prompts contain unresolved placeholders"
            exit 1
          fi

      - name: Run Kimi Code — initial attempt
        id: kimi-initial
        continue-on-error: true
        timeout-minutes: 120
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set +e
          # Kimi Code prompt mode (-p) uses auto permission by default; no
          # separate interactive approval-mode flag is valid here.
          scripts/run_kimi_code_with_idle_timeout.sh \
            --idle-seconds "$KIMI_IDLE_TIMEOUT_SECONDS" \
            --poll-seconds 10 \
            --stdout-log "$RUNTIME_DIR/kimi-attempt-1.stream.jsonl" \
            --stderr-log "$RUNTIME_DIR/kimi-attempt-1.stderr" \
            --activity-root "$KIMI_CODE_HOME/sessions" \
            -- kimi --skills-dir "$GITHUB_WORKSPACE/skills" \
              --output-format stream-json \
              -p "$(<"$ORIGINAL_PROMPT_PATH")"
          status=$?
          set -e
          if (( status != 0 )); then
            echo "::error::Kimi initial attempt failed; private diagnostics were retained for repair"
            exit "$status"
          fi

      - name: Validate initial trade intents
        id: validate-initial
        continue-on-error: true
        env:
          KIMI_OUTCOME: ${{ steps.kimi-initial.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KIMI_OUTCOME" != "success" ]]; then
            echo "Kimi initial attempt exited unsuccessfully." > "$VALIDATION_ERRORS_PATH"
            exit 1
          fi
          if ! python3 scripts/validate_research_iteration.py \
            --reports-root "$REPORTS_DIR" \
            --baseline-reports "$BASELINE_REPORTS_PATH" \
            --enabled-venues "$ENABLED_PREDICTION_MARKETS" \
            --trade-intents "$TRADE_INTENTS_PATH" \
            --trade-schema "$TRADE_INTENT_SCHEMA_PATH" \
            --account-snapshots-manifest "$ACCOUNT_SNAPSHOTS_MANIFEST" \
            --expected-account-snapshots-sha256 "${{ steps.account-snapshots.outputs.sha256 }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --adapter-registry "$MARKET_ADAPTER_REGISTRY" \
            --current-reports-manifest "$CURRENT_REPORTS_MANIFEST" \
            --report-validation "$REPORT_VALIDATION_PATH" \
            --validation-summary "$VALIDATION_SUMMARY_PATH" \
            > "$RUNTIME_DIR/iteration-validation.stdout" 2> "$VALIDATION_ERRORS_PATH"; then
            echo "::error::Private research iteration validation failed"
            exit 1
          fi
          echo "Private report and trade intents passed validation"

      - name: Run Kimi Code — repair 1 of 3
        id: kimi-repair-1
        if: ${{ steps.validate-initial.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 120
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set +e
          # Kimi Code prompt mode is already unattended and auto-approved.
          scripts/run_kimi_code_with_idle_timeout.sh \
            --idle-seconds "$KIMI_IDLE_TIMEOUT_SECONDS" \
            --poll-seconds 10 \
            --stdout-log "$RUNTIME_DIR/kimi-attempt-2.stream.jsonl" \
            --stderr-log "$RUNTIME_DIR/kimi-attempt-2.stderr" \
            --activity-root "$KIMI_CODE_HOME/sessions" \
            -- kimi --skills-dir "$GITHUB_WORKSPACE/skills" \
              --output-format stream-json \
              -p "$(<"$REPAIR_PROMPT_PATH")"
          status=$?
          set -e
          if (( status != 0 )); then
            echo "::error::Kimi repair attempt 1 failed; private diagnostics were retained"
            exit "$status"
          fi

      - name: Validate repaired trade intents — 1 of 3
        id: validate-repair-1
        if: ${{ steps.validate-initial.outcome == 'failure' }}
        continue-on-error: true
        env:
          KIMI_OUTCOME: ${{ steps.kimi-repair-1.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KIMI_OUTCOME" != "success" ]]; then
            echo "Kimi repair 1 exited unsuccessfully." > "$VALIDATION_ERRORS_PATH"
            exit 1
          fi
          if ! python3 scripts/validate_research_iteration.py \
            --reports-root "$REPORTS_DIR" \
            --baseline-reports "$BASELINE_REPORTS_PATH" \
            --enabled-venues "$ENABLED_PREDICTION_MARKETS" \
            --trade-intents "$TRADE_INTENTS_PATH" \
            --trade-schema "$TRADE_INTENT_SCHEMA_PATH" \
            --account-snapshots-manifest "$ACCOUNT_SNAPSHOTS_MANIFEST" \
            --expected-account-snapshots-sha256 "${{ steps.account-snapshots.outputs.sha256 }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --adapter-registry "$MARKET_ADAPTER_REGISTRY" \
            --current-reports-manifest "$CURRENT_REPORTS_MANIFEST" \
            --report-validation "$REPORT_VALIDATION_PATH" \
            --validation-summary "$VALIDATION_SUMMARY_PATH" \
            > "$RUNTIME_DIR/iteration-validation.stdout" 2> "$VALIDATION_ERRORS_PATH"; then
            echo "::error::Private research iteration validation failed"
            exit 1
          fi
          echo "Private report and trade intents passed validation"

      - name: Run Kimi Code — repair 2 of 3
        id: kimi-repair-2
        if: ${{ steps.validate-repair-1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 120
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set +e
          # Kimi Code prompt mode is already unattended and auto-approved.
          scripts/run_kimi_code_with_idle_timeout.sh \
            --idle-seconds "$KIMI_IDLE_TIMEOUT_SECONDS" \
            --poll-seconds 10 \
            --stdout-log "$RUNTIME_DIR/kimi-attempt-3.stream.jsonl" \
            --stderr-log "$RUNTIME_DIR/kimi-attempt-3.stderr" \
            --activity-root "$KIMI_CODE_HOME/sessions" \
            -- kimi --skills-dir "$GITHUB_WORKSPACE/skills" \
              --output-format stream-json \
              -p "$(<"$REPAIR_PROMPT_PATH")"
          status=$?
          set -e
          if (( status != 0 )); then
            echo "::error::Kimi repair attempt 2 failed; private diagnostics were retained"
            exit "$status"
          fi

      - name: Validate repaired trade intents — 2 of 3
        id: validate-repair-2
        if: ${{ steps.validate-repair-1.outcome == 'failure' }}
        continue-on-error: true
        env:
          KIMI_OUTCOME: ${{ steps.kimi-repair-2.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KIMI_OUTCOME" != "success" ]]; then
            echo "Kimi repair 2 exited unsuccessfully." > "$VALIDATION_ERRORS_PATH"
            exit 1
          fi
          if ! python3 scripts/validate_research_iteration.py \
            --reports-root "$REPORTS_DIR" \
            --baseline-reports "$BASELINE_REPORTS_PATH" \
            --enabled-venues "$ENABLED_PREDICTION_MARKETS" \
            --trade-intents "$TRADE_INTENTS_PATH" \
            --trade-schema "$TRADE_INTENT_SCHEMA_PATH" \
            --account-snapshots-manifest "$ACCOUNT_SNAPSHOTS_MANIFEST" \
            --expected-account-snapshots-sha256 "${{ steps.account-snapshots.outputs.sha256 }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --adapter-registry "$MARKET_ADAPTER_REGISTRY" \
            --current-reports-manifest "$CURRENT_REPORTS_MANIFEST" \
            --report-validation "$REPORT_VALIDATION_PATH" \
            --validation-summary "$VALIDATION_SUMMARY_PATH" \
            > "$RUNTIME_DIR/iteration-validation.stdout" 2> "$VALIDATION_ERRORS_PATH"; then
            echo "::error::Private research iteration validation failed"
            exit 1
          fi
          echo "Private report and trade intents passed validation"

      - name: Run Kimi Code — repair 3 of 3
        id: kimi-repair-3
        if: ${{ steps.validate-repair-2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 120
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set +e
          # Kimi Code prompt mode is already unattended and auto-approved.
          scripts/run_kimi_code_with_idle_timeout.sh \
            --idle-seconds "$KIMI_IDLE_TIMEOUT_SECONDS" \
            --poll-seconds 10 \
            --stdout-log "$RUNTIME_DIR/kimi-attempt-4.stream.jsonl" \
            --stderr-log "$RUNTIME_DIR/kimi-attempt-4.stderr" \
            --activity-root "$KIMI_CODE_HOME/sessions" \
            -- kimi --skills-dir "$GITHUB_WORKSPACE/skills" \
              --output-format stream-json \
              -p "$(<"$REPAIR_PROMPT_PATH")"
          status=$?
          set -e
          if (( status != 0 )); then
            echo "::error::Kimi repair attempt 3 failed; private diagnostics were retained"
            exit "$status"
          fi

      - name: Validate repaired trade intents — 3 of 3
        id: validate-repair-3
        if: ${{ steps.validate-repair-2.outcome == 'failure' }}
        continue-on-error: true
        env:
          KIMI_OUTCOME: ${{ steps.kimi-repair-3.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$KIMI_OUTCOME" != "success" ]]; then
            echo "Kimi repair 3 exited unsuccessfully." > "$VALIDATION_ERRORS_PATH"
            exit 1
          fi
          if ! python3 scripts/validate_research_iteration.py \
            --reports-root "$REPORTS_DIR" \
            --baseline-reports "$BASELINE_REPORTS_PATH" \
            --enabled-venues "$ENABLED_PREDICTION_MARKETS" \
            --trade-intents "$TRADE_INTENTS_PATH" \
            --trade-schema "$TRADE_INTENT_SCHEMA_PATH" \
            --account-snapshots-manifest "$ACCOUNT_SNAPSHOTS_MANIFEST" \
            --expected-account-snapshots-sha256 "${{ steps.account-snapshots.outputs.sha256 }}" \
            --repository-root "$GITHUB_WORKSPACE" \
            --adapter-registry "$MARKET_ADAPTER_REGISTRY" \
            --current-reports-manifest "$CURRENT_REPORTS_MANIFEST" \
            --report-validation "$REPORT_VALIDATION_PATH" \
            --validation-summary "$VALIDATION_SUMMARY_PATH" \
            > "$RUNTIME_DIR/iteration-validation.stdout" 2> "$VALIDATION_ERRORS_PATH"; then
            echo "::error::Private research iteration validation failed"
            exit 1
          fi
          echo "Private report and trade intents passed validation"

      - name: Enforce retry limit
        if: ${{ always() }}
        env:
          INITIAL_VALIDATION: ${{ steps.validate-initial.outcome }}
          REPAIR_1_VALIDATION: ${{ steps.validate-repair-1.outcome }}
          REPAIR_2_VALIDATION: ${{ steps.validate-repair-2.outcome }}
          REPAIR_3_VALIDATION: ${{ steps.validate-repair-3.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INITIAL_VALIDATION" == "success" || \
                "$REPAIR_1_VALIDATION" == "success" || \
                "$REPAIR_2_VALIDATION" == "success" || \
                "$REPAIR_3_VALIDATION" == "success" ]]; then
            exit 0
          fi
          echo "::error::Trade intents failed validation after the initial attempt and three repairs"
          exit 1

      - name: Resolve and verify published market URLs
        shell: bash
        run: |
          set -euo pipefail
          notification_rows="$RUNTIME_DIR/notification-items.ndjson"
          verification_rows="$RUNTIME_DIR/url-verification.ndjson"
          : > "$notification_rows"
          : > "$verification_rows"
          intent_count=$(jq -s 'length' "$TRADE_INTENTS_PATH")
          declare -A claimed_intents=()
          actionable_count=0
          while IFS=$'\t' read -r venue current_report; do
            mapfile -t action_indexes < <(
              jq -r '
                .actions
                | to_entries[]
                | select(.value.action != "MAINTAIN")
                | .key
              ' "$current_report"
            )
            actionable_count=$((actionable_count + ${#action_indexes[@]}))

            for action_index in "${action_indexes[@]}"; do
              action=$(jq -c --argjson index "$action_index" '.actions[$index]' "$current_report")
              action_name=$(jq -r '.action' <<< "$action")
              market_id=$(jq -r '.market_id | tostring' <<< "$action")
              outcome=$(jq -r '.outcome | ascii_downcase' <<< "$action")
              case "$action_name" in
                BUY|ADD) expected_side=buy ;;
                SELL|TRIM) expected_side=sell ;;
                *)
                  echo "::error::Unsupported actionable report entry: $action_name"
                  exit 1
                  ;;
              esac

              analysis_count=$(jq --arg market_id "$market_id" '
                [.current_positions[], .candidates[]]
                | map(select((.market.id | tostring) == $market_id))
                | length
              ' "$current_report")
              if [[ "$analysis_count" != "1" ]]; then
                echo "::error::$venue action $action_index does not have exactly one matching market analysis"
                exit 1
              fi
              analysis=$(jq -c --arg market_id "$market_id" '
                [.current_positions[], .candidates[]]
                | map(select((.market.id | tostring) == $market_id))[0]
              ' "$current_report")
              market_identifier=$(jq -er '.market.multi_market_identifier' <<< "$analysis")
              instrument_identifier=$(jq -er '.market.instrument_identifier' <<< "$analysis")

              matches=$(jq -s \
                --arg venue "$venue" \
                --arg market_identifier "$market_identifier" \
                --arg instrument_identifier "$instrument_identifier" \
                --arg outcome "$outcome" \
                --arg side "$expected_side" \
                --arg reference_price "$(jq -r '.execution.vwap | tostring' <<< "$action")" \
                --arg notional "$(jq -r '.execution.gross_cash | tostring' <<< "$action")" \
                --arg quantity "$(jq -r '.execution.shares | tostring' <<< "$action")" '
                  to_entries
                  | map(select(
                      .value.venue == $venue
                      and .value.multi_market_identifier == $market_identifier
                      and .value.instrument_identifier == $instrument_identifier
                      and .value.outcome == $outcome
                      and .value.side == $side
                      and (.value.reference_price | tonumber) == ($reference_price | tonumber)
                      and (.value.quantity | tonumber) == ($quantity | tonumber)
                      and ((.value.notional | tonumber) - ($notional | tonumber) | fabs) <= 0.01
                    ))
                ' "$TRADE_INTENTS_PATH")

              mapfile -t unclaimed_matches < <(
                while IFS= read -r candidate_index; do
                  if [[ -z "${claimed_intents[$candidate_index]:-}" ]]; then
                    printf '%s\n' "$candidate_index"
                  fi
                done < <(jq -r '.[].key' <<< "$matches")
              )
              if (( ${#unclaimed_matches[@]} != 1 )); then
                echo "::error::$venue action $action_index does not map unambiguously to one JSONL routing target"
                exit 1
              fi
              intent_index=${unclaimed_matches[0]}
              claimed_intents[$intent_index]=1
              intent=$(jq -cs --argjson index "$intent_index" '.[$index]' "$TRADE_INTENTS_PATH")

              canonical=$(
                python3 skills/forecast-edge/scripts/market_data.py \
                  --adapter "$venue" canonical-url "$market_identifier"
              )
              if ! jq -e \
                --arg venue "$venue" \
                --arg market_identifier "$market_identifier" '
                  .adapter == $venue
                  and .market_identifier == $market_identifier
                  and (.url | type == "string" and length > 0)
                ' <<< "$canonical" >/dev/null; then
                echo "::error::$venue adapter returned a canonical URL for a different market"
                exit 1
              fi
              market_url=$(jq -r '.url' <<< "$canonical")
              verification_result=$(
                curl --location --fail-with-body --silent --show-error \
                  --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                  --output /dev/null \
                  --write-out $'%{http_code}\t%{url_effective}' \
                  "$market_url"
              )
              IFS=$'\t' read -r http_status effective_url <<< "$verification_result"
              if [[ "$http_status" != "200" ]]; then
                echo "::error::Published market URL did not return HTTP 200: $market_url"
                exit 1
              fi
              if ! python3 - "$effective_url" <<'PY'
          import sys
          from urllib.parse import urlsplit

          parsed = urlsplit(sys.argv[1])
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("effective market URL is not HTTPS")
          PY
              then
                echo "::error::Published market URL redirected outside HTTPS"
                exit 1
              fi
              verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

              jq -cn \
                --arg venue "$venue" \
                --arg market_id "$market_id" \
                --arg multi_market_identifier "$market_identifier" \
                --arg instrument_identifier "$instrument_identifier" \
                --arg market_url "$market_url" \
                --arg effective_url "$effective_url" \
                --arg verified_at "$verified_at" \
                --argjson http_status "$http_status" \
                '{
                  venue: $venue,
                  research_market_id: $market_id,
                  multi_market_identifier: $multi_market_identifier,
                  instrument_identifier: $instrument_identifier,
                  market_url: $market_url,
                  effective_url: $effective_url,
                  http_status: $http_status,
                  verified_at: $verified_at
                }' >> "$verification_rows"
              jq -cn \
                --argjson action "$action" \
                --argjson analysis "$analysis" \
                --argjson intent "$intent" \
                --arg url "$market_url" '
                  {
                    venue: $intent.venue,
                    multi_market_identifier: $intent.multi_market_identifier,
                    instrument_identifier: $intent.instrument_identifier,
                    market_question: $action.market_question,
                    action: $action.action,
                    outcome: $intent.outcome,
                    side: $intent.side,
                    reference_price: $intent.reference_price,
                    notional: $intent.notional,
                    quantity: $intent.quantity,
                    currency: $intent.currency,
                    model_value: ($analysis.model.model_value | tostring),
                    net_edge: ($analysis.opportunity.net_edge | tostring),
                    reason: $action.public_reason,
                    url: $url
                  }
                ' >> "$notification_rows"
            done
          done < <(jq -r '.reports[] | [.adapter, .path] | @tsv' "$CURRENT_REPORTS_MANIFEST")

          if (( actionable_count != intent_count )); then
            echo "::error::Actionable report entries do not match the validated JSONL item count"
            exit 1
          fi

          if (( ${#claimed_intents[@]} != intent_count )); then
            echo "::error::At least one JSONL item was not linked to a verified market URL"
            exit 1
          fi
          jq -s '.' "$notification_rows" > "$NOTIFICATION_ITEMS_PATH"
          jq -s '.' "$verification_rows" > "$URL_VERIFICATION_PATH"
          if ! jq -e --argjson expected "$intent_count" '
            type == "array"
            and length == $expected
            and all(.[]; .http_status == 200)
          ' "$URL_VERIFICATION_PATH" >/dev/null; then
            echo "::error::URL verification coverage is incomplete"
            exit 1
          fi
          echo "Verified $intent_count published market URL(s)"

      - name: Build current-iteration research Release
        id: release-package
        shell: bash
        run: |
          set -euo pipefail
          successful_attempt=4
          if [[ "${{ steps.validate-initial.outcome }}" == "success" ]]; then
            successful_attempt=1
          elif [[ "${{ steps.validate-repair-1.outcome }}" == "success" ]]; then
            successful_attempt=2
          elif [[ "${{ steps.validate-repair-2.outcome }}" == "success" ]]; then
            successful_attempt=3
          fi
          generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          release_tag="forecast-edge-research/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          history_releases_used=$(jq 'length' "$HISTORY_RELEASE_TAGS_PATH")
          report_count=$(jq '.reports | length' "$CURRENT_REPORTS_MANIFEST")
          release_report_rows="$RUNTIME_DIR/release-report-rows.ndjson"
          : > "$release_report_rows"
          declare -a current_report_directories=()

          while IFS=$'\t' read -r adapter current_report current_report_dir; do
            current_report_relative=${current_report#"$REPORTS_DIR/"}
            current_report_dir_relative=${current_report_dir#"$REPORTS_DIR/"}
            if [[ "$current_report_relative" == "$current_report" || \
                  "$current_report_dir_relative" == "$current_report_dir" ]]; then
              echo "::error::Current report is outside the runtime report root"
              exit 1
            fi
            current_report_directories+=("$current_report_dir_relative")
            json_asset="report-$adapter.json"
            markdown_asset="report-$adapter.md"
            cp "$current_report" "$RELEASE_ASSETS_DIR/$json_asset"
            cp "$current_report_dir/report.md" "$RELEASE_ASSETS_DIR/$markdown_asset"
            report_digest=$(sha256sum "$current_report" | cut -d ' ' -f 1)
            jq -cn \
              --arg adapter "$adapter" \
              --arg path "$current_report_relative" \
              --arg sha256 "$report_digest" \
              --arg json_asset "$json_asset" \
              --arg markdown_asset "$markdown_asset" \
              '{
                adapter: $adapter,
                path: $path,
                sha256: $sha256,
                json_asset: $json_asset,
                markdown_asset: $markdown_asset
              }' >> "$release_report_rows"
          done < <(
            jq -r '.reports | sort_by(.adapter)[] | [.adapter, .path, .directory] | @tsv' \
              "$CURRENT_REPORTS_MANIFEST"
          )

          cp "$VALIDATION_SUMMARY_PATH" "$RELEASE_ASSETS_DIR/validation-summary.json"
          tar -C "$REPORTS_DIR" -czf "$REPORT_ARCHIVE_PATH" \
            "${current_report_directories[@]}"
          jq -s '.' "$release_report_rows" > "$RUNTIME_DIR/release-reports.json"

          report_archive_digest=$(sha256sum "$REPORT_ARCHIVE_PATH" | cut -d ' ' -f 1)
          trade_intents_digest=$(sha256sum "$TRADE_INTENTS_PATH" | cut -d ' ' -f 1)
          jq -n \
            --arg schema_version "2.0" \
            --arg lineage_id "forecast-edge-production" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$release_tag" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg generated_at "$generated_at" \
            --arg report_archive_asset "forecast-edge-research-report.tar.gz" \
            --arg report_archive_sha256 "$report_archive_digest" \
            --arg trade_intents_sha256 "$trade_intents_digest" \
            --argjson history_release_count_requested "$HISTORY_RELEASE_COUNT" \
            --argjson report_count "$report_count" \
            --argjson successful_kimi_attempt "$successful_attempt" \
            --slurpfile history_releases "$HISTORY_RELEASE_TAGS_PATH" \
            --slurpfile reports "$RUNTIME_DIR/release-reports.json" \
            --slurpfile validation "$VALIDATION_SUMMARY_PATH" \
            '{
              schema_version: $schema_version,
              lineage_id: $lineage_id,
              repository: $repository,
              release_tag: $release_tag,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt,
              commit_sha: $commit_sha,
              generated_at: $generated_at,
              report_count: $report_count,
              reports: $reports[0],
              report_archive_asset: $report_archive_asset,
              report_archive_sha256: $report_archive_sha256,
              history_release_count_requested: $history_release_count_requested,
              history_releases_used: $history_releases[0],
              successful_kimi_attempt: $successful_kimi_attempt,
              trade_intents_sha256: $trade_intents_sha256,
              validation: $validation[0]
            }' > "$RELEASE_MANIFEST_PATH"

          {
            printf 'Forecast Edge research for this iteration.\n\n'
            printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Workflow run: `%s`, attempt `%s`\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Reports in this Release: `%s`\n' "$report_count"
            printf -- '- Prior Releases loaded for rolling context: `%s`\n' "$history_releases_used"
          } > "$RUNTIME_DIR/release-notes.md"

          echo "generated-at=$generated_at" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Format Issue notification
        env:
          GENERATED_AT: ${{ steps.release-package.outputs.generated-at }}
          RELEASE_TAG: ${{ steps.release-package.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          item_count=$(jq -r '.items' "$VALIDATION_SUMMARY_PATH")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(<automation/templates/trade-intents-issue.md)
          body=${body//'{{RUN_URL}}'/$run_url}
          body=${body//'{{COMMIT_SHA}}'/$GITHUB_SHA}
          body=${body//'{{GENERATED_AT}}'/$GENERATED_AT}
          body=${body//'{{ITEM_COUNT}}'/$item_count}
          body=${body//'{{RELEASE_TAG}}'/$RELEASE_TAG}
          printf '%s\n\n' "$body" > "$RUNTIME_DIR/issue.md"
          if [[ "$(jq 'length' "$NOTIFICATION_ITEMS_PATH")" -gt 0 ]]; then
            jq -r '
              .[]
              | "**\(.action) \(.outcome | ascii_upcase)｜\(.market_question)**\n\n"
                + "- 预测市场：\(.venue)\n"
                + "- 市场标识：`\(.multi_market_identifier)`\n"
                + "- AI 模型价值：\(.model_value)\n"
                + "- 参考价格：\(.reference_price)\n"
                + "- 净优势：\(.net_edge)\n"
                + "- 交易金额：\(.notional) \(.currency)\n"
                + "- 交易份额：\(.quantity)\n"
                + "- 理由：\(.reason)\n"
                + "- [打开已验证的市场页面](\(.url))\n"
            ' "$NOTIFICATION_ITEMS_PATH" >> "$RUNTIME_DIR/issue.md"
          else
            printf '_本轮没有通过策略门槛且需要执行的交易意图。_\n' >> "$RUNTIME_DIR/issue.md"
          fi

      - name: Build secret-free research artifact handoff
        id: artifact-handoff
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          handoff_root="$RUNTIME_DIR/artifact-handoff"
          artifact_root="$RUNTIME_DIR/research-artifact"
          install -d -m 700 "$handoff_root/release-assets"
          install -d -m 700 "$artifact_root"
          install -m 600 "$REPORT_ARCHIVE_PATH" "$handoff_root/release-assets/"
          install -m 600 "$RELEASE_MANIFEST_PATH" "$handoff_root/release-assets/"
          install -m 600 "$RELEASE_ASSETS_DIR/validation-summary.json" \
            "$handoff_root/release-assets/"
          while IFS= read -r asset; do
            if [[ ! "$asset" =~ ^report-[a-z][a-z0-9-]*\.(json|md)$ ]]; then
              echo "::error::Research manifest contains an unsafe direct report asset"
              exit 1
            fi
            install -m 600 "$RELEASE_ASSETS_DIR/$asset" "$handoff_root/release-assets/"
          done < <(
            jq -r '.reports[] | .json_asset, .markdown_asset' "$RELEASE_MANIFEST_PATH" | sort -u
          )
          install -m 600 "$RUNTIME_DIR/release-notes.md" "$handoff_root/"
          install -m 600 "$RUNTIME_DIR/issue.md" "$handoff_root/"
          trade_intents_digest=$(sha256sum "$TRADE_INTENTS_PATH" | cut -d ' ' -f 1)
          has_intents=false
          if [[ -s "$TRADE_INTENTS_PATH" ]]; then
            has_intents=true
          fi

          secret_pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|0x[0-9a-fA-F]{130}|[Aa]uthorization[[:space:]]*:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}|[Pp]assword[[:space:]]*[:=][[:space:]]*[^[:space:]]{8,}'
          archive_scan="$RUNTIME_DIR/research-archive-scan"
          install -d -m 700 "$archive_scan"
          tar -xzf "$REPORT_ARCHIVE_PATH" -C "$archive_scan"
          if grep -RFq -- "$KIMI_MODEL_API_KEY" \
               "$handoff_root" "$archive_scan" "$TRADE_INTENTS_PATH" || \
             LC_ALL=C grep -RIEq -- "$secret_pattern" \
               "$handoff_root" "$archive_scan" "$TRADE_INTENTS_PATH"; then
            echo "::error::Research handoff contains protected credential-like material"
            exit 1
          fi
          find "$archive_scan" -depth -delete

          tar -C "$handoff_root" -czf "$RESEARCH_HANDOFF_ARCHIVE" \
            release-assets release-notes.md issue.md
          install -m 600 "$RESEARCH_HANDOFF_ARCHIVE" "$artifact_root/"
          install -m 600 "$TRADE_INTENTS_PATH" "$artifact_root/trade-intents.jsonl"
          printf '%s  %s\n' "$trade_intents_digest" trade-intents.jsonl \
            > "$artifact_root/trade-intents.sha256"
          chmod 600 "$artifact_root/trade-intents.sha256"
          echo "has-intents=$has_intents" >> "$GITHUB_OUTPUT"
          echo "trade-intents-sha256=$trade_intents_digest" >> "$GITHUB_OUTPUT"

      - name: Upload research handoff for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: forecast-edge-research-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forecast-edge-${{ github.run_id }}-${{ github.run_attempt }}/research-artifact
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Prepare secret-free research diagnostics
        id: research-diagnostics
        if: ${{ always() }}
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_root="$RUNNER_TEMP/forecast-edge-research-diagnostics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          staging_root="$diagnostics_root.staging"
          find "$staging_root" -depth -delete 2>/dev/null || true
          install -d -m 700 "$staging_root/runtime" "$staging_root/kimi-sessions"
          jq -n \
            --arg schema_version "1.0" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg commit_sha "$GITHUB_SHA" \
            '{schema_version:$schema_version,repository:$repository,workflow_run_id:$run_id,workflow_run_attempt:$run_attempt,commit_sha:$commit_sha}' \
            > "$staging_root/diagnostic-metadata.json"
          chmod 600 "$staging_root/diagnostic-metadata.json"
          if [[ -n "${RUNTIME_DIR:-}" && -d "$RUNTIME_DIR" ]]; then
            for candidate in \
              kimi-attempt-*.stream.jsonl kimi-attempt-*.stderr \
              iteration-validation.stdout validation-errors.txt validation-summary.json \
              report-validation.json current-reports-manifest.json \
              history-release-tags.json url_verification.json; do
              while IFS= read -r source; do
                install -m 600 "$source" "$staging_root/runtime/$(basename "$source")"
              done < <(find "$RUNTIME_DIR" -maxdepth 1 -type f -name "$candidate" -print)
            done
          fi
          if [[ -n "${KIMI_CODE_HOME:-}" && -d "$KIMI_CODE_HOME/sessions" ]]; then
            while IFS= read -r source; do
              relative=${source#"$KIMI_CODE_HOME/sessions/"}
              destination="$staging_root/kimi-sessions/$relative"
              install -d -m 700 "$(dirname "$destination")"
              install -m 600 "$source" "$destination"
            done < <(
              find "$KIMI_CODE_HOME/sessions" -type f \
                \( -name wire.jsonl -o -name output.log \) -print
            )
          fi
          secret_pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|0x[0-9a-fA-F]{130}|[Aa]uthorization[[:space:]]*:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}|[Pp]assword[[:space:]]*[:=][[:space:]]*[^[:space:]]{8,}'
          exact_secret_found=false
          if [[ -n "$KIMI_MODEL_API_KEY" ]] && \
             grep -RFq -- "$KIMI_MODEL_API_KEY" "$staging_root"; then
            exact_secret_found=true
          fi
          if [[ "$exact_secret_found" == "true" ]] || \
             LC_ALL=C grep -RIEq -- "$secret_pattern" "$staging_root"; then
            find "$staging_root" -depth -delete
            echo "::error::Research diagnostics contain protected credential-like material"
            exit 1
          fi
          find "$diagnostics_root" -depth -delete 2>/dev/null || true
          mv "$staging_root" "$diagnostics_root"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload research diagnostics for post-run Judge
        if: ${{ always() && steps.research-diagnostics.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: forecast-edge-research-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forecast-edge-research-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
